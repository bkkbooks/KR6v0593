body:
  text: 大乘是佛說論民國三十二年冬覆僧愍等書一序起來信所說的若當日佛陀未曾說過大乘則其餘大乘亦應如真常系一切皆為後人之懸想産物若佛陀當日曾說大乘不知某些大乘是佛所說這確是極重要的問題是值得提出論究的你們的提出這一問題好像是懷疑大乘而實是不能忘情於真常唯心論信仰是應該堅強的是不可隨便的因他人而輕易放棄自己的這是應有的態度問題既然極其重要我當然願意來研究一下提供我的意見而且站在另一對方的你們不是也時常聽見嗎他們以形式的信仰為滿足公然的宣說大乘非佛說自稱所信的為佛說或稱為原始佛教這種糊塗的信仰與抹煞引佛教走上了黑暗的歧途我們有信佛與護法的熱忱應該好好的論究他起來糾正他你們提起的問題經我審慎的研究起來使我非常為難這個一言難盡的問題真的一時不知從那裡說起在我的了解中是佛法與非佛法的判別根本與你們心目中的標準不同佛說是佛當日從口中一句一字的說出來可以信佛沒有說就是後人的懸想産物值不得信仰我不知你們的意見是否如此我想大概是如此但我覺得佛法雖然是有佛也好無佛也好老是如此如此但一經如來從語言與身行中表現出來那就成為世諦流布世諦流布的是顯現於世間的佛法就不能違反世諦流布的一般性我們不能純憑信仰或者偏見應了解世諦流布的種種情況我們要研討的大乘是否佛說也需要從世諦流布從佛法流行於世間的情況中去理解去論定這是非常復雜的問題說就是不說就不是的取捨標準根本不能適用要從根本上加以糾正不然就無法正確的論斷這一問題為了要解答這一問題不能不從多方面說起希望你們能耐心的讀下去二從佛法的表現上說什麼是佛法我以為十方佛的是否說法大可以不問總之我們這個世間的佛法知道有佛有法無疑的由於釋迦牟尼佛而來釋尊有他的自覺聖境他吐露在語言中表現在行為中這意境言說身行的三業大用出現在世人的認識中是這個世間的佛法根源這三者我們不能忽略那一端要從它言說與身行的相關性統一性深入釋尊的本懷否則偏重這忽略這都是不夠健全不夠正確的認識然而不幸得很由於印度的重視口口相傳佛法早被誤解為佛說了我們應該記著佛法是不限於口說的例如佛對比丘說你應當看護病人這當然是佛說是佛法某次釋尊巡行僧房親自為病比丘洗滌這樣的實際行為難道就不是佛法釋尊的來去動靜待人處事那一樣不是佛法這大抵深刻的影響於弟子的心目傳說於佛教的人間佛的慈悲智慧願力精進他的時代適應與究極理想都要從他的言教與身行的綜合中從形式而體會到實質才能洞見全體的佛法佛法特別是如來的功德佛心的深處那裡都能從釋尊的言說自稱自讚中得來佛法並不等於佛說佛法而被誤解作佛說真是佛法的大不幸釋尊的三業大用映現於世人的認識中世人所體認到的是他的反映是在世人的認識能力及性格與興趣的限制下去認識釋尊的一切這裡面就有本質與影像的問題也就是對象與認識事相與名言的問題對象與認識並不完全一致見佛與聞法所見所聞的並不等於佛法自身這是佛法通過聽者見者的主觀性而後反映出來的佛法釋尊時代的人即使是及門的出家弟子也不全是利根的也儘有與釋尊的精神不相契合的所以釋尊及門弟子的觀感好在他的直接性但並不能保證他的絶對正確這可以舉三點來說一不知在佛弟子的認識中不知有這麼一回事這或是忽略主要是根性與興趣不合而不知或是遺忘而不知遺忘的不知或是個人的遺忘或是大衆的遺忘例如佛涅槃後阿難傳布釋尊的遺囑小小戒可捨然而什麼是小小戒阿難不知大衆也不知結果佛制的戒律不論大小一律遵行這也許合於當時的需要但重律的上座們使戒律成為瑣碎的教條儀文顯然的違反了釋尊的精神這那裡能代表完整的佛法個人的遺忘可以重復記起即使是大衆的遺忘因某一事件的發現也可能重行發掘出來這是世間的一般現象佛法流行人間也不能說決無此事所以某人不知或某些人某些時不知不一定就是沒有這種不知的再認識錯誤以今擬昔以似為真的可能性當然很大但比平常所知的更正確足以修正過去的誤解也著實不少如錫蘭過去盛行大乘法在現有的錫蘭佛教界幾乎忘記得一乾二淨但一考中國佛教的文獻與錫蘭的佛教遺跡即將徹底的糾正他們的意見二錯知觀察者的性格與認識力不夠了解對象在所認識到的人與事不論說他好或者不對每為皮相的認識與情感的歪曲不能正確的理解對象這如嗏帝比丘親聞佛說而說識是生死根本即是一例傳說中的佛說當然不能契合釋尊本意的更多三少分的知偉大的思想復雜的事件是和合為一而又內有種種差別相的如偏狹的見到一端就是能深入其微也不能看為完整的正確的或者在當時是少分人的了解未能成為衆所周知的時代佛教這如學菩薩而成佛釋尊是事實的證明者彌勒是繼蹤前進者學菩薩道而成佛如本生談等儘多的留傳人間然而釋尊的時代佛教並不勸人學佛聲聞弟子都以急證解脫為目的這一發菩提心修菩薩道的法門逐漸的發展為時代共趣的佛教可能由於適應新的時代環境而有多少新起的成分但自有他的來源不能看作純為後人的懸想産物從這種見解去了解佛法我不一定說佛滅前後的時代佛教是不知錯知少分的知是說古型的聖典當然值得珍重但稍微後起的多少變化或重心不同這可能為不知者的再認識錯知者的糾正少知的綜合而成為圓滿或逐漸開展而形成大衆共知的佛教這需要鄭重的虛心的探討是不能看作佛所未說而輕易抹煞的事實上像王舍城迦葉系的少數結集確是偏於苦行與自了漢認識的佛法不能完滿而忠實的映現釋尊的一切如佛說小小戒可捨而迦葉決定為一律保留如迦葉行頭陀苦行釋尊曾勸迦葉捨頭陀行而迦葉卻固執的不聽釋尊的勸誡如釋尊因阿難而度女人出家佛在時迦葉隱忍下去等到釋尊入滅迦葉即大為反對以此為阿難的錯誤強迫他向大衆懺悔釋尊入滅以後領導大衆結集聖典的迦葉風格見解如此這樣的結集而凝成的初期佛教無疑的不能代表佛法的全體如說佛教只有這些那是怎樣的荒謬還有人類認識中的佛法用語言表達用文字記録出來也是值得注意的問題我們的了別認識是顯境名言語言是表義的名言雖然說思想是沒有說出來的語言沒有録出的文字語言與文字是思想的表現與記録但思想與語文還是有些不同的辭不達意是極一般的事實思想是生動的自覺的內容常是有機的統攝著能隨時空的不同而適應的語文就機械多了他多是片段的相關的統一性每不是淺薄的印象所能夠了解白紙上漓了黑字常被愚拙者固執著把他殭化而成為古人的糟粕我覺得佛陀的三業大用從佛弟子的認識中化為文字記録實在損失不少但這是不可避免的如古型的雜阿含經這樣的簡要雜碎總是說如此很少詳細的說明他所以如此釋尊果真是這樣的簡默嗎佛確是不歡喜多說多辨的但要使人聽法而修行得悟決不能如此這無非為了適應口口相傳的方便而把他簡練到如此的在表義的名言中有音聲符號的語言形象符號的文字佛滅前後都用耳提面命的語言聲名句文從語言及弟子間的傳說到大部的記録這是阿育王以後的事了從語言到文字你想有多少變化語言的生動表情在口口相傳中被脫略乾淨特別是印度的方言復雜經過口頭上的重重傳譯就不免起著或多或少的變化所以即使是佛所親說的部分也不能學究式的專從文字的考證訓詁中去完美的了解佛法近來的一分學者推重錫蘭所傳的巴利語聖典錫蘭的佛教說這是釋尊使用的摩竭陀語巴利語聖典是王舍城五百結集的原典以語文的古老證實他們的三藏是古老的正統的佛說與他們不同的即使是阿含經與廣律也被看作後起的改寫的如這不過為了宣傳的目的那麼讓賣糖人去說他的糖甜吧如作為事實作為是否佛說的標準那是違反佛陀精神的不能不表示反對佛制聽隨國俗言音學習佛說佛法是普應無礙的不是神教式的執一而強同的以不同的言音來學習佛說也是錫蘭律典所共說的所以無論釋尊與王舍城結集使用甚麼語文佛教界並沒有標準的語文億耳以阿槃地語誦義品釋尊是一樣的讚歎他雅語起初是恆河上流西方系所使用的釋尊不同情他們的佛法統一化雅語化但並不反對他們以雅語學習佛說這是佛世即已如此以雅語誦習佛說不是後起的變化傳說阿育王時代華氏城因僧衆的來自各地語音隔礙所以分用不同的語言誦戒佛法即分為多部在不同的環境中佛教適應不同文化採用當地語文確為佛法分部的重大原因錫蘭的佛教從大陸來起初是並不專為巴利語的照錫蘭佛教徒自己的傳說由於大寺派與無畏山寺派相諍大寺派始以巴利語寫定三藏這是西元前一世紀的事他們的想像以為巴利語聖典都由摩哂陀傳來不知即使摩哂陀使用巴利語弘法在當時口口相傳的狀況中三藏的南傳決不會出於一人的口授其後也還有非巴利語的西元四五世紀間的覺音始一律的改寫為巴利語這在當時仍舊是大寺派的而不是錫蘭佛教全體如此我們相信巴利語為古代的方言之一然以巴利語寫定三藏在錫蘭也不算是太古了我們如不打算效法神教徒不希望宗教獲得語文的特別支持如婆羅門教以吠陀語為神的語言等那麼語文不過是載道的工具而已印度佛教語文的復雜性與佛法語文化的種種問題是值得巴利語佛教者反省的還有應該注意的就是先見於文記的並不就是先存在的這像民間流行的故事有還沒有記録的但並不妨早已存在他比近代發明而出版的要早得多從這種意義去看佛法在文字流行較遲的聖典可以說在某時盛行不能就此指為後人懸想的産物他的是否佛法是否佛說需要從種種方面去判決審定他後起的可能早已存在但我也不否認受有外來的影響以及傳說而改變的成分這還專在語文上說其實佛法的表現音聲符號中還有音樂歌唱甚至語言的情調形象符號中還有圖畫建築雕刻等無不在有意無意中表現佛法影響佛弟子的思想這些又大多是象徵的抒情的比擬的如不從表現佛法的種種方式種種關係中去把握佛法而想專門在說與不說上去衡量佛法這真是佛法的不幸這些離佛二三千年的我們確乎已不能親切的明確的容易了解對於這些問題也許是不談為妙倒不如把傳統的片面的見解佛說覆述一遍來得像樣而博得人的同情不過如想更充實的更正確的了解佛法使佛法從古人的糟粕中解放出來那非從新的觀點存在於現實世間的觀點出發不可從對象到認識從認識到語言從語言到文字這表現佛法的不同形式不同階段中有種種問題承認了這點就不會專憑佛口的說不說用作現存聖典的是否佛法的抉擇標準了三從佛法的流行上說佛法的表現是說明佛法出現在時空中流行是說明佛法在時空中的延續擴展與演變釋尊的三業大用映現在佛弟子的認識中又構成佛弟子的三業勝用這表現佛法的事用的流行有一必然而不可免的事實即不能不有變化我當然反對把他變成非佛法的那保存舊有形態的佛教就使是可能的也必然為依樣葫蘆的形式崇拜是我佛的不肖子孫如我們是黃帝的子孫如果我們現在的文化經濟人口領土一切是老樣子這還有出息嗎所以不但不知者可以再認識錯知者應該修正少知者應該綜合完成應該發展而成為大衆共知的佛教這裡面需要變化而且釋尊表現佛法的言教與事行有釋尊不共獨到的深見也有印度文明所固有的成分這其中或是無條件的承襲或是多少修正而給以新的意義或是契合於釋尊正覺的本懷或是為了時地適應而姑且採用的佛在人間弘法那就必然如此不能不如此這一切中釋尊特唱的深見正行應嚴格的住持與高度的發揚因襲印度文明的適應部分如是姑且採用的那麼時過境遷雖確為佛口所親說也應該革新或取消否則將轉變為佛教發展中的障礙物了早期的印度佛教值得我們尊重他到底去佛不遠但他不一定比後代流行的佛法適合於百年千年後的時代適合於千里萬里外的環境從這佛法流行的觀點中怎能以自以為然的佛說或不說論斷他的是否佛法呢這一極重要的問題由於一般的缺乏流行的認識引起的誤解不少如自稱原始的上座佛教者他們以早期的佛教形態為佛說佛法而抹煞以後的正常發展甚至說大乘是印度教徒改造佛教的成果我曾與他們開玩笑說這算什麼原始的上座佛教不也充滿外道的氣味嗎關於這我想你們是知道的尼犍子外道以草木為有生命的釋尊因此而不許壞生印度人以樹木為鬼神的村落因此佛制不得自行砍伐外道雨季安居半月半月說戒佛應當時人的請求也制為半月誦戒與安居的制度當時的外道出家托鉢乞食為生所以佛教也有這種出家的生活方式從義理說生死輪回解脫涅槃業力這不都是奧義書以來的外道常談嗎從修行的方便說不淨觀數息觀四禪八定三摩地瑜伽當時的外道不都有大同小異的行持嗎佛稱大雄得一切智外道不也有自稱大雄自稱得一切智的嗎過午不食為齊豈不是印度舊有的習俗嗎佛法從印度宗教中發展而完成又弘布佛法於印度怎能不與印度外道有著深切的關係如說大乘為外道怕外道不單是大乘吧以大乘為非佛說的佛徒應起來論究這些問題實則佛法與非佛法應重視佛陀獨到的正覺重視從正覺流出的佛陀真精神佛陀三業大用的一貫特性從大乘與學派的佛教阿含經與廣律等而論究起來大乘佛法的湧現實為本著釋尊正覺內容而作新的適應如說正直捨方便但說無上道這是揭露釋尊自證的本懷而揚棄初期佛教的方便苦行外道為主機的適應性然而佛法不能沒有適應世俗的方便所以更以異方便助顯第一義從正覺本懷的宗趣中攝取了適應樂行婆羅門為主機的方便從佛法的特質與佛陀的本懷說從本生談等而來的大乘是更正確更深刻的開顯了佛法這本是阿含經以來的一貫傾向可惜自稱上座佛教的錫蘭學者不大了解他自己他是傾向大乘的一流流入島國而轉化為狹隘的保守的佛教他自身早就不大原始了否則如北方所傳的說一切有部不許別有小阿含以本生談等為傳說文頌如大衆部等不說王舍城結集論藏說阿毗達磨即是九部修多羅這才是代表更原始的思想還有從根源的佛法到流行的佛法因了時地人的關係必然的在分化而又綜合綜合而又分化的過程中從起初的渾然未畫的一味佛法到重重分化分分皆金可以說各得佛法的一體但也可說各有所偏因為他們都有自己獨到的理解各有新的適應對佛法各有他的取捨輕重這流行中的佛法後起者對於以先的佛法抉擇它綜合它推演它永遠的流行就永遠在這樣的過程中衆生的根性不一認識的佛法也不能一律只能作到根本的同一大體一致而不妨含攝得多樣性世間是緣起的緣起法就必然如此彼此間可以有新義可以有針鋒相對的異義或者一是一非或者各說一邊或者都不對但求能根本的見地不錯這一切都不妨是佛法舉例說孔子是儒學的大成者但孔子以後儒分為八如荀子重禮樂文章說性惡孟子重性與天道說性善可以說各有所偏但都不妨是儒學難道儒學或孔學一定要孔子說過的嗎佛法表現於佛陀的三業中也表現於佛弟子的流行中佛法決不即是佛說這點過去的佛弟子早已說得明白佛法有五人說一切微妙善語皆是佛法入佛法相名為佛法雖然因此而佛法在不斷的流行中構成龐大的聖典後來或不免變質但這只怪我們的了解不夠怪得誰呢古代的佛法與佛說本來不一定要出於佛口只要學有淵源合於佛法不共世學的大原則就夠了這無論是標為佛說或弟子說應作如理的尋思本不能無條件的引用為權威的教證不妨加以抉擇的所以說智者能取能捨佛法本來不限於佛說所以大乘非佛說可說是似通非通的話修菩薩道成無上正等覺這是任何佛弟子所不能否認的如錫蘭傳來的解脫道論說到菩薩以慈悲心修習圓滿十波羅蜜多依此而圓滿四處諦施寂慧而圓滿定慧而圓滿佛地以慈心修十波羅蜜豈不是與聲聞行不同如以為這是佛說種種大乘經非佛口親說這有什麼意義阿含經與廣律中不也一樣有非佛說的嗎我們知道初期集成的阿含經原有一合理的意見即佛法是不限於佛說的佛弟子間的自相問答或與外道辨論甚至傳說的梵天帝釋等說既無釋尊在場也不曾經過釋尊的審定都編集在阿含經中淺狹的聲聞佛教者相信他們的經律是佛說是王舍城結集的聖典不知道阿含經中即含有佛涅槃後的