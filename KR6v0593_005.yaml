於推演的窮精微融攝的極廣大是出現在抉擇而確立某一根本思想系以後它是發展但如不保持基本的原則精神不照顧一貫的體系那推演勢必走上繁瑣纖巧枝離衰老融攝更可怕的走上邪正不分是非不辨看來是不斷的創新其實是畸形的病態發展加速的滅亡我所說的佛法流行就是從變的觀點從史的演化去觀察歷史需要考真僞但這與古董的鑑別不同特別是因為佛法是無限錯綜復雜的大流行就是僞作其實多是時代意識從無意識中形成的其中並非沒有思想上的淵源有它的時代背景也就是某一時代一部分人思潮的敘述所以並不能就此斷定它的是不是我們要從佛法的流行中看出它前後的一貫性種種中的共通性看出它的演化傾向是向上或者停滯或者墮落我們要從佛法的流行中探索它的精髓使它在新的時代中流行唯有在這樣的觀點下才能說大乘是否佛說大乘的開展是否確當四從學派的分裂看大乘現在要開始討論大乘了佛世當然沒有後期的大乘經典可以說大乘經非釋迦佛親說但菩薩道修菩薩行下度衆生上求佛果的思想應該存在也就是大乘是佛說是佛法關於菩薩道釋尊自己就是一個不需要解說的事實這菩薩道的思想在佛教界醞釀從學派的分裂中一天天明朗強化起來佛滅百年中的吠舍離結集開始了耆年上座與青年大衆的分流從傳說上看這是律重根本與適應和律務瑣細與保守的爭執十事非法說等到阿輸迦王時代的分爭是聲聞未了與聲聞究竟的爭執五事非法說這都是大乘思想在發揚所以我稱之為菩薩傾向的聲聞分流追溯得更古些阿難與迦葉富樓那與迦葉的爭論都意味著菩薩傾向的潛流了起初沿恆河東岸以吠舍離為中心的東方系演化為大衆部與西方系的上座們抗衡傳說大衆部中有大乘經這自然不容易證實但從大衆系的本宗同義看來像佛身無漏佛壽無量佛威力無邊一音說一切法一念知一切法關於佛菩薩聖德的讚揚也就是大乘思想的法性身論可說是他們唯一著力的地方在流轉還滅的解說上像心性本淨見空成聖也是大乘的心要所在所以起初不必有大乘經但大乘法的基本要義已相當完備了到了迦王時代大天更展開揚大抑小的爭論大衆系的教化區漸漸的向南方移入東方的央伽多羅傳說有大乘經摩訶迦旃延到摩訶剌陀大天到摩醯沙慢陀羅凡是大衆學派所到達的都是大乘盛行的根源地案達羅的學者傳說他們用南印的方言集録大乘經總之大乘法的最初傳弘努力者是大衆系的聖者們這一個傾向飛快的展開在佛元二世紀的迦王時代西方的上座系有一分人傾向大衆而接近了這就是中印的分別說系這一系流行在大陸上的像化地飲光法藏部不論是分裂的緣起聖典的內容古人也判法藏部律的分通大乘都接近大衆系特別是三世紀中印法難以後大衆系與大陸分別說系的關涉更深西方的上座系不久又分為犢子與說一切有兩系犢子系以拘舍彌為中心而分化到恆河流域也有進入大衆系的故鄉所以他也傾向大乘如文殊師利為釋迦的老師犢子部即與大衆部有一致的傳說真常唯心論的完成與他也很有關係說一切有系中流出重經的譬喻師他的思想是傾向大衆分別說的譬喻尊者從健陀羅到羯槃陀這一線像烏仗那通過帕米爾到西域的斫句迦于闐都是後代大乘的盛行地譬喻大師世友不也稱為菩薩嗎根本說一切有部律不也說善財是賢劫菩薩舍利子說法有很多人發菩提心嗎又有重禪的瑜伽師他們好談自證思想自由得多像僧伽羅剎彌妬路尸利都傳說是菩薩惟有迦溼彌羅的重論派才比較上與菩薩道無緣從聲聞學派的分流上看菩薩道可說是大衆系初唱因佛法的普及大衆菩薩在家的更多而發揚但以佛陀行果為讚仰的對象生起佛何人哉我何人哉有為者亦若是的自尊心在時代要求下逐漸形成菩薩道的佛法這幾乎是一切學派的共同傾向所以不久即瀰漫全印為一切學派先見者所賞識這焉能看為少數人的臆說看為空中樓閣說它完全是後人的僞造至少我不敢閉起眼睛這樣的抹煞事實菩薩傾向的聲聞分流期各派的學者有的專修聲聞行果有的讚仰佛陀行果自修依然是聲聞道有的外現聲聞身內祕菩薩行聲聞道與菩薩雖不無矛盾但大體上是互相依重而和合的不過從事菩薩道的研求與實行者大衆分別說系比較的多數吧在北方一切有部的譬喻師都是與大乘有關的佛元四世紀以後菩薩道更盛才漸次移入菩薩本位的時代佛教那已是南方案達羅王朝與北方貴霜王朝的時代了五從經論的集出看大乘了解聖典的性質知道他怎樣流布人間那一定能信解大乘的如實經論的出現可依印度佛教的五期去觀察五期是一聲聞為本的師資同一解脫二菩薩傾向的聲聞分流三菩薩為本的大小兼暢四如來傾向的菩薩分流五如來為本的佛梵一體佛世的佛教學者泛稱聲聞聲聞即聞佛聲教而修行的弟子本不局限於己利佛與弟子證得同樣的解脫佛的教授教誡簡練為一定的文句傳誦在僧團中僧團的生活由佛的示範指教而在大衆的實行中釋尊化世的事業也被傳說著至於佛陀的大行大果由釋尊的本身活動來表現影入每個弟子的心中有本生未曾有等傳說佛滅以後迦葉系的少數結集我以為是一屬於達磨的分修多羅與祇夜雜阿含經的前身是釋尊與弟子及諸天的言教的類集二屬於毗奈耶的分修多羅戒經與祇夜法隨順偈是僧伽規制的類集此外伽陀與優陀那法句傳誦於教界而有關佛與弟子事行的因緣譬喻未曾有本生本事等都還在傳說中初期的結集雖多少是偏於厭世的但聲聞行者所認識的佛法有關佛陀行果的菩薩法也常不自覺的流露出來特別是本生本事的傳說到佛元百年學派分裂的前夜佛典已不這麼簡單達磨已綜合了新得的遺聞舊義的推闡會入因緣譬喻等事實編組為中部長部又依增一法編集為增一部加上原有的相應教雜部合為四阿含毗奈耶的經分別已經成立法隨順偈即摩呾理迦逐漸分別解說形成毗奈耶的一大部近於僧祇律的雜跋渠上座部系律師後來又將雜跋渠分別編集為小品大品或七法八法等優婆提舍論義方面當時至少已有兩大學流一是學出舍利弗的阿毗曇一是學出摩訶迦旃延的蜫勒這些是佛弟子所共認的除論但學派的分裂也由於此長阿含經與增一阿含經是怎樣接近大乘呀所以我以為大乘思想的胚胎在分裂前已經存在吠舍離結集促成二部的分裂分別說系重長阿含經大衆系重增一阿含經這豈是無所謂的從此初期佛教的聖典已達到凝固的階段儘管出入不同已不許隨便更張佛教界漸用文字記録該是重要的理由當時的佛教已移入菩薩傾向的聲聞分流時代了初期的聖典已相當固定佛弟子或又采集得佛陀的遺言遺行自己作佛法的體驗從事對佛法的研求推演它抉擇它為了適應新環境又需要攝取換句話說整理的時代過去現在要發揮弘揚佛弟子們雖說身教為先但不能無所表現自己所認識的妙法自然要求他人的共鳴這就要從事著述了這研求故典發揮新知的工作迦王以後一天天隆盛起來佛元三世紀中印受法難以後佛教更顯然分化為南方佛教與北方佛教這與歐洲人所說的不同他們著述的作風也不同在西北方起初雖也有編集為經的像正法念處經等但主要是佛弟子的著述一律稱為論收在論藏裡不過遇到特別珍重的東西雖說是論也常自誇為佛說如經部師的摩呾理迦阿毗達磨論師的發智論南方的佛教大衆系與分別說系在經律論以外又有雜藏的結集雜藏中像法句義足等是古型的精粹的小集也有本生本事譬喻方等這裡面含有豐富的大乘思想這在迦王時代已經如此了不久據分別功德論說雜藏的內容更充實也就是說佛菩薩行果的成分更多了文義非一多於三藏故曰雜藏試問這部帙浩大的雜藏從何而來大衆分別說系的論藏不發達傳譯來中國的很少這不是中國學者有意鄙棄它實在它本來就不多但他們重智慧重化他重融攝他們焉能無所述作我敢說雜藏就是他們作品的匯集後來大乘思想更豐富舊瓶裝不了新酒這才離開雜藏自立體系編集為大乘藏初期大乘經的公開廣大流行應該是佛元五世紀的事佛教漸漸移入第三期菩薩為本的大小兼暢的時代了關於大乘經的編集出現我們不能把他看為作僞無論如何古人是並不如此有人說四福音不是耶穌的事跡也不是那一個作僞這是耶穌門徒無意識歌唱出來的東西這說得相當好大乘經也應該這樣看有傳說中的佛言佛行有論究出的事理真相有佛弟子成佛的心願有社會救濟的事實要求這一切漸成為佛弟子間的共同意識在不斷的流行中結構為幾多理論與事實自己沒有聽見佛說但卻是展轉從人得來並非憑空撰出從理論上看從實踐的道上看這不能不說是佛法是佛法的必然結論非此不足以表現佛陀的真精神在進步的佛學者看來這真是道出自己心中的深奧起初大乘思想是潛流醞釀在不斷的演繹充實中但也是流行中的演化非某一人有意的增飾一到成熟的階段自然有人把他編集出來是佛說當然加上如是我聞了有意的推演補充在古人或者也有但必然自覺是忠實的吻合佛意入佛法相也就不妨是佛法了這南北方的佛教是怎樣的作風不同呀南方的佛教抉擇而特重攝取在讚仰佛陀行果的立場上流出無數的摩訶衍經北方的佛教抉擇而特重推演在闡述世間集滅的立場上流出很多的阿毗達磨論論典是對釋尊的言教有淵源加以推演在自己的園地上創新經典是對釋尊的身行有所見加以抉擇發揮卻忘卻自我願與古聖同流大乘經保存了佛教傳統的行踐中心富有生命力阿毗達磨論不免講道理流為偏枯的理智主義繁瑣得討厭但論典不稱為佛說內外的分限較嚴這比大乘經的融攝世俗神化的氣味加深把本源佛說與流行佛法攪成一片自也有它的長處這兩者一是佛道中心的一是聲聞道中心的一是側重緣起寂滅性趣向一理常空一是側重緣起生滅相趣向諸法皆有這兩大學流我們應該站在古型的聖典中去觀察它們接受它們寶貴的成果如果硬要說大乘非佛法是印度教徒神化佛教的膺品這真是釋迦的不肖子孫菩薩為本大小兼暢的大乘經從南方到北方是南方案達羅北方貴霜二王朝的極盛時代不久南北二王朝都一天天衰老中印的摩竭陀民族要興起正在預備一個梵文復興時代的婆羅門帝國這時候大衆分別說系的學者承受初期流出的大乘經有意無意的又在開始發揮適應新時代的佛法梵我化的真常唯心在佛教界起著醞釀作用又開始出現新經正在這轉變的大時代佛教中産生了偉大的聖者就是龍樹菩薩他長在南印久受大乘的熏沐又出家在北印的說一切有部他起來綜貫南北佛教發揮弘通一切性空一切幻有三乘同歸的菩薩本位佛教他反對北方佛教的極端者發智論大毗婆沙論的實有瑣碎又抨擊南方佛教的病態學者方廣道人的執理廢事他立足在古典的緣起觀從緣起的寂滅性貫通一切空從緣起的生滅相貫通三世有我法有有為無為有的一切有幻的顯現幻的空寂合成現空無礙的中道觀他的即有而空是緣起空寂的開顯是不礙入世的大乘特見他的如幻一切有雖取捨各家特別重用上座傳統的古義他是南方初期的大乘經與北方初期的毗曇論的綜合綜合得達到預期的成功他承受北方的精神所以他的作品稱為論當時真常一乘唯心的後期大乘經已開始出現龍樹窺見了這個氣運很想加以阻抑所以說他力念佛是為志性怯劣者說的假如一定是一乘那唯有法華經可信可見當時的一乘經很少一切說三乘的都要廢置或修正了因為人執著實有外境所以特別說一切依心起如執著心是真實常住那不過是梵王婆羅門教的舊說本來是一切空因為有人怕聽說空所以又稱之為一切清淨他這樣的堅固而洗鍊了大乘給北方佛教界一種重大的影響引起西域大乘佛教的隆盛但隨著笈多王朝的興起在梵文復興的氣運中中印的佛子們融攝了大衆系犢子系的思想對一切法性空給以新解釋新抉擇真常唯心一乘的大經又大大流出佛教又移入如來傾向的菩薩分流時代了這一個思潮立刻反映到西北方偉大的綜合者又出現了這就是無著師資的學系他們學出北方從重禪的瑜伽師中出來傾向經部師也尊重毗曇總攝了說一切有三系的學說起來回心向大因為偏於北方所以對大衆分別說的思想比龍樹要隔礙得多但龍樹後學的容易流入真常也就因為這一點初期的性空大乘經也就是久在北方流行的他們很重視它但用現在實有的見地去解說當時真常唯心的思潮無法拒絶它又不願全盤接受可說又厭它又愛它於是在緣起自相有的見地說不空間接的顯示真常不空不同情真心的在纏妄現所以從虛妄生滅心中談唯識雖一天天弘揚大乘不共的唯識道但在北方佛教的事實昭彰下終於用密意一乘去修正他這一到隨理行派手上弘揚在中南印就徹底的一乘究竟了用別時意趣解說念佛不談真言祕密他們有北方的濃厚特色製作很多嚴密的論典這一系也像龍樹系一樣是偉大的南北綜合者也想對南方後期的佛法有所修正但時代思潮的狂流已不能不遮遮掩掩的接受了這樣大乘經與大乘論是各有源流的大概說經是大衆分別說也有犢子系一切有系在內偏於東南的大乘論是南北佛教的綜合有修正淨化大乘經的傾向可以說不透過說一切有系大乘是不重論的龍樹學與無著學是更理想的大乘學但不能說大乘只有中觀與唯識兩派這因為龍樹學很逼近性空經但經中未始沒有不同的見解後期的中道大乘經說真常唯心一乘更與無著學相距很遠到護法更遠了真常唯心不是虛妄唯識者發展所成虛妄唯識卻是從北方佛教的觀點接受真常唯心又想淨化他古人說經富論貧那過分重視如是我聞了西藏人以為大乘經像一團麵團拉長就長壓扁就扁真意難得了解惟有龍樹無著的中觀唯識學才是大乘的正義那也不知經論性質的差別事實上龍樹無著在大乘教中的地位與價值需要更深的認識因了中觀學的復興空有相爭鬧得興高采烈但另一機運成熟新經典又開始流行了起初北方的瑜伽師說自證談神通漸漸與北方的咒師有緣雜亂的流出些雜密這時間相當的早南方真常論者的聖典中密咒的成分也加多笈多王朝大統一以後婆羅門教更盛佛元九十世紀間佛教大受摧殘真常的大乘佛教者有意的在真常唯心一乘的基礎上使佛法更梵化更神祕他總攝大乘空有的成果融合了世俗的迷信俗習甚至房中術這樣作風本是婆羅門教所採用曾經收有復興效果的行部瑜伽部的密典出現佛教思想大變這又移入如來為本的佛梵一體時代了接著南北方佛教都衰中印佛教卻在波羅王朝的護翼下祕密教發揚到至矣盡矣無上瑜伽又出現病態的發展到了此路不通創新的源泉也枯了坐待外道的侵入而滅亡從這經論的出現去看初期大乘經可以有想像無意識的居多的成分但不是僞託它是學有所見從佛教大衆的共同意識流露出來的妙法至少它與聲聞乘的阿毗達磨有同等的價值實際上高得多大乘經論各有特色我們贊成繼承龍樹無著抉擇又綜合的精神但不否認真常唯心系的存在否認它就不能窺見佛法流行的真相大乘經我們是尊重初期的真常唯心我們認為是適應梵學復興而離宗的但它保存佛法的精華不少值得我們參究現存的聲聞經論大乘經論如一定要考實佛口親說的那恐怕很難這一切都是釋尊的三業大用影現在弟子的認識中加以推演抉擇攝取成為時代意識而形成的可以稱為佛說卻不能說那一章那一句是釋尊親說盡信書不如無書離卻糟粕又從那裡去洗鍊精華古書不易讀佛典似乎更難了本節重排時略有修正六從思潮的遞代看大乘依多數大乘經的三時教把五期佛教總束為無常實有的聲聞行性空幻有的菩薩行真常妙有的如來行三期這三個時代思潮的代興是前一思潮發揚到極高的時候後一思潮已潛在的形成前一思潮將衰落後者就立刻用新的姿態飛快的發展起來形成新的時代三時中性空幻有的菩薩行是根本結集聖典的正常開顯真常妙有的如來行卻因為適應而多少有點離宗這是可以諍論的再為一談佛世的佛教是無限差別而一味的三法印在釋尊的證覺中自然是一貫無礙從初期聖典所表現的看來這是行踐的理性是厭苦離欲向滅的法則是知苦斷集證滅的所修聖道的歷程所以在初期聲聞行者的認識上這含有很大的厭離情緒他把生死無常與涅槃寂靜截為兩件事所以特別深切的痛感無常故苦形成無常為門的聲聞行了原來三法印是依緣起而開顯的緣起的生滅是諸行無常緣起的寂滅是涅槃寂靜初期急於厭離的學者從緣起生滅相去看所以見它的歷別而三法印分離了但真能從無常入無我從無我證無生寂滅的聖者也決不別執他的四諦也稱生滅的有量的有作的菩薩行者從緣起的生滅中徹見寂滅性體現一切法的無差別性從這畢竟空寂的觀點看一切三法印即是一實相印他的四諦也稱不生滅的無量的無作的一從差別的見地漸入而會歸一滅一從無別的見地見性空而遍通三法印古人說的拙度巧度也只是這個這樣生滅相即寂滅性生死即涅槃不妨離聲聞厭離行而別走菩薩等觀的性空行了我們的見解第一義空經大空經等本是聖典舊物所以性空門的發揚決非否定抨擊根本的聖典反而是開顯它即空的一切只是蘊界處緣起等無我三解脫門是入道的不二門無餘涅槃是三乘共證而究竟的但為菩薩說而二乘也應該列席學般若這一切是怎樣的闡發釋尊正覺的本懷不違舊來的聲聞行第二期是無我法印的開顯第三期是涅槃法印的開顯我曾這麼說但大有語病容易起誤會要知三法印是依緣起的生滅與寂滅而說的法印有三生滅與不生滅卻只有二義性空大乘的空寂是我空法空是人無我與法無我這自然是無我我所的開顯但一切法空就是諸法寂滅性這就是涅槃在諸法本空上顯示諸法本寂滅所以空也就是涅槃寂靜印的開顯在同一的性空中顯示無我與涅槃二義這第一法印有三生滅與寂滅只有二諸法無我是遍通的從生滅邊說無常是相續中的非常無我是和合中的非實從寂滅邊說無我約所無說寂滅約所無的當處說性空行就是從無常的非實自性中離自性而見空寂第二在聖典中涅槃是不許擬議的因為一切是有餘的是世間的如用世間的去作著相的描寫擬議那就必然要神化它只能從無常是無我中去體現要加以言說思惟只能說空無非不離第三無可說明中的說明不出二途生死是此有故彼有所以涅槃是此無故彼無就是無性空無自性空自性涅槃這是用實有非有的空來顯示的又生死是此生故彼生所以涅槃是此滅故彼滅就是寂滅以生滅故寂滅為樂這是用生者不生的無生來顯示的所以說三時思潮的遞代是三法印的次第開顯這在後期的大乘者他們確是自覺為發揮真常妙有的大寂滅的其實卻不盡然諸行無常諸法無我涅槃寂靜從緣起生滅相說三法印的漸入一滅聲聞行時代己利行無常無我不生證入涅槃無自性空無常性無我性無生性自性寂滅從緣起寂滅性說一實相的圓見三印菩薩行時代普賢行什麼是真常妙有就是說空是無其所無因空所顯性卻是超越的大實在這在性空幻有發揚的時代有見根深的學者不見一切如幻一切唯名一切性空他是很可以把性空誤會作顯示真常的天台家說通教的幻有即空如因空而見非空非不空不離一切法的外在的是但中如因空而見非空非不空而空而不空空中具足一切法的不離一切法而內在的那是圓中了含中二諦不是三乘共空的本義是真常論者的一種看法一種解說很可以看出從空到不空的思想過程難怪真常論者的心目中華嚴經般若經等都是真常說空是為了破外道小乘從空而入的是大實在是一切法的實體與諸佛法身平等平等它是凡聖一如的染淨不變的雖是萬有的實體遍一切一味但為了無始妄染使它局促在狹小的世界中或者閉鎖在肉團心中它是生死中作業受苦樂者在蘊界處中為三毒所染但還是常住的周遍的清淨的真實的像礦中的金性穢物中的摩尼它是陰界六入在有情身中的至善妙明不即五蘊不離五蘊的真我它叫如來藏如來界如來性佛性它與心性本淨合流所以也叫圓覺本覺常住真心它是常住非無常它是具足恆沙淨德的不空它不從緣生不如幻化無常空這都是世間虛幻的緣起它決不能如此它有時也叫空性這是因它不與妄染相應因離妄而證也可以叫無我這是無即蘊我與離蘊我它實在是真我把從空所顯的大實在妙有作為核心它本身具足一切清淨聖德是從它開顯出來不是新生熏習那不過引發而已它具足一切清淨功德必然要走到佛智常住菩提本有這可不能不罵無常是外道譏笑無我是舊醫用乳真常妙有論的特徵如此它是什麼是梵是我回顧根本的聖典渺不相及在初期大乘經中也不能容許有人說這是不共大乘是的這確是不共的這一思想系印度的佛教中是存在的不能否認不能否認它但進步的大乘學者或者說是回眺根本聖典的大乘學者那都要批評它修正它龍樹說得徹底這是梵王的舊說無著系不談如來藏藏識專從唯妄唯染的賴耶談起不直談圓成實的妙有卻從依他起的自相有說起給如來藏以新的解說雖不能徹底到底淨化得多他的後學對真常顯現諸法的思想永遠在反對也有評責真心系為妄說的龍樹的後學說圓具德相的如來藏是不了義的如來藏是依性空而假說的宗喀巴也要大破覺曩巴派的真常妙有我覺得如果說龍樹無著間有一種一貫的精神那就是綜合南北佛教對後期的真常妙有論者加以批評洗鍊我把印度的佛教史分為無常性空與真常對真常多少有點指摘這在自己覺得是繼承龍樹無著一貫的精神時代不同它的病更深不免說得更徹底但虛大師批評我將馬鳴龍樹無著的一貫糅成支離破碎了起初使我驚奇得有點不敢相信龍樹無著的一貫是什麼但現在我漸漸明白了好在問題也等於過去虛大師也覺得於大乘教理上從空到不空證之多分的大乘經論蓋無問題不過總以龍樹以前的馬鳴作大乘起信論為理由維持先真常而後性空的見地我想龍樹以前的馬鳴有沒有作大乘起信論這在今日應該是共明的事實不必再勞研討的了七從大乘的內容看大乘大乘學的內容確實一言難盡現在從兩點去看一世間集滅的解說二佛陀行果的讚仰世間怎樣集起又怎樣還滅這是一種生命中心的世間觀是人生動向的指針在初期後期都不同的大乘經中立足在業感緣起的理論上十九是聖典之舊但也有差別像聲聞行者是一切法向緣起的生滅多從差別的觀點說大乘學是一切法趣空特別從空寂無二的觀點說這是正常的開顯上面已略為談到還有無常苦迫的世間不是說非無常非苦卻不像聲聞者的急求厭離說更應該為衆生的無常與苦而努力另又提出一種清淨的他方佛土這是初期佛教中北俱盧洲彌勒淨土等的精製仗佛菩薩的力量等死了去享受這決非淨土教的本義主要是往生淨土在良好的環境中修學到不退菩提但如了解它是菩薩與同行同願者廣修善法而出現的提供優美的理想促使它在人間實現這就很有意義了並且穢濁的人間在大乘經中也常是清淨的常是從穢土而轉淨土的淨土不就是人間的淨化嗎釋尊的三業大用菩薩的本生談經長期的融合而使它普遍化綜合為一般菩薩的大行與一切諸佛的妙果我覺得大乘的真價值大乘的所以可學不在世間集滅的解說卻在這菩薩的大行菩薩學一切法有崇高的智慧度一切衆生有深徹的慈悲他要求解脫但為了衆生不惜多生在生死中流轉冷靜的究理心火熱的悲願調和到恰好他為法為人犧牲一切忍受一切這就是他的安慰他的莊嚴了他只知應該這樣行不問他與己有何利益那一種無限不已的大精進在信智悲願的大行中橫溢出來這確是理想的人生了菩薩比聲聞更難他是綜合了世間賢哲為人類謀利益與出世聖者離煩惱而解脫的精神他不厭世不戀世儘他地覆天翻我這裡八風不動但不是跳出天地卻要在地覆天翻中去施展身手上得天受樂不被物欲所迷下得地獄經得起苦難這是什麼能耐什麼都不是他的但他厭惡貧乏他的生命是豐富的尊貴的光明的他自己他的同伴他的國土要求無限的富餘尊嚴壯美但這一切是平等的自在的聖潔的所以我說菩薩是強者的佛教是柔和的強是濟弱的強是活潑潑而善巧的強他與聲聞行者似乎是很不同的有人說叔本華的悲觀哲學到尼采的超人論看來不同而尼采卻真是叔本華精神的繼承發揚者大乘佛教仰宗釋尊的大雄從聲聞佛教中透出來也實在如此這其中從獨善的己利行到兼濟的普賢行是一個重要的轉捩點這像淨名經華嚴經的入法界品表顯得特別明顯說到佛果我在印度之佛教說過從現實人間的釋尊到萬德莊嚴的法身佛也是從本生談的啓發而來大衆系已經成立不是大乘學者新創大抵現證法性以前的菩薩般若道常人是可以隨分行踐的成聖以上可以看作人生的終極理想好在大乘行者在無限不已的前進過程中不急求斷惑而證實際後期佛教聲聞的急證思想復活這才使大乘逆轉我以為大乘學者不該專在判地位講斷證上下工夫或專在佛果妙嚴上作玄想這是神學式的整理僅能提高信願而不能指導我們更正確深刻的體解法相也不能使行踐有更好的表現也不該專在事理上作類於哲學的研究它使我們走上偏枯的理智主義或者成一位山林哲學者大乘經不可不讀自然要會讀大乘經是行踐中心的讀者應體貼菩薩的心胸作略氣象有崇高的志願誠摯的同情深密的理智讓它在平常行履中表現出來使佛法能實際而直接的利濟人群自然初學者作一期的專修調伏自己淨化自己充實自己也是必需的其他關於內外天人之際我想另外討論還有大乘經中的人物敘述時地因緣是不必把它看為史實的這些不是理智所計較的真僞是情意所估計的是否應從表象寫意的心境去領略它與大乘論不同它常是一首詩一幅畫應帶一付藝術的眼光去品鑑它明月向我微笑天為催詩放雨來這在藝術的境界中該不是妄語吧要讀大乘經藝術的修養是必要的懂得一點神話學民俗學有一點宗教的情緒才行否則不是闢佛者迂就是佞佛者愚八什麼是初期的大乘經我只能說什麼是比較初期的大乘經不能說那一部是佛口親說的這在上面的解說中大概已能相當了解了凡是大部的典籍都不是一時編集的有先出的有後出的也有後出而羼入先出中的這不容易考察判明要認識初期大乘佛教的基本精神以後才能分別出來譬如般若經這是一部比較初期的但龍樹所知的只有三部就是奘譯的第一會第二會第四會到羅什來時他的弟子僧睿已說有四部這加了金剛般若經了似乎是同時在西北譯出的仁王般若經已說有五部了元魏菩提流支的金剛仙論就說八部般若唐玄奘譯的更多到十六會但後來還有帝釋問般若開覺自性般若經等從這纍代遞增看來我們要讀初期的般若經應先讀十六會中的前五會前五會事義不同文字的廣略差得很遠四五兩會直從佛命須菩提說般若起轉教菩薩反映聲聞中的先見者用大乘法教化在家弟子而聲聞集團反而還不能接受法華經的管理家務應該正是般若的特色前三會多了舍利子一章我們不妨先讀第四會第五會此外如唯識學者所用的經本多了彌勒問品大談三相這自然是後起而羼入的了這不是真僞問題所以唯識學者不必著急這些我也不能一一的分別也不必我以為華嚴經應先讀淨行品十住品與入法界品淨名經諸法無行經思益梵天所問經持世經大樹緊那羅王經首楞嚴三昧經無盡意經寶積經的迦葉會瓔珞經華首經六度集經再加讀賢護經阿閦經大阿彌陀經等法華經也不妨一讀可用什譯的除去羼入的提婆達多品囑纍品以後附加的成分可以不讀如對這一類初期自然也有先後的聖典得一根本而扼要的認識再去讀後期的聖典那更好的闡述發揮或開始轉變就多少有點判別力了有關大乘的問題極多我們來多多研究多多的去理解它吧佛法的真相等待著我們的發掘
