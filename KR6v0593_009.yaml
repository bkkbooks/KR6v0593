心性本淨真諦的中邊分別論也說心本自性清淨故對於心性本淨或心本性淨奘傳的唯識學解說為心的法性本淨並非說心本清淨因為心是有為的心識或染或淨或有漏或無漏怎可說本來清淨呢這是站在性相差別論的立場真諦所傳的指空本性淨為心本自性清淨而解說空性本淨為阿摩羅識是自性清淨心顯然是從真如無差別心與空性無二的立場而說彌勒中邊分別論頌的心本清淨在十八空論中解說為自性清淨心這應該與勝鬘經的如來藏說有關如經說如來藏者是法界藏法身藏出世間上上藏自性清淨藏此自性清淨如來藏而客塵煩惱上煩惱所染不思議如來境界自性清淨心而有染污難可了知有二法難可了知謂自性清淨心難可了知彼心為煩惱所染亦難可了知如來藏說的成立著重在衆生的因位中點出本具如來的德相依如來藏經的一切衆生貪欲恚癡諸煩惱中有如來智如來眼如來身結加趺坐儼然不動德相備足如我無異及楞伽經所引經如來藏自性清淨轉三十二相入於一切衆生身中使人易於想像為神我型的存在然依勝鬘經楞伽經的抉擇開示如來藏不外乎真如法界法性空性實際等別名無著的大乘莊嚴經論也說一切無別故得如清淨故故說諸衆生名為如來藏堅慧的寶性論或說世親造也說佛法身遍滿真如無差別皆實有佛性是故說衆生常有如來藏見實者說言凡夫聖人佛衆生如來藏真如無差別原來無邊德相莊嚴的佛法身只是真如法界等離垢所顯真如是絶諸戲論的無二無別的所以不容擬議所以在見實者現證法性者的證境來說這是沒有凡夫菩薩佛的差別在真如遍滿無差別中可說衆生有如來藏了如來藏在衆生身中或說在蘊處界陰界六入中或說不即六法五蘊與假我不離六法這本是一切法的勝義空性並非局限在衆生的心中但一切法性本淨當然心也本性清淨法性淨與心性淨是無二無別的那就是說在心中也沒有什麼不可以特別是在緣起法依他起性中心為迷悟的樞紐心為一切法的依止當被稱為所知依的阿賴耶識成立萬法唯識心時如來藏也就從一切法性一切心性而為阿賴耶識的本淨性了如來藏與藏識就這樣的結合起來勝鬘經揭開了這一要義如說六識及心法智依楞伽經就是前七識此七法剎那不住所以不能依此而成立生死與涅槃作生死涅槃依止的是如來藏如來藏被稱為自性清淨心這還是七妄一真說到楞伽經處處說到如來藏藏識心意意識這是在意與意識等七識而外有如來藏藏識心如來藏與藏識的關係大概的說阿賴耶識為真相心性淨業相種子習氣的和合阿賴耶識的自真相就是如來藏的別名從妄染的心識而探究到心性清淨是賴耶的自真相心性本淨而為客塵所染名如來藏阿賴耶識著重於妄染但與本淨心性並非截然差別所以一般所說的阿賴耶識緣起如來藏緣起在真諦譯中統一起來這本是同一意義只是說明的重點阿賴耶緣起以生滅妄心為所依如來藏緣起以不生滅的自性清淨為所依不同而已阿毗達磨大乘經中有這麼一頌無始時來界一切法等依由此有諸趣及涅槃證得阿毗達磨大乘經是以界為一切法依止成立生死與涅槃但界是什麼呢無著的攝大乘論引證此頌證有阿賴耶識隋笈多等譯的世親釋論唐玄奘譯的世親釋論無性釋論都把界解說為雜染種子傳說為堅慧或說世親所造的究竟一乘寶性論也引用此頌但說界為如來藏如說無始世界性即是界的異譯者如經說言諸佛如來依如來藏說諸衆生無始本際不可得知此下即引勝鬘經的如來藏說依如來藏而有生死依如來藏而有涅槃同樣的經頌同一界字而或依阿賴耶識說或依如來藏說都有印度大論師的權威說明而立說卻似乎不同這點在真諦譯的攝大乘論世親釋論綜合這兩種說明而為一如說此即此阿黎耶識界以解為性此界有五義約勝鬘經五藏義釋約此界佛世尊說比丘衆生初際不可了達無明為蓋依此而有生死如經言若如來藏非有於苦無厭惡於涅槃無欲樂願故言及有得涅槃依此而有涅槃復次此界無始時者即是顯因梁攝大乘論對於經頌的界字有兩番解說第二說與玄奘笈多等一樣是解說為阿賴耶識界雜染種子的第一說是玄奘笈多譯所沒有的但與寶性論釋一致論說界以解為性接著引勝鬘經的如來藏五藏說那無疑是法界如來界了這是把二種所依說依阿賴耶說依如來藏說統合於同一的界這可說是真諦譯的特色也許就是阿毗達磨大乘經的特色因為在真諦譯傳看來雜染種子是阿賴耶識界第二說而如來藏也還是即此阿黎耶識界不過是自性清淨心法界而已無論是真諦的譯傳玄奘笈多的譯傳攝大乘論的阿賴耶識說是著重於雜染種子識的但無論是真諦譯玄奘笈多譯攝大乘論的本義都與玄奘唯識學有距離的當然成唯識論自有解說所以不妨依攝大乘論的本義去理解真諦所譯在同一界字中含容二說的是否合理阿賴耶識是以虛妄分別為自性的種子是熏習所成的賴耶識與雜染種習混融為一這樣的種子阿賴耶識為生死雜染法的所依止由此而生死相續依如來藏說依如來藏才能說有生死說到出世無漏心以最清淨法界等流正聞熏習為種子的在衆生有漏位聞熏習雖與阿賴耶識水乳般和合卻不屬於阿賴耶識性反而是能對治阿賴耶識的所以聞熏習非阿賴耶所攝而屬於法身或解脫身攝這些都是衆譯一致的解說法身所攝的聞熏習在唯識學中該是不易理解的問題唯識是以識為所依而成立一切法的有漏雜染法以阿賴耶識為種子而成立一切種子依識種子也是虛妄分別為性的以此為依而起一切有漏法是名符其實的唯識論無漏清淨法呢修證到出障圓明的佛果阿賴耶識轉名阿摩羅識為一切清淨法所依止如有漏法依阿賴耶一樣這樣的依無漏識而立一切也符合於唯識的原則但有漏沒有盡淨無漏的種現聖位依於什麼或有了聞熏習還沒有現起無漏種現以前凡位那有漏的聞熏習種又依於什麼攝大乘論說雖與阿賴耶識和合俱轉而實是法身所攝也可說依於法身究竟法身在佛地約識說名阿摩羅識約界說是無漏界或說淨無漏界或說究竟無漏界是究竟的圓滿轉依地上菩薩無漏智現證是分證法身可以稱為得阿耨多羅三藐三菩提也可說得轉依通達轉等也就是分證阿摩羅識經說如來無垢識這等於說如來法身何必局限於佛地決定藏論稱此如如智證無差別性為阿摩羅識作聖道依因也就是法界為一切聖道依止因在沒有現證以前呢聞熏習也還是法身所攝也可說依於法界彌勒中邊分別論頌說空性法界時說心本清淨真諦在所譯十八空論即稱之為阿摩羅識是自性清淨心這樣倒是貫徹一切依心識的唯識論立場如在奘傳的唯識學中把法身法界作無漏無為性去解說那有漏聞熏依法身不等於有漏有為依無漏無為嗎嚴密的唯識學在這個問題上顯得矛盾而混亂攝大乘論說聞熏習是法身所攝這是攝屬於法界法性的梁攝大乘論已說由本識功能漸減聞熏習等次第漸增捨凡夫依作聖人依聖人依者聞熏習與解性和合以此為依一切聖道皆依此生上面曾說到梁攝大乘論在解說阿毗達磨大乘經頌時說即此阿黎耶識界以解為性這可見解性即是法界如來藏法身藏是含攝得聞熏習而為聖道作依止的一切清淨法由此而現起此界是阿黎耶識淨界自性清淨心阿摩羅識這樣清淨法也以心為所依才是思想一貫的唯識學這樣圓測所引的誤傳為真諦而可能為曇遷所作的九識章依真諦學來說有著很大的錯誤一九識章斷定阿摩羅識為本覺並非真諦論意真諦譯傳的阿摩羅識是自性清淨心也是初地以上直到佛果所有智證如如的無差別性說衆生有如來藏自性清淨心也是見實者約真如無差別說二如來藏淨界就是聞熏習與解性和合這也是阿黎耶識界所以如別立解性黎耶就不應別立看作本覺的阿摩羅識立第九識就不應立阿黎耶識有解性說黎耶有解性又立第九阿摩羅識不免重復五心界通二分說真諦的阿摩羅識說從究竟佛地的淨識而說到衆生的心性清淨與如來藏說同一意趣對同一界字而作雜染識種清淨心界二說把二說統一於阿賴耶識是真諦學的獨到立場這應該是阿毗達磨大乘經的深義於同一依他起性而作染淨兩方的說明攝大乘論是引述阿毗達磨大乘經而普遍應用的主要的教證如說阿毗達磨修多羅中佛世尊說法有三種一染污分二清淨分三染污清淨分依何義說此三分於依他性中分別性為染污分真實性為清淨分依他性為染污清淨分譬如於金藏礦也就是界土中見有三法一地界二金三土於地界中土非有而顯現金實有不顯現此土若以火燒鍊土則不現金相自現是故地界有二分如此本識未為無分別智火所燒鍊時此識由虛妄分別性顯現不由真實性顯現若為無分別智火所燒鍊時此識由成就真實性顯現不由虛妄分別性顯現是故虛妄分別性識即依他性有二分譬如金藏土中所有地界金土藏的譬喻說明了礦物的實質是地界地極微就是堅性的物質因素土一樣的礦物是地界所成的現實形態如加以冶鍊就不再像泥土而現為純金了這如一切法依他起性依他起的根本是阿賴耶識界這是唯心論的立場如地界一樣現在無始以來就現為生死雜染的分別性如以般若熏修賴耶識界不再是妄染而是清淨圓成實性了地界有二分依他起性識也一樣的有二分這樣的三性說是攝論宗的立場與奘傳唯識學的三性說不同說到通二分從顯現的事實來說是不能說同時有二分的或可推論為含有二種成分這是不妨如此說而並非阿毗達磨大乘經與攝大乘論的本意攝大乘論解說三性時曾說依他性有幾種若略說有二種一繫屬熏習種子二繫屬淨品不淨品性不成就依他熏習種子而生起所以叫做依他起這是一般的意義也就是奘傳唯識學的依他起說依他雜染清淨性不成所以叫依他起就是阿毗達磨大乘經依他有二分的見解不成就是說他沒有一成不變性所以可隨緣而如此如彼的這二項解說並不矛盾無論是雜染的清淨的都是從因緣而生起的第一說都是沒有一成不變的定性所以不是性自成就第二說沒有定性所以從緣起從緣起的當然自性不成就這與中觀者的緣起無自性由於無自性所以從緣起的意義一樣從依他起識的有二分說無始時來的識界有二分是毫無不合的界的通二分不妨看作雜染識界清淨心界的同時存在清淨心界就是解性阿摩羅識但從雜染清淨性不成來說這是非染非不染非淨非不淨不可以定說為是染是淨的如地界是地極微可土可金而不定是土是金那麼心界也隨緣而可染可淨而不就是染是淨的此心界寧可看作緣起無性的中容性然而他是順於清淨性而又一向是雜染性的從心說這是心無心相而畢竟清淨的如般若經說是心非心本性淨故淨是空寂的同義詞從空性說這是性本空寂而心相宛然的心空不二的無差別性是沒有一切相可說的無始以來就為客塵所覆染形成雜染識種阿賴耶識界如虛空本淨而一向為雲霧所蒙昧一樣但儘管隨染而成生死雜染分別性而平等不二的心界還是那樣的畢竟空寂或對染而稱為清淨這就是四清淨法中的自性清淨如有聞熏習般若熏修隨淨緣而成涅槃清淨真實性平等心界還是那樣的平等空寂但已離染這就是四清淨中的離垢清淨是淨無漏界是阿摩羅識但這決不是說佛果一切功德什麼都早已成就而只是隨順這平等心性的是善是淨能轉雜染而成為無邊功德所莊嚴的法界那順於法性的法界等流的正聞熏習以及定慧等清淨功德就是四清淨中的生此境清淨得此道清淨雖在平等法界的體證中一切無二無別然在凡位而點出如來藏性或點出解性阿摩羅識都只能約自性清淨說如梁攝大乘論釋說一此法本來自性清淨謂如如空實際無相真實法界釋曰由是法自性本來清淨此清淨名如如於一切衆生平等有以是通相故由此法是有故說一切法名如來藏在佛法中為了攝計我外道畏無我的衆生說有如來藏似乎神我一樣其實是約空如法界說如把這看作覺體的本來成就不但非奘傳唯識學所能認可也非真諦攝大乘論宗意所認可的所以真諦的阿摩羅識九識章率直的解說為本覺不但與真諦如智無差別性現證聖者所得的不合就是說為自性清淨心也與本覺義不合九識章的解說只是大乘起信論師的見地與真諦攝大乘論宗義無關
