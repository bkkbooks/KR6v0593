body:
  text: 論真諦三藏所傳的阿摩羅識一九識品與九識章梁陳之間真諦三藏來中國譯傳無著世親的唯識學以攝大乘論為宗本所以稱為攝論宗真諦傳來的與唐玄奘的唯識宗同出一系而多有不同這雖不能一概而說但大致為唯識初期的教學在真諦所傳的教學中如立阿摩羅識為第九識與奘傳不同現在想試為論列有關真諦的第九識阿摩羅識本不是攝大乘論所說的阿摩羅識的本義似乎早已為地論師所修正而面目不清了現在先從圓測解深密經疏卷三所傳說起真諦三藏依決定藏論立九識義如九識品說第九阿摩羅識此云無垢識真如為體於一真如有其二義一所緣境名為真如及實際等二能緣義名無垢識亦名本覺具如九識章引決定藏論九識品中說該文開端說真諦三藏依決定藏論立九識義如九識品說似乎以下的文句如阿摩羅識亦名本覺等都是真諦三藏的九識品所說然據末了所說具如九識章引決定藏論九識品中說可見這些文句是圓測的簡要敘述而圓測所依據的具說是九識章九識章是引決定藏論九識品的所以先應該肯定九識章與九識品不同圓測的傳說是依據九識章的在真諦所譯的轉識論中發見了九識品的名字如說由事故知有此阿黎耶識但由事故知其有也就此阿黎耶識中具有八種異謂依止處等具如九識義品說依此可推定真諦所傳的九識義品就是決定藏論真諦所譯的決定藏論三卷為瑜伽師地論攝決擇分的別譯決定藏就是攝決擇分的同語異譯攝決擇分是抉擇瑜伽師地論本地分十七地的但真諦的決定藏論僅是攝決擇分中五識地與意地的部分現存的決定藏論內題心地品也就是五識地與意地品的意思決定藏論的心地品可斷為就是九識品理由是一如測疏說引決定藏論九識品中說可見決定藏為一論的總名而九識品為一品的別目真諦僅譯決定藏論的一品心地品當然就是九識品了二心地品中以阿黎耶識為主說到八識又說到阿摩羅識恰合九識的內容三最有力的理由是轉識論說就此識中具有八種異謂依止處等具如九識義品說這確為決定藏論心地品的內容決定藏論說以此八種因緣知有阿羅耶識奘譯作由八種相證阿賴耶識決定是有就是轉識論所說九識義品所說的就此識中具有八種異而八異中的第一依止處即決定藏論所說若離此識根有執持實無此理奘譯作若離阿賴耶識依止執受不應道理據此以八種異依止處等來證成阿賴耶識的稱為九識品的顯然的就是決定藏論的心地品了真諦說第九阿摩羅識是依決定藏論九識品的圓測所據的九識章說阿摩羅識約能緣義名為本覺實與決定藏論不合以阿摩羅識為本覺顯然有附合大乘起信論的痕跡其後定賓的四分律疏飾宗義記卷三竟直說真諦三藏云阿摩羅識有二種全盤承受九識章的解說而不知九識品的本義並不如此論到九識章的作者當然是弘揚攝大乘論的學者真諦時代的攝大乘論偏在嶺南真諦死了以後弟子們才還楊都九江等接著陳滅隋興就傳入北方適逢陳滅隋興的機運造成了北方攝論學的隆盛傳入北方的以靖嵩曇遷為大宗一靖嵩是親承真諦的法泰的弟子弘化在徐淮一帶續高僧傳卷一他的弟子法護立義與玄奘的新譯奄然符會續高僧傳卷一三還有道因參與玄奘的譯場奘師偏獎賞之每有難文義同加參酌宋高僧傳卷二靖嵩門下是近於奘傳維持攝大乘論本義的學系二曇遷見續高僧傳卷一八本從地論學者慧光的弟子曇遵修學在周武滅法時避難來楊都得到了攝大乘論大加讚賞等到周滅隋興他就北上彭城弘揚攝大乘論他對攝大乘論全無師承是本於十地經論的思想來說攝大乘論可說是攝大乘論為表而十地經論為底裡的學者他應文帝的邀請到達長安弘揚攝大乘論特別受到地論師淨影寺慧遠也有起信論疏及曇延弟子們的歡迎他的著作除攝論疏外還有楞伽經疏起信論疏九識章等從現有的史料看來九識章是曇遷的作品這不但曇遷的作品中有九識章而他與當時的地論師慧遠等重視大乘起信論依四論玄義北地諸論師云昔日地論師造論借菩薩名目之也與九識章的引用大乘起信論義指阿摩羅識為本覺相通總之圓測所傳對阿摩羅識的解說是九識章的真諦依九識品而立阿摩羅識應別為研考二阿摩羅識是轉依真諦所傳阿摩羅識的意義試分別來論證先從決定藏論的轉依說傳說真諦的阿摩羅識依決定藏論九識心地品立所以先引決定藏論文又附以玄奘的新譯以便比對觀察易於明了阿摩羅識的本義決定藏論上一切行種煩惱攝者聚在阿羅耶識中得真如境智增上行故修習行故斷阿羅耶識即轉凡夫性捨凡夫法阿羅耶識滅此識滅故一切煩惱滅阿羅耶識對治故證阿摩羅識一阿羅耶識是無常是有漏法阿摩羅識是常是無漏法得真如境智道故證阿摩羅識二阿羅耶識為麁惡苦果之所追逐阿摩羅識無有一切麁惡苦果三阿羅耶識而是一切煩惱根本不為聖道而作根本阿摩羅識亦復不為煩惱根本但為聖道得道得作根本阿摩羅識作聖道依因不作生因四阿羅耶識於善無記不得自在阿羅耶識滅時有異相貌謂來世煩惱不善因滅以因滅故則於來世五盛陰苦不得復生現在世中一切煩惱惡因滅故則凡夫陰滅此身自在即便如化捨離一切麁惡果報得阿摩羅識之因緣故此身壽命便得自在壽命因緣能滅於身亦能斷命盡滅無餘一切諸受皆得清淨五瑜伽師地論卷五一修觀行者以阿賴耶識是一切戲論所攝諸行界故略彼諸行於阿賴耶識中總為一團一積一聚為一聚已由緣真如境智修習多修習故而得轉依轉依無間當言已斷阿賴耶識由此斷故當言已斷一切雜染當知轉依由相違故能永對治阿賴耶識一又阿賴耶識體是無常有取受性轉依是常無取受性緣真如境聖道方能轉依故二又阿賴耶識恆為一切麁重所隨轉依究竟遠離一切所有麁重三又阿賴耶識是煩惱轉因聖道不轉因轉依是煩惱不轉因聖道轉因應知但是建立因性非生因性四又阿賴耶識令於善淨無記法中不得自在轉依令於一切善淨無記法中得大自在又阿賴耶識斷滅相者謂由此識正斷滅故捨二種取其身雖住猶如變化所以者何當來後有苦因斷故便捨當來後有之取於現法中一切煩惱因永斷故便捨現法一切雜染所依之取一切麁重永遠離故唯有命緣暫時得住即於現法一切所受究竟滅盡五從二譯比對看來真諦所譯的阿摩羅識即是奘譯的轉依轉依是否可以譯為阿摩羅識為什麼譯作阿摩羅識這裡暫且不論總之真諦是譯轉依為阿摩羅識的真諦譯轉依為阿摩羅識所以阿摩羅識與阿黎耶識攝大乘論譯為阿黎耶決定藏論譯作阿羅耶即奘譯的阿賴耶識性質恰好相反如黎耶有漏無常而阿摩羅是無漏是常二黎耶是煩惱根本阿摩羅是聖道根本依止四黎耶是粗重所隨阿摩羅離一切粗重三阿黎耶識是一切雜染根本是一切戲論所攝諸行界種子是一切有漏雜染種子的總匯或稱之為過患聚所以必須轉滅這阿黎耶識才能證得轉依阿摩羅識一五這樣阿黎耶是有漏雜染識阿摩羅是譯義為無垢識白淨識依奘傳唯識學有漏的妄識有八識轉成無漏也還是八識所以在八識以上別立第九阿摩羅識是不妥當的而真諦於八識上立第九阿摩羅識應有他不同的看法吧還有依決定藏論而立的阿摩羅識轉依是通於三乘的決定藏論與瑜伽師地論同樣說到阿羅漢及辟支佛不退菩薩如來世尊此四種人以有心處有於六識無阿羅耶識阿羅漢及辟支佛菩薩世尊入滅盡定又世尊入無餘涅槃無阿羅耶亦無六識並見決定藏論上所以決定藏論轉滅阿黎耶證得的阿摩羅識是與唯識三十論所說的阿賴耶識阿羅漢位捨完全一致阿黎耶識的捨滅是現生的苦因永盡來生的苦因永盡如梁攝大乘論釋卷四所說轉依是解脫身約二乘說及法身約大乘說即是滅諦故應以種子滅為轉依一切戲論所攝的種子永滅即轉虛妄而顯現真實如梁攝大乘論下所說於凡夫覆真於彼顯虛妄於菩薩一向捨虛顯真實不顯現顯現虛妄及真實是菩薩轉依解脫如意故決定藏論的阿摩羅識轉依是與阿黎耶識性質相反的二乘八地以上菩薩所證得的然據真諦的譯籍來說由於轉依的地位高下不等阿摩羅識也可通於前後實為如如智證的別名今列攝大乘論下成唯識論卷一的六轉依三無性論下的五轉依於下攝大乘論成唯識論名同三無性論損力益能轉通達轉有動轉依修習轉有用轉依果圓滿轉究竟轉依下劣轉一分轉依廣大轉具分轉依損力益能轉僅是阿黎耶識中的染種力減淨種力勝與智證如如捨滅二障種子的轉依不合這可說是相似轉依不能稱為阿摩羅識所以三無性論略而不說下劣轉與廣大轉三無性論略異即是二乘轉依與大乘轉依果圓滿轉為究竟的佛果此外通達轉與修習轉三說不同成唯識論約見修二道說初地見道位名通達轉初地到十地的修道位名修習轉攝大乘論約有相無相說初地到六地是有相的名通達轉七地以上無相名修習轉三無性論約有動有用說七地以前有入觀出觀的轉動名有動轉依八地以上有功用行名有用轉依而大乘的具分轉依三無性論約見道位說雖三說不同總之大乘初地以上可稱為轉依而究竟轉依在佛地三阿摩羅識轉依的意義說到阿摩羅識的還有轉識論三無性論十八空論除十八空論的一則外都明顯地說明了阿摩羅識就是轉依就是無漏界是境智無差別的如如智證關於這還得先從轉依說起在聲聞乘法中但說涅槃大乘唯識學特說轉依這有非常的意義轉依體是滅諦真如離染的現證如梁攝大乘論卷四說對治是道諦轉依是解脫及法身即是滅諦故應以種子滅為轉依成唯識論卷九釋便證得轉依時說頌意但顯轉唯識性二乘滿位名解脫身在大牟尼名法身故大體一致但由於攝論宗及唯識宗的看法不同達到不同的結論這問題在對有漏與無漏如與智性與相唯識宗始終取著差別論的說明而攝論宗是在一般的說明上也作差別說明而在無漏智證的顯現上卻重於轉有漏成無漏如智無差別泯相即性的說明所以性相如智儘管可以作差別說明而決非對立物如轉依成唯識論說此轉依即無漏界不思議善常安樂解脫身大牟尼名法轉識論也說是名無流界是名解脫身於三身中即法身這決不但是如如而是如如如如智的平等平等無漏德行的一切真諦譯中以如智無差別為轉依為阿摩羅識應從這點去了解再來分別的說明一阿摩羅識是境識並泯境智無別的實性如說第五非執著相唯為真實性所攝者此不執著名義二相即是境智無差別阿摩羅識三無性論下此境識俱泯即是實性實性即是阿摩羅識轉識論由修觀熟亂執識盡是名無所得非心非境是智名出世無分別智即是境智無差別名如如智亦名轉依轉識論二明正觀唯識遣蕩生死虛妄識心及以境界一切皆淨盡唯有阿摩羅清淨心也十八空論先以唯一亂識遣於外境次阿摩羅識遣於亂識故究竟唯一淨識也三無性論上從上面所引的論文來考察可見阿摩羅識是約有漏的心境來說這不但離於亂相的似塵也遣於亂識阿摩羅識轉依是心境俱泯的沒有能取所取的約無漏現證來說這是境智無差別的境是無分別法性是無二無別的智是無分