body:
  text: 法之研究一序起法是達磨巴利語作的義譯在佛法中法有根本而重要的意義如佛教的流傳人間稱為三寶住世三寶是我們的歸依處信仰與理想所在而法就是三寶之一如釋尊成道以後在波羅奈的鹿野苑為五比丘開始宣揚其自覺自證的聖道稱為轉法輪法是佛法的內容而佛與僧是法的體現者與實踐者所以法是佛法的根本與核心從聖典看來法的內涵極為深廣法所表示的意義也不一致在佛法的流傳中一切法成為熟悉的成語善惡邪正一切都是法如一般人說到法就會想到俱舍論的七十五法大乘的百法一切一切都是法這樣的意義當然也是古已有之但著重於這樣的法與如來出世宣揚正法的根本意義顯然有了距離法被偏重的泛稱一切習慣了也就忽略法的本義如西藏所傳彌勒所造的辨法法性論法尊譯漢藏教理院刊本竟然說法為生死法性為涅槃法被局限於生死流轉的一切有漏法與法的本義法是歸依處到了恰好相反的一面關於法的含義原始佛教思想論漢譯本六九七引覺音的法有四義教法因緣德現象而以為應分為教法與理法而理法有現實世界的理法及理想界的理法我在佛法概論曾類別為文義法意境法歸依法而歸依法中又有真實法中道法解脫法第一章第一節現在看來依法的不同意義而作不同的分類是可以的但從含義的不同發展的傾向以探求法的根本意義還嫌不夠所以再以法為對象而作進一步的探究古代有智所知識所識通達慧所通達論門說一切有部阿毗達磨論師以為一切法是智所知的也一切是識所識的通達所通達的但大衆部等卻說一切法處非所知非所識是所通達異部宗輪論大概的說這是以為識所認識的與般若所通達的不完全相同阿毗達磨者的見解自有他的思想淵源有他的獨到見地但如以法為有是識所識的有是通達所通達的在說明上倒不失為善巧的方便二聖道現見的正法法是釋尊自覺自證而為衆生宣說開示的自覺自證的法一向稱為甚深極甚深難通達極難通達為衆生作契理契機的宣說實在並不容易從佛的開示看來佛是以聖道為中心而方便開示的聖道是能證能得的道以聖道為法主要是八正道如雜阿含經卷二八說正見是法乃至正定是法八正道正見正思惟正語正業正命正精進正念正定為初轉法輪時宣說的道八正道為什麼稱為法呢法從字根而來有持執持不失的意義八正道是被稱為古仙人道古仙人徑古仙人道跡雜阿含經卷一二八正道是一切聖者所必由的佛曾為須跋陀羅表示了絶對的決定的主張如長阿含經卷四說若諸法中無八聖道者則無第一沙門果第二第三第四沙門果須跋以諸法中有八聖道故便有第一沙門果第二第三第四沙門果可見八正道是解脫所必由的不二聖道不變不失所以稱之為法聖道不外乎八正道但佛應機而說有種種道品如佛曾一再為阿難說自洲或譯燈以自依法洲以法依不異洲不異洲依雜阿含經卷二四佛教弟子們依自己依法而修習而依止的法就是四念處身念處受念處心念處法念處四念處是八正道中正念的內容八正道是古仙人道四念處也被稱譽為有一乘道能淨衆生度諸憂悲滅除苦惱得真如法準中阿含經卷二四真如法即正法謂四念處雜阿含經卷四四這是貫通古今前聖後聖所共依的一乘道還有摩訶迦旃延說六念念佛念法念僧念戒念施念天為一乘道雜阿含經卷二這樣的古道與一乘道都稱之為法八正道統攝為三增上學這是一般所公認的依戒得定依定發慧依慧得解脫這樣的三增上學能得解脫的實現所以長阿含經卷二遊行經中稱戒定慧解脫為四深法如加上解脫的證知即成戒定慧解脫解脫知見名五分法身法蘊佛的無學弟子都是成就此法的所以長阿含經卷六說佛真弟子法法成就所謂衆者戒衆衆即蘊的異譯成就定衆慧衆解脫衆解脫知見衆成就上來以聖道為法而展開著重於道的體證解脫依聖道而修習成就一定會體現那甚深法反之如不能如實知見陷於迷謬的二邊那怎能解脫呢這樣從聖道的先導者正見而開示如實法聖道的如實知見據雜阿含經卷三說四聖諦八聖道而外舉十二支緣起如實知見從無明到老死十二支為緣起說的最後定論佛說因因緣緣起這些術語起初是沒有多大差別的這無非指出一項根本法一切的有與無生與滅都依於因緣顯示了有無生滅的所以然釋尊到底怎樣開示緣起呢釋尊一向宣說此有故彼有此生故彼生此無故彼無此滅故彼滅這裡所應該注意的有與生是無明緣行行緣識純大苦聚集無與滅是無明滅則行滅行滅則識滅純大苦聚滅苦聚就是稱為五盛陰苦的五取蘊現實身心的總名五取蘊的集起依於因緣滅盡也由於因緣這似乎從因緣而展開為相生與還滅的二面其實是無明緣行行緣識純大苦聚集是緣起是依緣而集起無明滅則行滅行滅則識滅純大苦聚滅是寂滅不是依於緣而是緣滅了舍利弗聽了馬勝比丘的一偈而悟入極有名的緣起偈四分律卷三三這樣說諸法因緣生佛說此因緣是法緣及盡是大沙門說緣依緣而集起與盡滅不能看作不相關的兩法因為依緣而集起的當下就顯示了滅盡的可能與必然性此有故彼有的沒有不歸於此無故彼無所以悟入因緣緣起的依待性也就能更深入的悟入寂滅因此中阿含經卷七說若見緣起便見法若見法便見緣起甚深微妙法從緣起的悟入而顯現出來佛所自證的深法感到不容易宣說而有我若說法徒自勞苦的慨歎傳說梵王為此而請佛說法律部都有記載相應部六一說世尊獨處禪思作如是念我所證得甚深之法難見難悟寂靜微妙超尋思境深妙智者乃能知之衆生樂阿賴耶喜阿賴耶欣阿賴耶衆生以樂阿賴耶喜阿賴耶欣阿賴耶故是理難見所謂緣起倍復難見所謂一切諸行止滅諸依捨離愛盡離欲滅涅槃這在漢譯雜阿含經卷一二即分明的稱為有為與無為如說此甚深處所謂緣起倍復甚深難見所謂一切取離愛盡無欲寂滅涅槃如此二法謂有為無為難見與倍復難見是先後的次第悟入這就是先知法住後知涅槃雜阿含經卷一四了涅槃是不生不滅的無為法一切法中最為第一雜阿含經卷三一這是不消多說的緣起是有為生滅為什麼也稱為法任持不失呢對於這釋尊有明確的開示如雜阿含經卷一二說緣無明有行乃至緣生有老死若佛出世若未出世此緣起法常住法住法界彼如來自所覺知成等正覺為人演說開示顯發此等諸法法住法定原誤作空法如法爾法不離如法不異如審諦真實不顛倒這一經文是非常著名的雖傳譯略有不同但主要是說明緣起是本來如此的與佛的出世不出世無關佛只是以正道而覺證他為衆生說明而已法住法界等是從種種方面來形容表示緣起法的意義雜阿含經卷一二說此緣起法常住法住法界玄奘在瑜伽師地論中譯作安住法性法住法界什麼叫法性如增支部一二說凡持戒具戒者不應思我起無憂於持戒具戒者而無憂生是為法性厭離者不應思我現證解脫知見於厭離者而現證解脫知見是為法性中阿含經卷一譯法性為法自然這是說修道持戒得定如實知見這些道法如能修習會自然的引生一定的效果法是這樣自然而然的性自爾故所以叫法性又如雜阿含經卷四四說過去等正覺及未來諸佛現在佛世尊能除衆生憂一切佛恭敬法依正法而住如是恭敬者是則諸佛法是則諸佛法據巴利藏應作是諸佛之法性意思說諸佛於法是自然的當然會這樣的依正法而住的依法而住與恭敬法就是以法為師的意思法性本形容法的自然性但一般解說為法的體性實性法與法性被對立起來而法的本義也漸被忽略了這些形容法的詞類都應該這樣的去解說如法緣起是安住的確立而不改的所以叫法住法是普遍的常住的所以叫法界常住法是不動的所以叫法定法是這樣這樣而沒有變異的所以叫法如如是的義譯或作真如法不離如法不異如就是非不如性不變異性的異譯是反覆說明法的如義審諦真實不顛倒奘譯作是真是實是諦是如非妄非虛非倒非異也就是說明法緣起是真實而非虛妄的審諦而非顛倒的如如而非變異的這樣的甚深緣起及緣起寂滅非變非異法爾自然當然是法了從道的實踐而達解脫的證知五分法身是從能證邊說從聖道的如實知見悟入緣起與涅槃是從所證邊說這是釋尊開示正法的兩大方便其實修聖道而能悟見緣起與寂滅當下就是離繫解脫的證知了法是以聖道的實踐為核心的所以佛的開示或稱為示涅槃道的勝法經集二三三此外如實知見的還有四諦佛在波羅奈初轉法輪就以四諦為法的綱要四諦苦苦集苦集滅苦滅道這也就是法所以雜阿含經卷一六說如如不離如不異如真實審諦不顛倒是聖所諦在這四諦的開示中也有兩方面的敘述一經中一致說到如實知四諦四諦是應思惟應如實知應現證的這是從所邊說二如雜阿含經卷一五轉法輪經說四諦是應了知應現證的但又說知苦斷集證滅修道這是說在修道的實踐中知苦斷集而證於寂滅可見這是從能邊說苦與集苦由集起由集起苦就是純大苦聚集為緣而起的緣起法苦集滅就是純大苦聚滅也就是愛盡無欲的寂滅涅槃在聖道的實踐中不但悟見苦集滅而也是知苦緣起故無常苦無我我所斷集離愛證入於寂滅知斷證修的四諦說是以聖道的修習而敘述其斷證的這二類不同的方便敘說實為後代部派中漸悟四諦與頓悟滅諦的異義的根源法是我們的歸依處佛弟子應念法於法證淨無疑的法隨念與法證淨的法雜阿含經卷二這樣說世尊現法律離諸熱惱非時通達即於現法緣自覺悟玄奘於法蘊足論卷二譯為佛正法善說現見無熱應時引導近觀智者內證這可以略為解說佛的正法是善巧宣說說得恰如其分的善說佛的正法能在現生中悟見而不是非要等到來生的現見八正道與煩惱不相應是清涼安隱的無熱應時或譯不時佛法不受時間的限制什麼時候都可以契入的八正道有引向通達的能力引導能隨順於如實知見近觀是佛及佛弟子所自覺自證的稱為智者內證所以法不是別的是從聖道的修習中現見緣起與寂滅而得自覺自證方便的開示中這就是法就是我們的歸依處這一切是本於佛的現正等覺而來三法與義法與律的對立佛開示的正法雖方便的說為聖道聖道所覺悟的如實由聖道而實現的解脫而實就是佛陀自覺自證的內容但在佛法的流傳中法與義法與律卻分化而對立起來法與義並舉阿含經中到處可見考察起來也還有三類一如雜阿含經卷二九說何等為沙門法謂八聖道正見乃至正定何等為沙門義謂貪欲永斷瞋恚癡永斷一切煩惱永斷這是以八聖道為法以聖道所得的利益效果為義又如雜阿含經卷一六說非義饒益非法饒益非梵行饒益非義饒益巴利藏作不引義利可見義是從法而來的實效也就是修法的真正義利義是實際的義利所以空虛的議論迷妄的宗教行儀如苦行等是沒有實際效果的都稱之為無義而為佛所呵棄二法是聖道所現見的義是法所含的內容如雜阿含經卷一二說法說義說法是如實知見的緣起支義是緣起支的別別解說與此相當的相應部一二一二雖作法說分別說然據四無礙解的法無礙解義無礙解及四依的依法不依人依義不依語而說法為聖道所現見的義是所含內容的分別是非常恰當的法與義的這一對說是重於開示解說的教法三重於教法而更進一步的如中阿含經卷一善法經說云何比丘為知法耶謂比丘知正經歌詠記說偈咃因緣撰録本起此說生處廣解未曾有法及說義云何比丘為知義耶謂比丘知彼彼說義是彼義是此義這是以十二分教巴利藏見增支部七集作九分教為法以十二分教的意義為義這樣法是佛所說的一切教法本生譬喻等都在內而不是專指聖道現見的法了從雜阿含經所見的法與義到中阿含經或增支部所見的法與義看出了佛教界從重於證法而傾向於教法的歷程法與律的並舉是僧伽發展所引起的佛的成正覺轉法輪一貫是法的現覺法的開示由於隨佛出家的多了所以依法攝僧而有僧伽的成立一方面因學衆的違犯而有學處的制立半月半月說名為波羅提木叉一方面規定了出家受戒等僧伽的制度出家中心的僧伽日漸廣大這些被稱為律的也日漸重要達到與法對立並舉的地位說到律梵語音譯為毗奈耶毗尼義譯為律調伏經律中常見法與律並舉如法律法毗奈耶是法是毗尼非法非毗尼等法與律的對舉起初是與法義並舉一樣表示法與法的效用正法的現見是如實知而得解脫的由法而得這樣的義利所以稱為義同樣的法聖道的修證一定是離罪惡離顛倒離縛著而身心調伏的所以稱為毗尼我曾比喻為法如光明的顯發毗尼如陰暗的消除法與毗尼是同一內容的兩面但在僧伽的發展中和樂清淨為僧伽的特質在僧伽中無論是個人的身心活動或是僧伽的自他相處如有不和樂清淨的就與法不相順而有礙於法的進修反之如消除不和樂清淨的因素自能法隨法行而向於正法這樣犯罪而行懺悔奉行僧伽的規制就稱為毗尼與法有同等的重要性毗尼母論卷七說毗尼者凡有五義一懺悔二隨順三滅四斷五捨懺悔是犯或輕或重的過失作如法的懺除約波羅提木叉說隨順是遵照僧伽的規制受戒安居等如法而作這二類又稱為犯毗尼滅是對僧伽引起的糾紛如法滅除就是現前毗尼等七毗尼這又稱為滅鬪諍言訟毗尼斷是對煩惱的對治伏滅又稱為斷煩惱毗尼捨是對治僧殘的不作捨與見捨從古代的解說來看都是有個人的思想或行為錯誤的調伏不遵從僧伽規制或自他鬥諍的調伏斷煩惱毗尼可說是毗尼的本義因為見法必斷煩惱斷煩惱就能見法但在僧伽制度的開展中毗尼成為波羅提木叉與犍度的總稱其後著重於教法所以結集的文句也就內容不同而分為法經與毗尼法與毗尼由於教典各別漸被看作不同的二事這不但局限了法的內容律師們還高唱毗尼至上想與法一論短長四傳承中的無比法與妙法法是聖道聖道的證知與解脫這一根本意義在佛法的弘傳中上座說一切有部是堅定地受持的所以大毗婆沙論卷一八二說云何法輪答八支聖道法以聖道為本在佛教的部派發展中可說都在探求最根本的最主要的聖道赤銅鍱部的分別論一一二並列八支聖道與五支聖道化地部就說正道唯五論事二五這與譬喻師所說奢摩他毗鉢舍那是道諦大毗婆沙論卷七七意見相合這是說在聖道的體證中是沒有正語正業正命的這是以戒為助道的資具定慧才是道的主體大衆部更進一步如異部宗輪論說慧為加行能滅衆苦這是以慧般若為道體聖道的修證就是般若的修證以聖道聖道的主體般若為法的上座說一切有部及初期大乘經都正確的傳承下來說一切有部中重於阿毗達磨的論師雖也以八聖道為法而特重於慧法達磨佛教界偏重於一切法法的根本義不免晦昧不明所以阿毗達磨大法無比法究竟法在一切法中被舉揚出來甚深無比的法阿毗達磨據大毗婆沙論卷一說阿毗達磨自性云何答無漏慧根以為自性無漏慧是勝義阿毗達磨也就是真實的阿毗達磨能引發無漏慧的有漏修慧思慧聞慧生處得慧詮表阿毗達磨的論典教是阿毗達磨的資糧依此能得阿毗達磨無漏慧所以也名阿毗達磨這都是世俗假名阿毗達磨依大毗婆沙論所說依論典而引生有漏慧依有漏修慧而得無漏慧該攝了聖道修學的歷程關於初期的大乘經且舉般若經與法華經為例摩訶般若波羅蜜經小品卷五說諸佛依止於法供養恭敬尊重讚歎於法所謂法者則是般若波羅蜜法為佛所尊敬為佛所依住是阿含經所說的所依所敬的法不是別的就是般若據阿含經及律由於佛說八聖道名為轉法輪現在廣說聖道的主體般若所以諸天於空中說我於閻浮提再見法輪轉小品卷四這一開示顯明了佛陀證法與教法的本義於般若特有深究的龍樹在大智度論卷一八說諸法實相即是般若波羅蜜知諸法實相慧是般若波羅蜜又卷五六說因語言經卷能得此般若波羅蜜是故以名字經卷亦名為般若波羅蜜對般若的分別解說就是實相般若觀照般若文字般若三般若的根據大智度論卷三一又說般若波羅蜜有二分有小有大欲得大智慧實相般若當學十八空觀照般若住是小智慧方便門能得十八空何等是方便門所謂般若波羅蜜經文字讀誦聞正憶念思如說修行大小般若與勝義世俗二類阿毗達磨實相觀照文字三般若與無漏慧有漏慧阿毗達磨論三類阿毗達磨豈不是有同一的意趣嗎雖然聖道般若與緣起寂滅阿毗達磨者重於差別的說明而般若經重於現證如智不二的實相般若而以聖道的現覺為法是非常一致的再說法華經具稱妙法蓮華經妙法也可譯為正法妙法或正法原是阿含經以來的固有名詞什麼是妙法從前智者大師說迹門十妙本門十妙真是說得玄之又玄妙之又妙其實妙法或正法就是佛所自證的佛要說由於衆生愚癡而不容易說的法如上文所引世尊獨處禪思作如是念我所證得甚深之法難見難悟等法華經就是把握這妙法而給豫開顯出來如卷一說我始坐道場觀樹亦經行於三七日中思惟如是事我所得智慧微妙最第一衆生諸根鈍著樂癡所盲即愛樂欣喜阿賴耶如斯之等類云何而可度其後也說到因梵王請法而決定方便說法法華經說佛自證的妙法是我所得智慧微妙最第一從這一見地去看時法華經的妙法即明顯的表示出來佛所自證的妙法如卷一說佛坐道場所得妙法智慧甚微妙諸佛之所得我所得智慧微妙最第一如來知見廣大深遠無量無礙力無所畏禪定解脫三昧深入無際成就一切未曾有法這可見佛於道場現證的妙法以智慧知見為主攝得力無所畏等一切無漏功德在如來廣大深遠知見中如卷一說甚深微妙法難見難可了道場得成果我已悉知見無漏不思議甚深微妙法我今已具得唯我知是相如是大果報種種性相義是法不可示言辭相寂滅諸佛兩足尊知法常無性佛種從緣起是法住法位世間相常住佛自證的妙法以智慧而徹證緣起寂滅智境不二的圓證以智慧現證為主所以開宗讚歎說諸佛智慧甚深無量其智慧門難解難入這樣佛所要說而一時還不能明說的妙法就是佛之知見佛慧只是這一大事所以名為一乘如卷一說唯以佛之知見示悟衆生舍利弗如來但以一佛乘故為衆生說法無有餘乘若二若三說佛智慧故諸佛出於世唯此一事實餘二則非真如來所以出為說佛慧故為說佛慧的一佛乘也名為大乘是攝得種種功德的如說佛自住大乘如其所得法定慧力莊嚴以此度衆生是乘微妙清淨第一於諸世間為無有上無量億千諸力解脫禪定智慧及佛餘法總之妙法是佛自證的要說而不曾明說的就是佛慧佛之知見在般若經中雖說法者則是般若波羅蜜大智度論卷五五也說般若波羅蜜是諸佛實智慧但到底著重於菩薩現證的般若所以說般若但屬菩薩而是般若波羅蜜菩薩成佛時轉名一切種智大智度論卷四三法華經直探如來自證的妙法佛之知見所以卷二稱歎為今復轉最妙無上大法輪是法甚深奧了五法輪與轉法輪法是聖道般若的現證這是佛所自證的也是方便開示而引導弟子來同樣證入的名詞然而法是印度舊有的名詞佛為什麼選用這個法字來代表現等正覺的內容佛說法而阿若憍陳如悟入了諸天稱譽為轉法輪法為什麼比喻為輪而形容為如輪的轉動呢這是值得思考的事雜阿毗曇心論卷一擇取大毗婆沙論卷一八二的要義說牟尼說見道疾故名法輪或說學八支轉至於他心見道是最初悟入是非常迅疾的後代禪者稱為直入頓入妙音解說為轉至於他心本為佛陀的自證因佛的引導而從弟子心中頓然顯現被形容為如新㲲易染那時遠塵離垢得法眼淨正是慧光朗徹的現覺我從禪宗東山門下的以心傳心而理會轉法輪的本義聖道的悟入佛沒有闡述所邊悟的是什麼而約能邊智慧現前說得法眼淨轉法輪經更廣說為生眼生智生明生覺以慧為主的現證內容稱之為法譬喻為輪那樣的迅疾轉至於他心是極為明確的平常說法是持義有不變不失的意思那怎麼比喻為輪如輪那樣的疾轉呢與釋尊同時發揚而完成的耆那教立法與非法法是運動的原理非法是靜止的原理以法為運動的原理與佛說不合但印度固有的法這個名詞有運動的意味不正是佛說法輪轉法輪的有力旁證嗎陀羅尼是大乘的特法大智度論卷五解說為能持能遮持與遮實為同一內容的相對作用一般是譯為總持的陀羅尼也從字根而來陀羅尼的持而不失與法同一語原陀羅尼可說是達磨俗化了以後引起的代替名詞這可以從一器物來說明兒童玩具中有名為陀螺的形製各式不一或截取竹筒作孔中貫以支柱先以繩纏繞然後抽繩放去陀螺就急疾地旋轉在轉動而能保持力量平衡時能卓立而不會倒下來並發出嗡嗡的聲音這名為抽陀螺也有木製的卓立在地抽繩而急疾旋轉如不斷的以繩鞭策他就能久久的保持卓立而不倒這可說是打陀螺了陀螺實是從印度傳來的如涼譯阿毗曇毗婆沙論卷三說猶如小兒弄於獨樂旋速則見如住旋遲則見來去獨樂顯然為陀螺的異譯所以被稱為陀螺即獨樂正因為旋速則見如住能保持不失這是而用於器物的稱呼與陀羅尼達磨法都從保持不失的意義而來陀羅尼有名為旋陀羅尼的可見的持而不失是在動態下顯現出來而不是什麼靜止的抽象的不變不失的原理這對於法達磨的被用為運動的原理被比喻為輪輪那樣的轉動是可以理解的理解佛說的法的本義那對於大乘現證法的內容也可以有充分的理由去論證了法輪從輪王的輪寶而來釋尊誕生於王家所以佛的化導世間每以輪王的治化相對比正法治世的輪王主要從輪寶得名輪寶是輪王的七寶之一據印度傳說如國王而奉行仁政輪寶就會東方來輪寶有千輻一切具足清淨自然非人所造色如火㷿光明昱爍中阿含經卷一五等輪寶有無比的威力飛到那裡那裡的國家就不經戰爭而順伏奉行愛民及物的德化的政治輪寶是圓形的光明赫赫的威力無邊的迅速飛行的從東方來的來了就是和平與繁榮這大概是太陽神話引起的傳說千輻輪相也與傳說日稱千光相合佛於菩提樹下的廓然妙悟稱為菩提般若涅槃都不外乎這一現證法的說明據佛法的信念釋迦佛所現證的與一切佛平等弟子們修習相應也一樣的現證與佛一樣同得解脫所以現證的法是古今一如的迅速出現的可以從此到彼的現證時慧光朗徹降伏一切無明煩惱的這樣的法的現證如輪王的輪寶一樣所以就稱之為法輪轉法輪了這就是正法妙法是我們歸依的法六意識所識的法法是聖道現覺的勝義法天魔梵所不能轉的在佛教特別是阿毗達磨論師發達中重視世俗法一切法而現證的內容又形成法性真如實相與法相對立的勝義名詞但也專約所邊說所以雖說理智一如法性等自然的被解說智慧所證的真理了世俗法在佛應機設化中也早已經應用佛是就現實的世俗事而引歸勝義的佛開示的法門有蘊處界等處是十二處眼耳鼻舌身意色聲香味觸法眼等為內六處色等為外六處眼等內六處六根各有所取的境如眼取色耳取聲鼻取香舌取味身取觸意取法法是意所取的十二處引發六識總稱十八界在十八界中法是意根所取意識所識了別的法是物質色聲香味觸以外的一切但意與意識不但取法識別法而且能取一切了別一切所以一切都是意所取的意識所了別的一切都可名法稱為一切法一切法雜阿含經卷一三已經說到了雖在南傳的相應部中只是一切然一切法一詞早為經律各派所通用了這一切為什麼都稱為法俱舍論卷一傳阿毗達磨論者的解說能持自相故名為法無論是根是境是識都有不共其他的一定特性自相一定作用約特性不失說叫做法法就是持的意思唯識學者解說得更圓滿如成唯識論卷一說法謂軌持依軌持的意義說有一定的特性能持自相能引發特定一定範圍內的認識軌生他解這是說可識知的一切與所識有一定的關係所識有他不共的特性存在這種特性能引發特定的認識這就是法這樣的解說確乎符合於意識所知的一切都名法的意義一切法是一般的世俗的一般認識到的一切自從部派佛教特別是上座系著重於一切法的論究以來雖對現實的身心有深切的研究良好的成果但過分傾向一切法的分別不免忽略了佛所自說的以聖道為中心的現證法初期大乘法的興起就是針對這種偏向而以菩薩般若如來知見為本復活了佛陀時代聖道實踐的正法
