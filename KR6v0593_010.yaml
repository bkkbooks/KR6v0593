常住不變勝義善的清淨的光明的這些都是真如法性自身所具足的並非有為功德有為的聖法是從無漏種子而生起的無漏現行所以真如的不離不脫不異不思議佛法是約無為功德說的若如真常學者所說那佛陀只有無為功德而無有為功德了最後說到唯識學者否定如來藏為緣起的問題這也是真常與唯識所諍論的一個中心問題依真常學者說如來藏緣起是依據論典大乘起信論而說的唯識學者說釋尊的經教我們還可以分別它的了義與不了義論典根本不足以為據的無上依經說一切眾生有陰入界勝相種類內外所現無始時節相續流來法爾所得至明妙善此處若心意識不能緣起覺觀分別不能緣起不正思惟不能緣起若與不正思惟相離是法不起無明若不起無明是法非十二有分緣起這說明如來藏不能為生死之緣起的一般所謂生死是由惑起業由業感果從惑業苦的流轉不息而有生死約這一意義說只能說生死沒有離開真如法性或說迷於真如法性而有生死不能說真如法性為生死的緣起因為雜染法根本不能以清淨法為緣起也不能從無漏的清淨心生起所以無上依經說真如非無明所能緣起一般說如來藏的都以為真心為染法所污從真心而起妄心由妄心再起顛倒熏習真如形成生死流轉如滅去顛倒的妄心則真心即能顯發出來而成涅槃解脫地論宗學者舉喻來說明這一意義如我們作夢時的顛倒夢心是由夢中意識而來而夢中意識又是來自明了心的因我們明了時所見的一切現象等到睡夢時心起模糊而生顛倒所以虛妄心是依真實心而起無明煩惱的但依唯識學者說夢中是夢中意識平時為明了意識夢中意識是有夢中意識的種子明了意識是有明了意識的種子是各各不同的無漏心我們根本從未有過我們向來即只有虛妄雜染心怎能說虛妄心從無漏清淨心生起所以唯識學者不承認有一清淨心為虛妄心之根本更不承認如來藏為生死法之緣起只能說生死是依如來藏的這樣大乘起信論中的真如熏無明無明熏真如唯識學者也是不承認了因為不生不滅的真如法體是不可以也不能熏無明及為無明所熏的依唯識學者說經中說如來藏是對的而一般所說的如來藏緣起是錯誤的由於這一根本見地的不同所以唯識與真常系的天臺賢首禪宗另有很多諍論如一切眾生皆有佛性有如來藏可以成佛這在唯識學者看來認為應該有所分別因為佛性有二種一理佛性這是就真如法性而言的真如又名法界此理佛性的圓滿清淨故又名法身二行佛性成佛與否須視有無無漏種子而決定因為眾生的根性各各不一有人是具有聲聞乘無漏種子的有人是具足獨覺乘無漏種子的有人具備成佛無漏種子的也有人圓具三乘聖法無漏種子的也有人沒有三乘聖法無漏種子而只有人天乘種子的這便是所謂無性眾生不能成佛的從這一解說中否認了一切眾生皆有佛性可以成佛的教說唯識學者認為就有無無漏種子的立場言確有一分眾生沒有佛性不能成佛的具二乘種子不具成佛無漏種子的還是不能成佛的這是唯識與如來藏學者的諍論處如來藏學者是以一乘為究竟三乘為方便的因為一切眾生有如來藏具足無量清淨功德個個都可成佛而唯識學者與此相反以三乘為究竟一乘為方便因為佛說一乘只是一種方便教說有些眾生根本不能成佛怎能說一乘是究竟的在唯識學者的眼中法華經因此也成為不了義的再就中觀學者的見解來說如來藏唯識與真常論二家就其講唯心的這一立場言二者是共通的中觀學者對此有一不大同的見地一如來藏為佛所說是對的但是不了義教如佛在楞伽經中明白地說過我本說空無相無願無我等法但因一般印度宗教學者驚畏於無我句不能信受以為無我不能建立生死涅槃因此而說空性為如來藏使他們覺得有一似我的如來藏這才信受佛法其實這如來藏即是法空性法無我性的方便教說所以說如來藏為依是不了義的二唯識的阿賴耶識也是不了義的因為這又是如來藏的別名如密嚴經中說佛說如來藏以為阿賴耶惡慧不能知藏即賴耶識佛陀雖以法性法空性等方便說為如來藏但有的眾生不能信受這常住不變的如來藏為所依又不能深契無我無常所以不能不稱如來藏為阿賴耶說為相續不斷的心識為所依如來藏既是佛陀的方便教說則依此而立阿賴耶更是方便教說了依中觀學者說一切法性本來是空寂的眾生的生死輪迴是由無始以來的無明業生死形成一個一個的個性由無明起業業感生死造成一個前後相續不斷的個體這如幻如化的生死形成一個統一的體系如五蘊的和合成為生命的統一體前生後生構成生死輪迴的統一性眾生的煩惱業果以及一切精神與物質現象都是無常無我本性空寂的這一切雖然是無常的但因前後生的相續不斷而又成為相似的統一雖然是無我的但由五蘊的聚合也成為統一的相似的我假我眾生即在這相似的假我上而執常執我其實這常我的當體即是無常無我當體空寂在這無常無我的緣起法上有些人引生出一個問題一切法既然本性空寂的他以為沒有無常的他以為間斷為何會有生死連續的現象一切法既是無我的為何又有生命個體我體的現象對於他們無常無我的深義完全不能理解因此不能信受佛法佛陀這才就本性空寂的法性方便說為如來藏說有一常住不變的似我體性所以眾生有業有果有生死輪迴這樣引他們信受入佛法再次第引導使了解如來藏即是法性空寂無我的別名佛說阿賴耶識也是如此唯識學者信受無常無我所以不同意依常住不變的我體安立生死輪迴而在無常生滅法上安立生死輪迴但對無常生滅的生死延續認為是剎那剎那不能間斷的在唯識學者研究起來眼等六識是不能安立生死輪迴的因它有時會間斷必須要一從未間斷的恆轉相續如瀑流的識才能成立生死輪迴如眾生所造的善惡業種子在相續識中才會保藏不失我們見了東西會憶念造了業會感果這一切都是由相續如流的識而成立佛陀因這類眾生雖然信解無我無常而對無常無我的深義還有隔礙所以不得不將不變常的如來藏說為相續常的阿賴耶識了而這阿賴耶識一般人還是容易認為是我的如解深密經說阿陀那識甚深細一切種子如瀑流我於凡愚不開演恐彼分別執為我一般人聽到阿賴耶阿陀那即以為是從前生延續到後生的生命主體與常我相似其實佛說的阿賴耶識是指即本性空的生死延續中所表現的統一性隨順眾生以心為我的見解說此為識此識即是本性空寂的空性即是如來藏也就稱此如來藏為阿賴耶唯識學者的這種生滅相續論中觀學者是不能贊同的如造業是剎那滅的業滅過去並非沒有而是存在的如從過去到現在從現在到未來業是存在的有用的不過這種存在只是過去有非現在有因為有此業存在才能感受生死苦果法性空中無礙過去雖然過去或者很久了仍然可起用不必要相續才能成立因果所以中觀者不必立阿賴耶識如釋尊在阿含經中以及極多的大乘經中並未說到阿賴耶識難道就不能安立生死輪迴嗎只要真正理解緣起性空的真義無常無我而能成立生死與涅槃何必再說如來藏與阿賴耶識只因眾生根鈍所以為說如來藏或阿賴耶識法門使其確立生死輪迴與涅槃還滅的信念能在佛法中前進這是極好的妙方便了所以中觀學者從不如唯識學者那樣反對大乘起信論與楞嚴經也不說唯識非佛法只說是方便說而已如對佛法法性空寂而緣起宛然的認識進步了知道什麼是如來藏什麼是阿賴耶識自然會進入佛法的究竟法門所以佛說各種法門都是有用的並非說六識的不圓滿說八識才圓滿也不是說如來藏不空才究竟說真如空就不究竟中觀學者依於性空緣起的深義所以是確信一乘的一切眾生皆可成佛的但不像真常學者一樣說如來藏本具一切無量稱性功德也不像唯識學者說阿賴耶本有一切無漏種子因為中觀者信解因果如幻的三世觀染淨無實的隨緣觀不會落入非先有自性不可的見地七如來藏為涅槃因如來藏雖有各家的解說但如來藏畢竟為真常唯心論者的核心論題所以現在依如來藏學派的根本立場來解說如來藏為清淨涅槃因如來藏又為雜染生死因然從如來藏的主要意義看如來藏是特重於涅槃因的所以中國的傳統佛教特重於說如來藏即是佛性為一切眾生成佛的因依如來藏為涅槃因這在經的方面如勝鬘經不增不減經無上依經大法鼓經央掘魔羅經涅槃經等在論的方面如堅慧的法界無差別論及一說為無著所造的究竟一乘寶性論以及真諦譯的佛性論傳說為世親所造這三論對如來藏為清淨涅槃因的意義加以有體系的說明與真諦譯的無上依經幾乎同一形態這些經論雖內容的組織相近但在論說的主題卻有所不同法界無差別論是以菩提心為主而說明的究竟一乘寶性論是以三寶的寶性為主這寶性亦即通常所說的一體三寶與常住三寶佛性論是以佛性為主無上依經是以如來界即如來藏為主而說明一切的依據這些經論來說明如來藏為涅槃因分作四部分來說明一如來藏佛性寶性如來界等二菩提三功德四業依如來藏學說要將這四部分說到才能圓滿的說明如來藏為涅槃因的所以因為一切眾生本具如來藏依之修行成就即是菩提佛果菩提是有種種功德相應才能發揮利益眾生的廣大業用菩提功德業也即等於如來藏出纏所有的體相用三者如來藏是一切法的本依有情的成佛以及種種功德妙用都依如來藏而有的所以如來藏也即成為眾生成佛及涅槃的清淨因了在法界無差別論中以菩提心為清淨法本有情以菩提心為因才能達到成佛之果菩提心有二種一世俗菩提心如對大乘佛法有深切信解發起上求佛道下化眾生的四弘誓願這是屬於世俗的菩提心二勝義菩提心這不但是上求下化的信願而要能夠體悟到本性清淨的佛性如來藏性如大日經說菩提心為因而說菩提心為如實知自心即對自己的自性清淨心能如實覺知此亦近於禪宗所說的明心見性大藏中有發菩提心論說明在五蘊身心中體解性空而悟到本性清淨不生不滅的即是發菩提心勝義菩提心如實了知此心性本淨才能向佛果位邁進才是真實發菩提心所以如來藏又名菩提心佛性一分大乘經對發菩提心特別重視如華嚴經等由初地至十地的階位即是發菩提心的一步步的增進而獲得一分一分的清淨可以說凡是開示發菩提心的經論大都與如來藏說相近根據上面所說的幾種經論對四義中的第一如來藏作一綜合簡要的解說如佛性論究竟一乘寶性論無上依經均用十義來解說的一自性如來藏究竟是什麼如來藏的自體即是如來也就是諸法如義真如法如性為一切眾生本來所具足的這在真常學派覺得如來即如如如如智如如如如智故名法身華嚴經也說無有如外智能證於如亦無智外如為智所入基於這一意義不論說如來藏或佛性都是從眾生位上點出清淨的因性雖然眾生位上的五蘊十二處十八界以及貪瞋癡等是一切不清淨法但在這不清淨的眾生心性各各具足了清淨性這並不因眾生的雜染顛倒而顛倒所以勝鬘經說眾生自性清淨而有染污為客塵所染就是自性清淨雖為煩惱雜染所染污而眾生本具的如性仍然不失其自性清淨關於這一意義是難以理解的所以經說很多的比喻如摩尼寶珠落在污物之中為塵垢所蔽不能見其清淨的自體如虛空為雲層所蔽不清不明如水為泥土所混濁污穢不堪但它們的清淨本體依然是存在的如將摩尼寶珠的污垢洗掉現出它的本相清淨光明無比珍貴如風將雲層吹散現出蔚藍色的天空極目萬里多麼清淨如將水沈澱以後或以蒸氣蒸溜一過清淨無比可照萬物但這些清淨的自體並非現在才有而是本具的所以如來藏即如摩尼寶珠虛空水一樣看起來雖不清淨而在這不清淨的現象中它的清淨的本體本來如此在如來藏的自性中不特具足了清淨性而且還具足不思議佛法稱性功德如只就它的本性清淨來說也許還不足以代表如來藏的特質二因緣如來藏本性清淨的自體應以何種方法才能使它顯發出來這有四種因緣一信樂大乘此即通常所說之發菩提心對大乘佛法起深切的信願激發至誠的要求期能獲證大乘佛法上求佛道下化眾生如來藏性的顯發首先便有賴於發菩提心菩提心如種子一樣如人的出生不但要有父母精血的和合種子而且還要有心識所以發世俗菩提心還只是顯發如來藏性的外緣而真正的主因還是本淨心性如來藏二三昧這如胎藏一樣人的身體由父母的結合以後必須在胎藏中慢慢的成長三智慧這如母親經十月懷孕成熟而將孩子生下來四大悲這如乳母孩子出生以後要有乳汁來資生長養才能成人如來藏性以發菩提心為先具足了菩提心後在大乘佛法之中修習禪定由定水的滋潤使他成長啟發智慧由智慧體證而顯發如來藏性更要成就大悲功德化度眾生才能成佛如成人所以從如來藏而能成佛須具有這四種因緣三得果修習上面的四種因緣才能將如來藏顯現到達成佛的究竟果位如來藏的果德有四即四種波羅蜜多常波羅蜜多樂波羅蜜多我波羅蜜多淨波羅蜜多常是無生老病死的不變不異的樂是沒有一切憂愁苦厄我即大自在淨是沒有煩惱染污離垢清淨如大般涅槃經說涅槃具常樂我淨四德勝鬘經中也隱約說到如來藏是常樂我淨這三者是說明如來藏自性以什麼為因才能顯發而顯發後的情形又是怎樣四業能即功用如來藏究竟有什麼妙用依一般說如來藏有成佛的妙用在眾生位上如來藏又具足什麼業用即對吾人生活在世間能有一種引導向上真善美的功能如吾人遇到苦痛時有一種自發的厭苦的情緒同時也有一種向樂的情緒希望自己能夠得到安樂究竟為何會有此種厭離生死趣向涅槃的厭苦求樂的心理這即是如來藏的業能也即是如來藏在眾生位上的妙用雖然在眾生位如來藏還不能顯發出來但卻能發生一種無比的影響如每人都具有一種希求光明向上進取求自由求安樂的心理即因為有如來藏在五相應或名相攝這說明如來藏有種種功德與之相應的如不空如來藏有不離不脫不異不思議佛法與之相應這在經論中也有三種比喻說明如大海摩尼寶珠水大海喻如來藏本具的法身功德性是遍滿而無差別的如遼闊的海洋一樣在與如來藏相應的功德中是具有佛的智慧德性的這如摩尼寶珠能引發種種的珍寶來水比喻如來藏中有悲心的德性水的特性是能潤澤如枯旱了的樹木經水灌澤後而能發出嫩芽繁榮茂盛如來慈悲利益眾生之心與如來藏相應而產生種種不思議佛法所以無論是如來的智德或悲德都是遍滿一切法性的而這法性為無始以來本來具足的以上五義是就如來藏因位而說的六分別這說明如來藏性有清淨的究竟清淨的顛倒不清淨的三類七階位如來藏的三種分別亦即三種階位在眾生位上的顛倒不清淨即名眾生位大地菩薩對如來藏的功德性雖能如實了知但還未到達究竟清淨即名菩薩位到如來藏成為究竟最勝清淨法界時即名如來位這眾生菩薩如來三位即說明如來藏在眾生位名眾生在菩薩位名菩薩在如來位名如來所以經中說如來藏即是眾生或名眾生界八遍滿如來藏雖有這三位的不同而如來藏性確如虛空而遍滿一切的如來藏在眾生位是如此在菩薩位與如來位也是如此如進一步說在眾生位上的如來藏是遍滿菩薩位與如來位的在如來位上的如來藏也是遍滿一切菩薩的身心遍滿一切眾生的身心的因它遍凡遍聖遍滿一切所以無上依經喻之如虛空九無變異這說明如來藏在凡聖位上是無變異的如最初是凡夫而後成佛看起來這中間是有凡有聖的但就如來藏在凡聖位上都是如此說也確無凡聖變異的從凡夫經十地修行成佛這中間似有先後之次第然就如來藏說並無先後之變異如眾生是雜染的成佛是清淨的就如來藏說這染淨也無變異的所以如來藏是無凡聖先後染淨變異的如來藏在眾生位中名本性清淨在如來位上名離垢清淨這本性清淨與離垢清淨仍然是一樣的無二無別所以法界無差別論說法性遍無差這從如來藏法性無差別的特殊體驗中說明如來藏是超越一切時空的十一性如來藏是融貫一切的如來藏有時名法身勝義諦涅槃如來這些名字雖然各各差異其實都是同一如來藏性天台學者講經先要出體即將各種不同的名字而說成一樣如約果上說名菩提涅槃法身等約因上說名三昧般若等約境上說名真如法性勝義諦等各式各樣的名字其實即是同一如來藏的不同說明四義中第二菩提即佛果經論的解說共有八義即自性因緣得果業能相應分別行常這八義前六種與如來藏十義中之前六種名字完全相同此八義中除了因緣業能分別行常五義與如來藏有不同解說外其他三義自性得果相應與如來藏完全一致現將此不同解說之五義略述於下因緣不單是顯發如來藏的自體而是就菩提心如來藏的由因緣而漸顯清淨即經十地而修習十波羅蜜廣積種種功德為圓成菩提的因緣業能這是說如來有後得智與根本智以及自利利他的功德分別行常這三者是說明從如來藏性到成佛時如來現出法報化三身這也可說分別而這佛果的三身是常恆而不思議的四義中的第三功德即如來有十力四無所畏十八不共法三十二相八十種好等一切功德第四義業這是一切大乘所共通的可以無思普應隨機應現來說明如來的一切業用不與常人相同毋須先作準備說法是出乎自然而然無思普應的有如天鼓自鳴另一方面如來化度眾生是隨機應現的對高級的眾生而示現高級的身相說法對低級的眾生即現低級的身相說法所以佛身是常住遍在的於一切時說一切法眾生內心清淨而能見到如來眾生內心不清淨即見不到如來眾生見佛與否全依眾生內心的淨與不淨而定以上諸義是從成佛之因以至佛果功德業用都歸結於如來藏中如來藏為一切清淨因在這些經論中說得非常有條理現在說到佛為何要說如來藏性或佛性這在上面說如來藏之意趣中已經說過即是要在眾生位上點出如來藏的本淨因來佛說如來藏是為對治五種眾生的一怯弱心有些眾生感到自己的業力深厚無有成佛的希望與信心而生起怯弱的退墮心佛陀對之說如來藏佛性為人人本具個個圓成的只要自己能將如來藏佛性顯發當下即是佛這與禪宗的直下擔當自心即佛一樣消除眾生的怯弱退墮心二憍慢心這特別是學佛的人每有我是發菩提心的持戒的了解佛法的有修行的而對他人的一切生起輕視的憍慢心來這在學佛來說根本與佛法不相應佛對之說人人都有如來藏菩提心現在雖不及你將來一旦他的菩提心發起來也許會超過你的三虛誑妄心因為有類眾生專在一切虛妄的世間法上起執見窮追不捨佛對其說如來藏說明在這虛妄法中有一真實的佛性如棉花中藏有黃金而不自知現在只要將黃金取出即可成佛的四謗真實有些人是不信真實的這特別是對真理每起誤會認為口裡說的真理不能有具體的事相見到其實真理即是一切事物的本來真相是不能離開事物本身而見到的佛對其說如來藏說明真實不是從外面求的不是最初沒有而後求得的真實是人人都有本來具足的只要能靜心反觀就可得到特別是對學空的人說一切法如幻如化虛妄不實都是空的佛說這話本來是對的但一般人即以為什麼都沒有執著空見而不知佛說緣起無自性的空義是顯示法的本性空寂說真實空性即是真實說實相空性即是實相五執我這如楞伽經說有類眾生畏無我句的認為無我不能安立生死涅槃不能歸向佛法佛為他說如來藏為生死涅槃所依消除其內心的恐懼而歸信佛法佛說如來藏具有以上五種因緣的這五種因緣依現世一般眾生的心境來說對於引導趨入佛法如來藏是有其獨到妙用的八如來藏為生死依再說如來藏為生死依由於各家的解說不同彼此的差別很大問題也最難解說如說如來藏是空性法性生死是不離法性的則唯識與中觀也都是作如此解說的生死不離真如法性依之而說生死但僅說不離還未能說明這一問題的核心從大乘經看來如來藏佛性為一切眾生本有的清淨心在佛是如來在眾生是眾生都不需要說阿賴耶識的此如華嚴經涅槃經等均只說如來藏而不說阿賴耶的如說到如來藏為生死依則如來藏便與阿賴耶發生了關係因為說明生死世間的一切要從阿賴耶說起這在勝鬘經中雖還未明顯地表露出來但到了楞伽經密嚴經楞嚴經大乘起信論等經論中如來藏與阿賴耶識的連繫確已明顯地說出了如來如來藏如來藏我與阿賴耶識的教義本沒有必然關係後期大乘經以唯心思想為中心建立三界唯心萬法唯識的宗義所以如來藏心與阿賴耶識非常密切起來基於唯心的立場來說如來藏與阿賴耶是當然相結合了唯心思想有一基本見解即宇宙的一切現象都不外乎吾人心識的變現可以說一切的現象界即吾人內心所現起的相狀也即是心之一分所以唯識學者稱外在的一切為心之相分內在的心識為見分一切法不離自心隨心幻現阿賴耶識為一切心識中的微細心識相續不斷成為一切眾生的生死依如來藏是在眾生身中或蘊處界中或貪瞋癡中而眾生的身心一切即是阿賴耶種識所幻現所以如來藏也即在阿賴耶識的底裡一切心識的根本真實也即是如來藏了基於這一意義如來藏是內在的心性阿賴耶識是承內啟外的動力玄奘系的唯識學者說明生死輪迴是不說如來藏的只說種子生現行現行熏種子至於阿賴耶識性因它是不生不滅的無為法所以不去論說它與生死的關係說明生死世間的一切都在生滅相續的阿賴耶識中去解說這是唯心大乘的一派重視如來藏的學者對現象界的說明是推論到不生不滅本性清淨的心源如來藏是現象界的根源從這一意義來說阿賴耶識與如來藏心雖本是不甚相同的卻與阿賴耶識的變現一切有關而形成不即不離的關係但對阿賴耶識也還有不同的解說一地論師後來發展為華嚴宗依十地經論說阿賴耶識即是第一義心真心如來藏這說明了阿賴耶識與如來藏是一體的這在現行的經論中是有其根據的如楞嚴經中將阿賴耶識視為如來藏趙宋譯的大乘經經名記不得也有說阿賴耶淨識密嚴經中說佛說如來藏以為阿賴耶又說阿賴耶是佛性是我當然也是如來藏了所以楞嚴經密嚴經等與地論師一派的思想極為相近二依攝論師的唯識學者說阿賴耶識是著重在不清淨的雜染的虛妄的生滅的有漏種子的一切不清淨的法體均歸諸阿賴耶識中阿賴耶識成為過失聚為一切煩惱業苦三雜染種的聚合處所以阿賴耶識是以虛妄分別為自性的這在玄奘譯的聖典中對此也有充分的說明但梁譯攝大乘論又說阿賴耶識有解性是成佛而不失的覺性這顯然說阿賴耶有此染淨二分淨分的解性就是如來藏了三依大乘起信論說阿賴耶是真妄和合的是善與惡真與妄的統一體它的立場是真妄平等的至於真妄和合的統一體究竟是什麼也難以明了由於對阿賴耶識的看法不同所以對如來藏為生死依的論題也有不同的解說不過真心論者雖然說阿賴耶識是真心但古代的十地論師慧遠即說明偏真不生但妄不起而必須真妄和合一切法始能建立所以在說明時可以有所偏重而真正的說明生死依確有和合的意義如攝大乘論是著重阿賴耶雜染的又點出解性十地論師是著重真淨的從慧遠的解說中可知真心也不能不說和合大乘起信論不偏於真妄的統一更為明顯依楞伽經來看如來藏與阿賴耶的關係極為明白如經中說如來藏常住不變本性清淨無始以來虛偽惡習所熏名為藏識這一說明中也含有真妄和合的意味如來藏無始以來為虛妄種子熏染如來藏就名為阿賴耶識如來藏本性清淨本是約眾生位說的凡夫的本性清淨名如來藏阿賴耶識也約眾生位說雖然本性清淨但因無始以來虛妄雜染所熏現起一切虛妄顛倒的妄相這一妄染的種子心名為藏識這一點可舉一比喻摩尼寶珠本來是清淨的如用青黃赤白等色襯托四週由於色光的反映摩尼寶珠也即現起青黃赤白等相從這些現起的色相上看雖然是不清淨的但它本來清淨的體性依然是不變的約這一意義說如來藏在虛妄雜染法中是不失它本來清淨的體性的但為煩惱雜染所熏現起種種不清淨相名為阿賴耶識這就如摩尼寶珠的現起青黃等相了楞伽經中關於如來藏與阿賴耶識的解說還有說得更清楚的如去除如來藏中藏識名這說明去除阿賴耶識的雜染種子心只是如來藏去掉阿賴耶識的名字並非滅掉阿賴耶識自體如摩尼寶珠去掉青黃赤白等並非去除現青現黃的寶珠又經中說若無識藏名如來藏者則無生滅換句話說如來藏中現起的種種生滅虛妄顛倒相即由阿賴耶識的虛妄習氣種子而有如將阿賴耶識中的虛妄習氣滅掉就不稱為阿賴耶識那如來藏也即本性如是不再有生滅相了所以滅阿賴耶識的虛妄習氣只是滅阿賴耶識的名字實是滅去業相而不是滅去阿賴耶識的自體基於此一意義阿賴耶自體與如來藏還是一樣的所以說佛說如來藏以為阿賴耶有些經中說阿賴耶是真心攝大乘論世親釋也說如無虛妄雜染種子則阿賴耶識即不成生滅這可見阿賴耶識的生滅相續是因有虛妄雜染種子而不是阿賴耶自體如此楞伽經又說有漏習氣種子是剎那生滅的無漏習氣是非剎那生滅的所以如來藏的稱性功德是無漏習氣與如來藏是相應而統一的如來藏如為有漏習氣所熏則阿賴耶識便現起一切生滅的虛妄相如將這虛妄相滅去則阿賴耶識也不稱為阿賴耶識了此即是如來藏出纏而稱之為法身了說到如來藏可否為雜染法的緣起這是一個重要的大問題如來藏是不生滅的真實清淨的不與雜染法相應怎麼可為生死雜染的緣起如來藏是本性清淨的怎麼會因此而有虛妄雜染法生起這雜染法是否從如來藏中流出的依通常所說的迷真起妄從真起妄當然可說是從如來藏中流出的但從清淨法派生虛妄雜染法這在理論上發生了嚴重的問題如來藏不與雜染法相應依無上依經所說見上引文煩惱業苦這一切不能說以如來藏為緣起的這等於說真淨與妄染是二本的如來藏是不生不滅的清淨的在這清淨真實的法體中不能為緣而生起妄法關於這一問題最近海潮音中刊有復禮和尚的真妄偈一文曾有所說到如來藏中如真是真妄是妄則真妄成為二體如妄從真生則問題更多了我們批評耶和華的一元論不能成立如說魔鬼是從那裡來的是否為耶和華所創造若非耶和華所創造則魔鬼是另有來源的耶和華並不是絕對的如說魔鬼是上帝所創造則上帝便成為一切罪惡的淵源同樣的理由若說一切唯是真實相不生不滅則虛妄雜染法從何而來若說從如來藏實相中來則如來藏成為不清淨的因素了將來成佛後也可能有虛妄法生起若說虛妄法不從如來藏實相中來此則是另有其本源的如來藏當然不能說為緣起一切法如來藏本性清淨常住不變側重在真清淨的一面所以不能為生死法的緣起要說明生死法的緣起須以阿賴耶識為主體然阿賴耶識與如來藏法性有一貫攝處此即阿賴耶識的本質即是如來藏妄心歸根結底即是真淨心但不能說一切染法的生起以如來藏為緣大體上說大乘佛法都建立教與證二者的在教義的說明中說真如實相又說虛妄雜染相從這二者去說明一切楞嚴經說有二根本一真一妄也就是此義如果只說一方不論是妄染或真淨就不能說明一切有凡有聖有迷有悟以及世間一切差別依有真有妄去說明時不論這無明與真如妄心與真心究竟是一還是異總之說明生死還滅的理論要從這相對的二本去說明然而大乘佛法往往批評小乘為厭惡生死世間的消極者將一切雜染的煩惱生死苦果世間捨離始能出世間獲致常住清淨的安樂是真妄不相融的而大乘認為世間即是出世間煩惱即是菩提生死即是涅槃這才建立不離生死不離世間的法門大乘宣說一切法是本來不生滅的實為立足於行證的法門但從這一意義去看一切法時如楞嚴經說五蘊十二處十八界六大根識皆如來藏妙真如性天台說法性中具足一切善惡法這等於以如來藏而說明生死雜染的一切與依阿賴耶識而說明雜染有所不同中國佛教似乎要到天台的性具思想才能圓滿的說明這一問題但這與只說如來藏的常住不變清淨本然說一切虛妄雜染法不依如來藏緣起而要依阿賴耶雜染種子心就大大不同天台學者評如來藏學者為不免緣理斷九也就是不同意二種根本別有妄原單說如來藏本性清淨常住不變而一切虛妄雜染法從賴耶起不免有二元的傾向如依藏性而緣起生死妄染又近於一元總之這是如來藏的一個根本難以解答的問題中國的如來藏學者常以水即波波即水的公式來說明如來藏即生死即涅槃的意義其實水為何會成為波這並非水的本身即會起波而是因風的鼓動所以說明世界的一切似乎不能不從二方面去說明如楞嚴經中富樓那問佛一切根塵陰處界等皆如來藏清淨本然云何忽生山河大地如來對此問題舉示很好的比喻來解說但比喻到底是比喻經以為一切本明而說明時即有不明相對而起在這明與不明的相對存在中而演出一切的事相來這近於黑格爾的辯證法但不論如何總要說明迷悟的差別存在如演若達多頭本來沒有掉而自以為無頭奔走若狂待人向其解說清楚始知本來不是此事有頭無頭雖並無不同而到底有迷悟的存在據此而說迷悟並無不同但為什麼有迷悟有凡聖有眾生與佛的差別存在歸根結底還是要承認無始來的無明顛倒所以一切唯是清淨平等的就難以說明種種世間的差別現象在安立教相的說明上如只說一切唯真唯淨是無法安立的勝鬘經中說得好一切眾生自性清淨而有染污義難知無始以來為雜染所染本性清淨義難知這說明了本性清淨與雜染的理論不是一般世間理論所能通達的因為傾向於一元或二元多有可議論的餘地如勝鬘經說如來為勝鬘夫人為大地菩薩之所建立也許眾生要完全了解此一理論並不容易如賢首宗的隨緣不變不變隨緣等理論聽慣了說來似乎易懂其實是不易了解的總之印度傳來的一般經論就是宣說如來藏也還是採取相對的二本說從雜染熏習的一切種子識去說明一切我國的台賢等學派要歸之一元從法性本淨中去成立一切生起一切但到底應該怎樣才算究竟呢幻生記
