body:
  text: 如來藏之研究一序說如來藏教義在中國佛教界是最熟悉的一種教說特別是中國盛行的楞嚴經與大乘起信論可說完全是這一思想的代表經論中國佛教徒一說到如來藏便想到一切眾生有佛性可以成佛如來藏成了佛教的核心教義可以說離開如來藏即不能顯示佛法的深廣圓妙這一點中國佛教可說繼承了印度後期佛教的此一特色太虛大師說如來藏佛性為大乘不共小乘的特質佛法中通常所講到的業輪迴性空緣起都還是小乘中所共有的唯有如來藏這一教說為小乘所沒有的大乘特義後期的真常大乘特別著重發揮此義中國大乘各宗對如來藏特別重視如天臺賢首禪宗依天臺智者大師說如來藏即即空即假即中的實相是約俗諦的妙有說後來如來藏解說為空如來藏不空如來藏空不空如來藏三者以配合天臺學的三諦空如來藏即是真諦不空如來藏即是俗諦空不空如來藏即是中諦天臺雖為弘揚龍樹的中觀學但已融攝了發揚了如來藏的教說禪宗在弘揚如來藏的各宗中可說它將如來藏思想發揮到最高的頂點也更與如來藏相契應後代的禪師們雖然竭力倡導祖師禪但在初期的禪宗卻是宗本如來禪的就初期禪宗傳授心印的楞伽經說魏譯楞伽經即將宋譯的如來禪譯作如來藏禪以體悟如來藏為修證的法門如禪宗四祖說恒沙功德總在心源也無非是如來藏說可說在禪宗已充分地表達出來了賢首宗的賢首國師對如來藏教義也曾努力加以發揮他給楞伽經大乘起信論作過玄義與注疏賢首宗判五教也可以分作三類小教及始教一分有教是法相宗始教一分空教是破相宗終頓圓三教是法性宗都是以如來藏心具德為根本的終教如大乘起信論的如來藏緣起說賢首宗的頓教即是禪宗從後代圓教頓禪一致的思想上不難看出後三教同以如來藏說為本的自民國以來講唯識的南歐北韓南方的歐陽竟無北方的韓清淨均不以如來藏說為中心唯識學與臺賢禪宗的如來藏說多少不調和不相契應而中觀的緣起性空亦與專重如來藏思想的有距離所以在傳統的中國佛教指天臺賢首向以如來藏為中心的這一體系中對唯識與中觀不無誤會其實在中觀與唯識中也都說到如來藏不過彼此所持的立場與解說不同為中國一般學者所未能通達罷了現在修學佛法不能一味以中國的為是因為佛法是從印度來的佛法的根本是在印度應該從印度佛教去作更深切的了解但中國佛教對中國文化思想有深切關係的中國佛教的內容我們也非了解不成的如來藏說是印度傳來的應該了解如來藏在印度本來的意義這才更能了解中國以如來藏為中心的佛法二說如來藏之意趣對佛法的理解是與一般世學多少不同的經裡的法義不一定可依照字面上去理解依佛法說佛菩薩的說法目的在化度一切眾生所以佛菩薩的說法只要達到這一目標有時可能將沒有的說成有如法華經說房子外面有許多華麗珍貴的牛車羊車鹿車可是等到走出房子一看外面只有牛車並沒有羊車與鹿車這是佛經中將沒有的而說成有的例證無的可以說為有此的可以說為彼所以對佛法不能望文生義聽說什麼就執有一真實的什麼而應了解佛法說它的根本意趣何在這樣聽到如來藏這名詞不要先執著有一真實的如來藏而應探討為什麼說如來藏如來藏究竟是什麼意義由此始能了解經說如來藏的真義佛法有二大問題一是生死輪迴問題二是涅槃解脫成佛問題一切佛法可說都是在這二大問題上作反復說明如佛法而不講這二大問題那就是變了質的佛法生死輪迴與涅槃解脫並非佛教特創的教義印度其他一般宗教中十之八九也都講到這個問題但佛教與印度一般宗教所講的有所不同那便是三法印三法印的諸行無常諸法無我涅槃寂靜是用來印定佛法的準繩凡與這三法印相契合的才是佛法所以生死輪迴與涅槃解脫均須與三法印相合這樣的生死輪迴才是佛法的生死輪迴涅槃還滅才是佛法的涅槃還滅如果與這三法印不相契應則所謂生死輪迴與涅槃還滅都是外道的非佛法的由三法印而開顯出來的一切法空性即大乘所說的一實相印因為一切法的自性空所以一切法是無常無我寂靜的三法印即就一切法空的理性作順俗的多方面的顯示說明依無常無我的法則說明生死輪迴依此生死而說到涅槃還滅的寂滅這是佛教不共外道的特質不過這無常的與無我的生死輪迴也就是本性空的生死輪迴是甚深的不容易使一般人理解的所以印度一般宗教甚至一分佛教學者對此曾加以詰難如俱舍論破我品說若說無我則誰去受生死輪迴誰去證涅槃還滅依照一般人的想法人生的升天界墮地獄此死彼生必須有一主體的自我如現在有煩惱將來煩惱斷了生死也了了這斷卻煩惱與了脫生死的當體是解脫自在的我如說無我則不但生死輪迴不能建立涅槃解脫也不能成立無常無我的生死觀涅槃論確是太深了為一般人所不易了解所以印度一般宗教都認為要有一真實的我才能成立一切佛法中也有一分的有我說依他們說佛法說無我是對的不過這是否定常人所計執的邪我而另有一勝妙我存在這如犢子部及其所分出的法上賢胄正量密林山部四派建立不可說我據說我是在五蘊之內抑在五蘊之外我是常住抑屬無常都是不可說的犢子部他們建立不可說我認為佛法的生死輪迴與涅槃還滅等一切問題才能依之而建立起來這是佛法中最初說我的一派佛法一向是說無我的所以這種不可說我的論調出現之後在佛教界初聽起來有些驚怪因此被人評為附佛法的外道小乘中除犢子系的不可說我之外經量部也講勝義我大乘中也有說我的如禪宗的心燈錄說禪宗體悟的即是我即通常所說的主人翁它引天上天下唯我獨尊及赤肉團上有一無位真人等來說明不過這種我是不可思議的不像一般人所計執的粗顯的我又佛法所講的無常一切法剎那生滅在一般宗教及一分佛教學者間也認為不能建立生死輪迴與涅槃解脫比如由業而感生死之果假如生死是無常的剎那生滅的則業滅後誰感生死無常的也即是無我的所以不能成立生死輪迴與涅槃還滅如佛弟子以為無我不能成立生死與涅槃無常也不能成立生死與涅槃這種見地與世俗的見解極為相似因為一般眾生的根性如此對無常無我的甚深義理不能信受佛陀為了隨順眾生的心境使其接受佛法次第引導令得佛法的功德因此方便說如來藏一般聽到如來藏即認為是佛性只記得成佛涅槃的一面而忽視生死輪迴的一面其實如來藏不僅為成立成佛涅槃也是成立生死輪迴的在了解如來藏之前必須先了解佛陀說如來藏的這一根本意趣如來藏為眾生不能了解一切法空的甚深真義佛陀所開示的另一方便教說從外型上看雖然近似外道所說的是常是我但其真正內容卻與外道迥異楞伽經說開引計我諸外道故說如來藏為斷愚夫畏無我句故說如來藏陰界入生滅彼無有我誰生誰滅如來之藏是善不善因依楞伽經佛說如來藏的意趣是對主張有我而恐懼無我的外道說的也是對不能在無常生滅中成立輪迴的眾生說的現在作一簡單結論一般人的看法涅槃解脫是從生死輪迴而得解脫的這比如人從牢獄裡放出獲得自由一樣因為有這麼一個人才說有牢獄與自由如無此人則根本無牢獄與自由可說所以如把生死與涅槃的二問題聯繫起來而貫攝這二個問題的似乎非是常是我不可佛說如來藏的目的也即適應這一類眾生解決這一問題勝鬘經說生死者依如來藏有如來藏故說生死這是說明因有如來藏才能說有生死的若沒有如來藏則生死無可安立反過來說如來藏在眾生煩惱藏中如離開煩惱藏即成佛法身如來藏一面為生死輪迴所依一面又為涅槃還滅所依所以沒有如來藏則不能說明眾生從生死到成佛的經過佛說如來藏的意趣主要使不信無常無我的人來信受佛法達到佛法化度眾生的目的使之踏上正路進入佛法的甚深處三如來藏說之安立如來藏一名不見於小乘典籍中而為大乘所特有在未講如來藏之前先對如來作一解說如來為大小乘共有語含攝極複雜的意義如來為梵文多陀阿伽陀的譯語可以譯作如來也可譯為如去依照一般的解說如為如如不動無變異顯示其真常不變平等無差別的特性此種特性即佛所體悟的真如法性在佛法中通常將所證悟的諸法實相稱之為如或者名之為真如但在印度一般宗教中如卻有另一解說如即是我大智度論說如即神我阿特曼之異名印度一般宗教所說生死輪迴的主體以及從生死輪迴而證入涅槃解脫的當體即是我我也就是如所以我是常住不變如是如是的依印度一般宗教說要有一真常不變的我體才能成立生死與涅槃佛法是講無我的由生死而證入涅槃的不是我而稱為如或法性佛法與印度宗教的根本差別點爭論的中心點可說就在這裡印度宗教以為見真我才得解脫而佛法卻以見如或法性得解脫經中說佛弟子證悟時但見於法不見於我這說明佛弟子所證悟的是如如法性而不是如如的神我這如法性即是諸法實相也就是宇宙的絕對真理這絕待法性是常恆的真實的清淨的但並不附有精神與意志的特性而印度宗教所說的我卻是含有知覺當然是真覺性意志性的因此在不說如來藏但說真如或法性的經論雖說佛弟子證悟如或法性時如智不二心境一如而現覺的如如法性是一切法的實性超越一切戲論並不能指為是心是智的也就無知覺性與意志性可說近代的耶穌教徒每以宇宙我的耶和華上帝常住不變究竟真實無始無終不可思議清淨聖潔自在無處而不在等特性牽扯為即是佛法的真如實則他與印度宗教所說的梵天自在天一樣他們一方面把它看作普遍常住的宇宙本體一方面擬人的性格給與大智慧慈悲無所不能的意志自由所以也就是創造主宰一切要怎樣就能怎樣的神我佛法見如如法性不見於我將我與法性二者分開佛法的法性體證法性的聖者才不會落入創造神型的窠臼顯出佛法的真義來即活動如來即依如而成的一切大慈大悲等功德業用依金剛經說如來者即諸法如義這說明如來即是真如真如即是如來大般若經中也作如此說在一般佛弟子的心目中如來是有超人的佛格大智大悲偉大不可思議的聖者為何說如來即是諸法如義這是說如來是乘如實道體如而來說如來是真如法性的體現者真如法性是永恆遍在的並沒有離開吾人但為吾人所不知圓滿的體現證悟出來所以名為如來就這一意義看如來以如為性如即是法界法性所以如來也與法界法性有不二義另一方面如來是出現世間以及成道轉法輪的如來未涅槃前日常顯示於弟子面前一切不成問題如來涅槃以後如來到底是怎麼樣的存在這是一個重大的問題如說如來涅槃以後還是生前一樣的存在這便成了常見若說如來涅槃後什麼也沒有這就成了斷見這本是十四不可記中不作答覆的問題但為了眾生的信受也就不能不說明這一問題在小乘學派中約有三派解說不同一依有部與經部說如來涅槃後是灰身泯智的涅槃是解脫了生死輪迴的苦痛而不再受生的不再起此身心作用如將樹根截斷從此再也不會發芽生葉如來證入涅槃滅去有漏的身相當然沒有三十二相八十種好的存在了依他們說智慧是身心和合而發生的身心既然沒有了智慧當然也是泯滅不起了的但這不是否定了如來證入涅槃執著什麼都沒有而是說涅槃無為是不可思議不可分別的不能說它有這樣那樣的在聖典中有很多經論對如來的涅槃作這一意義的解說不過這一解說是不容易為一般世俗知見所信受的二依上座部說如來涅槃後是灰身而不泯智的如來涅槃後的身相雖然沒有了但如來的功德智慧是經多劫而修成的不能說與身相也同樣的泯沒了如來的智慧德證入涅槃是存在的這說明了如來涅槃後沒有身相的物質作用而如來的無漏心力依然是存在的這雖然存在但對於有漏三界似不再起作用也不再來人間度生只是自己圓成了究竟的功德三依大眾部說如來的壽命身相神通威力都是無量無邊遍一切處的釋尊的雙樹入涅槃只是捨棄了人間的應化身如來的真身是永恆常在莊嚴圓滿的這種說法與大乘經的思想非常一致大乘經特別是開示如來真常不變的經典針對如來涅槃無色的見解而一再說到有色如來涅槃的相好莊嚴屬於清淨的微細的物質不同於一般的有漏色相如央掘魔羅經說解脫色是佛非色是二乘這說明大乘涅槃不同於小乘涅槃的灰身小乘是以涅槃為無色無智的大般涅槃經也說捨無常色獲得常色如來雖然捨棄了五蘊假合的無常之身而獲得了常住不變的清淨色身這在真常妙有的大乘經中處處都如此說現在進而要論究的如來的身相何以會遍一切處佛壽何以是無量的這便要結歸到如與如來的意義上來如來所證悟的法性即是如如如不動無二無別在契證如如中可說都不離真如法性之中而為真如法性所統一這樣菩提從過去到未來也是永恆不變的是超越三世時空的超越時間性也就是豎窮三世超越空間性也就是橫遍十方如來是如如的證悟者為真如法性的體現者與法性為平等無差別的沒有大小多少先後長短的差異因此如來的神通威力壽命色相智慧遍一切時遍一切處無量無邊無窮無盡龍樹曾說如布施是有為的有窮盡的無論布施多大布施的福德受完了一切功德也就盡了因為有為是有生滅變化的終歸滅盡的如布施能與般若相應則布施的功德也就成為無盡般若是證悟真如法性的與法性相應無量無邊與般若實相相應的布施功德也就無量無盡這如我們收藏東西時間久了就會壞如將東西放在不壞的金剛器具裡即使經歷多久也就不會朽壞了真如法性是遍一切處的證悟真如法性後的如來也遍一切處從證說真是無時間性的也是無空間性的因此如來常住不變遍滿一切約這一意義說所以一否定小乘的灰身泯智以及無身而有智的解說而肯定如來是有色有智的二佛身是無窮無盡常住不變這就要說到如來藏眾生體證佛果如來是常住遍一切處但未成佛前這常住遍滿的如來是否也如此的常遍如到成佛才能如此則不能說如來是常住不變的遍滿一切的一切時都是如此未成佛也如此才能說是常住不變那麼一切眾生都有如來了依佛法說體現而成如來的如如法性是在聖不增在凡不減常住不變但眾生何以不是如來經中說這因為無量煩惱所覆藏為蘊處界生死所纏裹所以如來常在眾生中而沒有顯發出來因此名為如來藏雖然有顯現與潛藏但眾生位上與佛果位上的如來無二無別常住不變眾生位上的如來是潛在著而如來所具有的無量智慧功德無量相好莊嚴與佛果如來還是平等的所以華嚴經說奇哉奇哉一切眾生皆具如來智慧德相又楞伽經說如來藏自性清淨轉三十二相入於一切眾生身中央掘魔羅經說如來心於眾生身中具足無量相好清淨莊嚴佛果的一切功德智慧為眾生的煩惱雜染所覆藏所以如來藏是約眾生位說的成佛只是將這煩惱拂去而不是新的產生如來藏經等舉種種譬喻來說明如來藏最常說的如摩尼寶珠落在污物之中為知者取出洗淨污垢光潔無比神用無方但這並不是因取出而有寶珠的而是本具的即在摩尼寶珠為污垢覆藏之時其光潔無比與神用無方也還是這樣的從這點來理解如來藏佛與眾生間可以達到平等無上依經說明如來藏而建立眾生界菩薩界如來界三名界即是藏義眾生本具的如來德性在眾生位名眾生界如經修行到菩薩位即名菩薩界由菩薩將它圓滿顯發出來即名如來界三界是完全平等的華嚴經也說心佛眾生三無差別這不特說明了眾生與佛平等而且說明眾生心與佛心也是平等的眾生心即是佛心眾生也即是佛中國佛教流行的眾生即佛佛即眾生即是根源於此依據這一教說才能理解一切眾生本來是佛的意義再說到如來藏我與如來藏心如來藏是從眾生因位點出本具如來就這一意義說如來藏與我義有相契合處在真常經典中以常住不變清涼來形容如來果德或眾生本具的真如大般涅槃經特結合為常樂我淨四種佛德我的意義為自在自己作得主這與佛法所講由修持而得自由自在不為煩惱所污不為境界所轉同一意趣這是大乘所共認的但印度宗教將阿特曼我解說為生命的本體有自在義佛法為了否定這生命實體的我才說無我如來藏為眾生生死流轉的根本離去煩惱如來藏即是如來法身這與印度宗教所說生死涅槃主體的我相近印度宗教所說的我與如來藏為生死涅槃所依極為相似頗感困惑不易區別如來藏是就眾生位說因眾生的顛倒未能顯發如來藏本具的清淨無漏功德智慧所以成為眾生切實說來如來才是真眾生眾生也即是我的異名非蘊處界的聚合體而在生死流轉中永恆不變的才是眾生這在大乘經中也有說得非常清楚的如不增不減經說即此法身過於恒沙無邊煩惱所纏從無始世來隨順世間波浪漂流往來生死名為眾生法身即眾生因此眾生非他即是如來如來自無始世來即流轉生死始名眾生央掘魔羅經也說一切眾生皆有如來藏我眾生即如來藏佛在迷即成眾生眾生在悟即是如來因此如來藏與我義一致如來藏為煩惱所蓋覆時近於小我如離去煩惱即成為大我大我與小我的本體是無差別的也就因為這樣佛說如來藏才能攝引畏無我句的計我外道歸信佛法如來藏不但與我有密切的關係而且與眾生心也有密切聯繫如來藏是在眾生中但它究竟在眾生身中還是心中雖可說遍在或說無在無不在但又每說它在眾生心中此如如來藏在蘊界處中即陰界六入中或說在六處中有的就索性說在第六意處中依古來一般的解說我們生命的開發是以肉團心為始的最初結成這肉團心生命體的是父母精血的凝聚而心識即託於其中因此佛法說修行觀佛觀心中有佛即觀心如大紅蓮花雖然心是精神體而不是肉團心但緣慮心集起心等精神現象仍有不離此肉團心的意義所以經說無身寐於窟因為如來藏在眾生中身心中心中與眾生心的心識活動有著不可分離的關係如來藏的本性是清淨的眾生心還在虛妄顛倒的不清淨中為了區別二者的不同有人將如來藏叫做真心或稱如來藏心或自性清淨心這也就是眾生顛倒妄想心中的本淨覺性由如來藏與阿賴耶識不相離楞伽經與密嚴經便說如來藏藏識雖然如來藏與阿賴耶識有不同的意義但也有不異性用以安立眾生的生死與涅槃以上是從如來的德性而說如來藏因為有如來藏所以即有如來藏我與如來藏心基於這一意義成為一分大乘經的核心思想四如來藏之抉擇關於如來藏的意義依據楞伽經如來是有所抉擇的在未說楞伽經之前如來藏容易被誤解為與印度宗教的我一樣如楞伽經中大慧問佛如來藏自性清淨轉三十二相入於一切眾生身中如來之藏常住不變云何世尊同外道說我言有如來藏耶世尊外道亦說有常作者離於求那周遍不滅世尊彼說有我從大慧的這段問語中可以看出如來藏與我一般人是看作一樣的如來藏既然與我一樣而為眾生所具有則印度宗教所說的我也應該是正確的了關於這一問題如來的解答說我說如來藏不同外道所說之我大慧有時說空無相無願如實際法性法身涅槃離自性不生不滅說如來藏已如來應供等正覺為斷愚夫畏無我句故說離妄想無所有境界如來藏門從這一解說中可知如來藏的表面雖然酷似印度宗教的我而實質上是與我迥異的因為如來藏即是一切法空性法無我性的異名釋尊為了化度一般執常執我的眾生使其信受佛法進而趣向一切法空的真義因此方便說如來藏如來對如來藏的抉擇楞伽經說得非常明確從前有些經中將如來藏解說為我為眾生是方便說經楞伽經的抉擇明確的指出一切法無我性為如來藏因此如來藏的真意就顯了而不混濫外道的邪我了現依楞伽經為準以一切法空性為如來藏說則如來藏始能與性空無我的一切教說相契合如來藏與法性空性法無我性可說是一樣的不過法性空性無我性遍一切法說而如來藏專約眾生的身心上說這如虛空在方的器物裡成方的虛空在圓的器物裡即成圓的虛空雖然形成各種不同的狀態但它的體性仍然與太虛空是同一的現在根據楞伽經對佛說如來藏的先後不同作一結論一釋尊未說楞伽經之前如來藏易被人誤解為印度宗教的我這是不能了解佛說如來藏的意趣二經楞伽經對如來藏加以抉擇之後如來藏與佛法的無我空性一致即與一切空無我的大乘契經相融和五流轉還滅之因依上面說到如來藏為涅槃所依有如來藏眾生方能得涅槃解脫同時如來藏也為生死所依因此眾生也才有生死輪迴為說明如來藏確為生死涅槃的所依體所以先泛說此流轉還滅的因依佛教對於生死涅槃的二大問題大家是絕對確認的而現在問題在眾生怎樣會有生死又怎樣會得涅槃生死與涅槃這總得有個原因的這一原因說來非常簡單也無人反對不管是大乘或小乘都是以無明為生死流轉之因以般若為涅槃還滅之因的說到生死輪迴分為惑業苦的三類來說明眾生由惑造業由業感苦果由果而再起惑如是相續不息而成生死流轉這惑業苦三事如詳細的分析起來即是十二因緣而成為眾生生死根本的主要即是無明煩惱的根本一切法皆從緣起而有眾生生死根本的無明也可說有其原因的但從有情招感生死苦果的立場說無明實為主要因素無明的生起即是由眾生的情意顛倒錯亂對於宇宙真理分辨不清而在一切如幻的現象上起虛妄分別執有執常迷於事理所以無明的特性即是不明了說到涅槃解脫依一般的解說是由般若慧而成就的真正的說來涅槃並非只依於般若慧的如皈依三寶持戒修定由戒定的熏修發生智慧由慧斷煩惱而證涅槃有著次第的相依關係但在斷煩惱證涅槃的要因來說不能不說是慧的功用般若義譯為明與無明相反所以經中說無明為一切不善法根本明為一切善法根本這樣可以了解無明為生死流轉的因依般若為涅槃還滅的因依了然據一般大乘經論的闡釋生死流轉與涅槃還滅又有二個基因的一從無明而說到心識二從般若而說到空性在佛法中無明只是一種心所法附屬於心識的心理作用它並不能單獨發生作用無明的發生作用必先有心識與之相依因此可以說有心識才有無明無明是以心識為所依的心識與無明相應無明才能成為生死流轉之因依一分學者說有情生死流轉的原因即是心識活動而這即是所謂的有取之識是有煩惱有雜染的識我們一生下來即有精神活動識因為有此識所以無明煩惱心所法也即跟著而來八識規矩頌說去後來先作主公也即是指的此識如將無明煩惱滅掉則雜染的有取之識不能成立所以識不是生死之因而只是生死的所依而為生死之因的還是無明無明既然以心識為所依則能得涅槃成佛的般若當然也是有所依的般若的所依即是空性般若是證悟諸法如性的智慧有般若智才能證悟真如法性有真如法性才能發生般若智因此般若智與真如法性有關如無真如法性則般若不能發生沒有般若便不能得涅槃成佛然依唯識家說心識為清淨雜染法的所依如心識與無明相應即成雜染的生死流轉如心識與般若相應即成清淨的涅槃還滅所以說識是染淨依再說到空性眾生的生死流轉是因不能了解一切法的本性空寂而在一切法的本性空寂上起分別執著為無明所迷聖者的涅槃解脫因為了知一切法的如幻如化不在一切法的本性空寂上起虛妄分別執常執我而由般若現證空性所以空性為迷悟依由此看來心識不但與生死也與涅槃有間接關係而空性不但與涅槃與生死也有間接關係了在一般人所承認的無明與般若中抉擇出心識與空性的二所依性這在大乘佛教中可說是共通的不過大乘中有一部分經論的見解主張雜染法有雜染法的因清淨法有清淨法的因比如說雜染法從那裡來依通常說由無明而來但無明並非一切雜染法的親因而只是它的助因同樣地般若也不是一切清淨法的親因而只是它的助因依唯識家說無漏清淨法的生起是從無漏種子來的無漏種子具足一切諸法所以一切法是各有其因的不能說都由般若而來般若的無漏種子只能生清淨的般若並不能生其他的無漏清淨法雜染法的生起是由有漏的雜染種子所引生所以一切雜染法也各有其種子的如貪瞋癡等不善法各各有其種子並非都由無明而有比如農夫種穀必要有生長穀子的種親因如無親因的穀種儘管客觀條件如何具備也無穀子可收穫這樣一切的不清淨法一定有其不清淨的種子而這便是惑業苦三雜染法的親因緣無明只是助它發生作用而已眾生的得涅槃成佛也當然有其無漏清淨種子一切無漏種子便是一切無漏功德的親因從佛法的這一意義去說明非常容易明了所以要安立生死涅槃必須先說明雜染因與清淨因雜染法一切眾生是現成的推究起來是從無始以來就有的但般若等清淨法我們從未證悟過真如從來不曾有過無漏現行那般若等淨法到底從何而有說到這個問題便要談到如來藏的清淨因了如上面所說空性與心識對生死涅槃都可說有著關係的這是諸宗共許的但對清淨與雜染因就各有不同的解說依一般說雜染因是依心識清淨因是依空性的但在唯識家說雜染因與清淨因都是依心識的而真常學者說雜染因與清淨因都是依空性如來藏的從這些不同的主張中彼此自然有不同的見解因此對生死涅槃問題在解說的理論上也有根本而顯著的不同這便形成了分宗分派的起源其實如廚師煮菜將菜配成各式各樣但其真正材料不過只有幾樣而已生死涅槃的依因也是如此由於學者的所見不同而形成各種不同的解說其實問題還是這些六如來藏說之三系不同解說現依大乘三系對生死涅槃的因依如來藏作一分別解說真常學者對於如來藏的看法是肯定如來藏為真實圓滿的究竟教說如來藏是空性與心識的融成一片所以從空性方面說名為心性從心的方面說說為真心自性清淨心等我們的心識雖然有虛妄顛倒分別有煩惱雜染但這心識與真如並非二物是無二無別的真常者的這種解說是以證悟為根據的從證悟真如時的境界說心與真如無二無別並不能去分別它的能證與所證這在真常學者看來認為心體即是真如但因眾生心為煩惱所覆從未證悟真如所以對此本具的覺性真如沒有發見罷了而這眾生本具的覺性並非過去沒有而現在才有的是超越過現未三世時空永恆而常在的如華嚴經說無有如外智能證於如亦無智外如為智所入這說明真如與智的合一離開真如另無智可求離開智也另無真如可得在吾人證悟真如或未證悟時真如仍然如此常住不變所以真常學者將真如與如如智不二說為一切法的根本而與唯識學者所說完全不同至於說到什麼是如來藏的清淨因即是空性心性上所具足的無漏的清淨功德亦即大乘起信論所說的稱性功德由心法性的統一上具足一切無漏聖功德性所謂清淨因亦即真如功德性的異名因此真如又名法界法界為三乘聖法之因一切清淨聖功德因即聖果位上的無漏功德無一不在真如法性中本來具足其次說到如來藏為雜染依雜染因即有漏煩惱習氣吾人無始以來的煩惱習氣是不離真如的但這煩惱習氣並非為如來藏所有的而是寄附在如來藏的真常經中將它稱為客塵煩惱所以真常學者講一如來藏而一切生死涅槃問題都得安立眾生無始以來的一切清淨功德與煩惱雜染都依如來藏而存在一切問題可說都由如來藏而獲致解決在真常系的勝鬘經與大乘起信論中因此將如來藏說為空如來藏與不空如來藏天臺演變成三種不空如來藏是因真如法體上具足一切無量清淨功德所以名不空如來藏空如來藏是說明真如法性不為雜染煩惱所污故名空如來藏勝鬘經說如來藏是依是持是建立世尊不離不斷不脫不異不思議佛法世尊斷脫異外有為法依持建立