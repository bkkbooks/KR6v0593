body:
  text: 阿陀那與末那菩提流支與真諦並以阿陀那為第七識玄奘師資始辭而闢之謂第七但可名末那阿陀那為第八本識異名是執持非執著也以余觀之此實學說之歧異不關義理之臧否若論無著學則真諦之說為當何者流支譯深密解脫經真諦譯攝大乘論引解節經謂阿陀那為本識異名初與玄奘譯之解深密經無所異故真諦流支非不知阿陀那之為本識異名但謂阿陀那亦即末那異名耳阿陀那得為末那之異名請以解深密經為證解深密經心意識相品以一切種子心識為本識阿陀那阿賴耶心為其異名以阿陀那識為依止為建立故六識身轉若於阿陀那等不得不見則於心意識祕密善巧題標心意識而文中但明本識及六識何耶圓測謂準前本識後六識可知故略不說結城令聞著關於心意識之唯識思想史謂解深密經無末那此皆囿於奘基之學未能深見經意遁倫文備稍得之而意亦未盡須知末那譯曰意是思量義常談之恆審思量乃玄奘增飾非梵文本義亦無著世親學所不談末那之作用在為六識生起之所依上尋阿含經則意處意界通為六識別為意識之所依一切有系之婆沙師譬喻師等不知有細意乃立識無間滅為意上座分別說系則於六識外別立同時意界龍樹立現在意真諦有此義大衆系之根本識及意界是常等雖立名不同而辨其為六識生起所依之意界則一若見此義則解深密經之阿陀那識為依止確指末那意無猶豫餘地解深密經本識一而轉識六本末合論唯七心以阿陀那識執持身根故能起六識故阿陀那復當末那之名後之學者偏據奘傳之八識差別論偏據恆審思量之末那乃於心意識相品中不復能得末那或者不忍解深密經無末那乃欲離此品而別求宗派意識不除經論之真義難明此豈偏激之談哉或謂此乃依止意非染污之恆審思量意約染意為言則解深密經無之此亦不然離本識及轉識古義但指六識而立別體可通染淨之末那自攝決擇分顯揚聖教論始此應後於大乘莊嚴經論攝大乘論等它論之立末那即依本識之某種作用而別立非別體也且如攝大乘論立二種意末那蓋綜合無間滅意與染污意二者雖云六識由第一依生由第二雜染似染意非依然染污意以五為同法喻亦即第六意識之別所依也末那之所以為末那不在其為恆審思量與否而在為六識生起之心理源泉無著攝大乘論之本意蓋如此攝大乘論之明本識側重於能為諸法之自性緣起因相側重於業感之生命依持果相其細意現行之為轉識六依止者亦即從賴耶種子所生起者決不如攝決擇分等視為第八識現行此轉識之現行依止識於十一識中為身者識及受者識意界為體世親以染污意及無間滅意釋之安立賴耶為義識段意識及依止為見識十種分別之顯識分別即眼等識及所依識此所依識即二種末那是賴耶詳緣起義六識及所依識末那詳緣所生法辨見相分攝大乘論之宗要若此與大乘莊嚴經論中邊分別論世親釋異同取此以對讀解深密經則染污意之為識依止者非阿陀那識而何此一般學者之所以唯除別有阿賴耶識而無別體末那也末那即依本識之取性現行而立實無別體以阿陀那為第七末那識蓋唯識古義非真諦學謬然此猶非奘傳唯識學者之所能解彼謂阿陀那是執持非執著如何可為染意別名不知此特奘基所說無當古義且置真諦訓阿陀那為無解於不論阿陀那之本義為執取有攝取而得之之意何得謂毫無攝取執著之義然或者仍將有疑阿陀那本識為無覆無記性染末那是有覆無記那得是一體義別獨不思安慧許本識是無覆無記又許第八有法執在唯識古義異熟性與細執非截然隔別顯與後期唯識學不同自攝決擇分出等視本識與轉識而後賴耶現行與七識俱轉而後賴耶種現別別為七識所依而後阿陀那與染意被視為別物奘傳之學蓋繼此緒餘而發揚者宜其與攝大乘論大乘莊嚴經論之學格格不入也真諦之學多存古義然亦間採攝決擇分決定藏論顯揚聖教論三無性論及無性堅慧之說駁雜不純思有以融貫之而力不足致多自相矛盾後之學者或宗玄奘而彈真諦或宗真諦以難奘學迄亦莫得定論吾謂欲通無著師資之學自大乘莊嚴經論攝大乘論與瑜伽師地論攝決擇分分宗始自撤除攝論宗與唯識宗之宗派成見始
