方系正統的婆羅門教不是一切抹煞了嗎不相反的婆羅門教的積極成分即有關人生道德的釋尊盡量的融攝他不過使他從神祕的宗教與不平等的階級中解放出來修多羅時代的西方如家庭經法經摩訶婆羅多等都重視國民的道德想使人類有一種堅定而合理的生活他們稱之為法即達磨法是人生正常的生活社會習慣善良風俗凡合於正確的軌律都是法後來前彌曼薩派即宣稱他祭祀的宗教為法釋尊的宗教也稱為法內容不止於此正法中心的佛教雖不是祭祀的然他的重視人生道德破除神權與人為的階級再度確定人生行為的正軌引導人類進入合理的生活中實與西方系有共同的傾向如五戒佛教特別禁酒十善等是世間常道釋尊繼承這道德的傳統使他深化不能說與西方系無關釋尊的說教不但繼承阿利安人的寶貴傳統還巧妙的淨化他婆羅門教的祭祀要用三火佛也教他們供養三火然佛說的三火是供養父母名根本火供養妻兒眷屬名居家火供養沙門婆羅門名福田火雜阿含經卷四九三經他們禮拜六方佛也教他們拜六方然佛所說的六方是親子師生夫婦朋友主從宗教師與信徒間的合理的義務這些肅清神教的祭祀儀式把人類合理的生活確立於社會的正常關係上實為根本佛教的特色奧義書的思潮釋尊所受的影響最深理性的思辨與直覺悟證為佛教解脫論的重心佛教解脫道的重智傾向即由於此然而深刻的了解他所以能徹底的批判他釋尊把理性的思辨與直覺證悟出發於現實經驗的分析上奧義書以為自我是真常的妙樂的釋尊卻處處在說無常故苦苦故無我古人說無量劫來生死本癡人喚作本來人很可以作為釋尊根本佛教的注腳他們以為是常住的妙樂的唯心的是自我的本體釋尊看來簡直是幻想反之自我的錯覺正是生死的根本因為從現實的經驗出發人不過是五蘊六處六界的和合相續一切在無常變動的過程中那裡有真常妙樂的自我完整的佛教體系出發於經驗的分析在此上作理性的思辨再進而作直覺的體悟所以說要先得法住智後得涅槃智雜阿含經卷一四三四七經重視經驗的事實佛教這才與奧義書分流至於輪回說原則上是接受的不過初期的業側重於善惡的行為關於業的體性還少有去考慮他奧義書時代流行的苦行與瑜伽傳說釋尊修學的時代曾從阿羅邏伽藍摩鬱陀迦羅摩子專修瑜伽繼而捨棄它又專修苦行六年又捨棄它然後到佛陀伽耶自覺成佛這明顯的表示不滿瑜伽或禪定二者大抵相近為攝持身心以達於內心澄靜的直觀為證悟的重要方法佛教中當然有此修習禪定每能引發身心的超常經驗佛教也不否認然而修習禪定容易走上神祕的迷信誇張神通他的流弊也是不可說的釋尊把他安放在正確的見解純潔的行為上認為專修瑜伽不能證悟真理與實現解脫反之解脫不一定要深入禪定照雜阿含經卷一四三四七經所說慧解脫阿羅漢是不得深禪的當然也沒有神通即使修得超常的經驗六通也不許向未受戒人說如虛僞宣傳自己有神通那就犯波羅夷罪要把他逐出佛教的僧團總之釋尊深入奧義書與瑜伽認識他的長處更能了解他的危險所以能採取他的精意又能防範他佛教的解脫道屬於理智證悟的宗教實繼承此種學風而來釋尊到東方修學接觸東方的時代精神佛教的真精神是屬於東方的如注重現實經驗重視變化尊重自由思考主張種族平等反對吠陀權威這些都與東方的新宗教採取同樣的立場然也有不同一抨擊極端的縱欲與苦行如中阿含經拘樓瘦無諍經卷四三說莫求欲樂極下賤業莫求自身苦行離此二邊則有中道倡導不苦不樂的中道為釋尊徹始徹終的教說二命則是身的唯物論命異身異的二元論加上色心是我無二無異長存不變的梵我論一一加以破斥代以不落兩邊無常無我的緣起論三新思想的缺點在破壞舊的而不能確立新的見到變動而不能見到變動雜多中的條理不能確立崇高的理境傾向於庸俗的功利的世界這一點釋尊起來糾正他指出真實的事理中道的實踐究竟的歸宿給以法性法住法界常住的性質也就是真理與道德的建設釋尊從自覺獨到的境界裡綜合東西印度的文明加以洗鍊完成折中東西的新宗教以我們看道德的理智的平等自由的特質為印度各系所偏到的惟有在佛法中才完整的統一起來要理解釋迦的真諦更應該從佛教確立的體系去認識釋尊所倡導的新宗教稱為達磨意譯為法法的本義是持有確定不變的意味引申為秩序條理軌律佛教中凡事理的真相行為的正軌究竟的歸宿都叫做法這些法是本來如此的一定如此的普遍如此的所以讚歎為法性法住法界界是類性釋尊在現實經驗的基礎上以思辨與直覺洞見此本然的必定的普遍的正法這才大轉法輪化導有情泛稱一切有情識的生物但主要的是人類依佛法維持人類的現狀或進步的淨化世間到達解脫都不可不依事理的真相而了解依行為的正軌而進修以究竟的歸宿為目標法是人生向上的指針事理的真相是理智的真行為的正軌是道德的善究竟的歸宿是理智與道德的最高實現稱為正覺釋尊的開示正法通常歸納為四諦鹿野苑初轉法輪即是依四諦而說的四諦是苦集滅道這四者如如不離如不異如真實審諦不顛倒是聖所諦雜阿含經卷一六四一七經是真實正確的所以稱為諦一苦諦佛法出發於有情的現實經驗現實人生有不可否認的缺陷苦迫考察它而要求超脫它即是佛教的中心論題現實人生的苦迫因為身心常在變動的過程中所以引起生苦老苦病苦死苦人在社會中不能沒有自他的交接所以引起愛別離苦怨憎會苦人的衣食住行依賴於外界的物資所以引起求不得苦這些苦迫如作根本的看法即可略說為一五陰蘊盛苦五陰即有情身心的總稱一切苦迫到底依身心和合的存在而存在有情與苦實為不可分的然佛說有情是苦不否認人生有福樂而且還稱讚它福報是受樂之應甚可愛敬增一阿含經卷四護心品這因為從世間情意的立場當前的情感有苦受樂受不苦不樂的捨受不能說一切是苦佛法不承認苦與樂為純主觀的如雜阿含經卷三八一經說福樂比苦痛要好得多如從解脫的理智的立場從高一層看一切在變動不居的否定中福樂的可愛到底必歸於滅無這樣我以一切行無常故一切諸行變易法故說諸所有受悉皆是苦雜阿含經卷一七四七三經充滿苦迫的有情到底是什麼釋尊的觀察詳於心理的分析有五蘊說色受想行識詳於生理的分析有六處說眼耳鼻舌身意詳於物理的分析有六界說地水火風空識都不出色物質心精神的和合相續像神教者常住不變清淨妙樂的自我靈魂根本沒有這無常無我的色心和合相續論依識緣名色生名色緣識生雜阿含經卷一二二八八經的緣起論的觀點決不能看為二元的即心與身為相待的關係的存在不相離而又是不相即的二集諦即苦果的因緣釋尊承受印度主意論的思想確認苦迫的原因是愛愛是意欲的染著的為有情活動的特質在有情凡夫的一切活動中深刻的表現出來此意欲的愛表現於時間的關係中他顧戀過去而同時又欣求未來戀戀於過去的美夢憧憬於未來的光明又牢牢的耽著現在愛又表現於自我與環境的關係中他以自我常樂的的愛著為根本又染著外界的一切把這二者綜合起來即看出愛欲的清晰面目所以集諦是愛後有愛喜貪俱行愛彼彼喜樂愛欲愛的活動業有善的也有惡的決定自己未來的身分有苦的也有樂的然依理智究竟的觀點愛欲的活動都不過是未來的苦因就是當前的境界也是有愛即有苦如深著自我而為無限的追求必將引起個人與社會間更深刻的苦迫雜阿含經卷二五四五經等都曾明確的指出所以歸結到衆生所有苦生彼一切皆以欲為本雜阿含經卷三二九一三經三滅諦世間的個人福樂社會的和樂繁榮當然值得稱讚但他到底是不可保信的一切的一切在回憶中消失了生死是這樣的連續下去生天的還要墮落成仙的要死自殺的如老牛敗車反而更糟了依佛法生死的根源是愛欲所以如能斷除愛欲轉去諸結正無間等就能究竟苦邊雜阿含經卷一二四經苦迫的徹底解脫稱為滅就是涅槃涅槃即苦與集的消散在理智的直覺中現證一切空寂廓然無我的智覺無著無礙實現解脫的自在這重在現生的體驗不是寄託希望在未來所以說出家是捨非時樂得現前自證的樂雜阿含經卷三八一七八經四道諦世間苦迫從情意的愛欲而來解脫愛欲的涅槃必以理智為中心的聖道才能實現道即八正道正見即正確的知見對事理的真實有明確堅定的理解一切修行都以此正見為根本如雜阿含經卷二八七八八經說正見人身業如所見口業如所見若思若欲若願若為悉皆隨順彼一切得可愛可念可意果正見是實踐的眼目思想行為一切都照著正見的指導才能到達理想的目的正思惟即依正見所見的加以思慮決心去實現他正思惟或譯正志正欲正語是確當的言論正業是身體的正當行為正命是正當的生活經濟的來源與消費都需要適合正當正精進即強毅而必求貫徹的身心努力正念即對於正見正志所認識而決定的能專心的繫念這就是在正知正行的基礎上進修瑜伽因正念而到達身心平靜即正定在正定中佛教雖主張不一定要深入四禪然至少也要有身心平靜的境地現覺真諦而實證涅槃的解脫這八者在家與出家的信徒在正語正業正命的內容上雖有多少不同然同為到達解脫者必經的歷程此解脫行的必然正軌任何人不能例外所以稱之為古仙人之道不但解脫即世間的正行如要完成人格成一世間的賢者也到底不能違反此原則不過多少降低他的內容而已這在經中就稱之為世間正道相似八正道上面所說的四諦概括一切他的所以被稱為諦即重在事理的真實確見此四者的確實如此即是知法入法的聖者了四諦是概括的分類更可以統攝在兩大理性以下即緣起法與聖道法聖道即八正道是佛法的宗要有聖道的篤行才可以體證真理而實現解脫的自由佛法也就依聖道的篤行而久住人間正道的最初是正見正見所見的即是事理的真實正道的最後是正定正定所證入的即究竟的歸宿涅槃佛法以正道為中心統攝真諦與解脫明白可見然聖道是古仙人之道所以不僅是實踐而且是實踐的理性以正見為眼目以純潔的行為語業命為基礎為解脫所必經的正軌確見此本然必然而普遍的理則所以肯定的說得八正道者得初沙門得第二第三第四沙門果除此已於外道無沙門雜阿含經卷三五九七九經緣起法是從事理的真相統攝一切緣起法的定義是此有故彼有此生故彼生即世間法苦與集的存在與生起一切都是依於因緣依因緣的存在而存在緣起法所開示的因果法則如增一阿含經六重品卷三說如鑽木求火以前有對然後火生火亦不從木出亦不離木皆由因緣合會然後有火所以果必待因而後生果雖不離因也不就是因依此有故彼有此生故彼生的定律建立意欲為本的世間因果十二緣起的因果相續是流轉門然流轉的緣起法不是個別的因果事相是在無限復雜的因果幻網中洞見因果的必然系列個別的因果事相名為緣生法因果事相中看出他必然的系列即有情流轉的必然階段因果事相總不出此必然的理則此緣起法與緣生法如雜阿含經卷一二二九六經說凡能悟入此因果必然的理則名為得法住智緣起法是依因託緣的存在凡是依因緣的和合而有而生的也必然依因緣的離散而無與滅這本是緣起法含蓄著的矛盾律所以翻過來說此無故彼無此滅故彼滅雜染苦迫的消散稱為還滅門滅即是涅槃的寂滅此緣起法的生起是有為法緣起法的寂滅是無為法有為與無為如雜阿含經卷一二二九三經說能悟入無為寂滅的名為得涅槃智滅決不是斷滅不是壞有成無這是緣起法本性的實相因為因緣和合而有因緣離散而無可以有可以無理解到他的沒有真實性如雜阿含經第一義空經說這樣佛教的三大真理被揭示出來即諸行無常一切法無我涅槃寂靜有情的緣起即身心和合相續的歷程緣起的存在必歸於滅無所以有情的相續活動是無常的息息變動的身心和合沒有常恆獨存的自我所以說無我不但沒有常存不變的個我也沒有宇宙本體的大我擬人的創造神這都不過是小我的放大徹底的說一切的一切物質也好精神也好都是依因緣而存在所以也一律是無常的無我的從無常無我的觀察確立涅槃寂滅一切法的歸於滅為一切法的本性如大海的每一波浪必歸於平靜一樣佛弟子的證入涅槃不過是行其當然還他個本來的面目一般人不了解無常錯覺自我的存在流為一切意欲的活動如勘破諸行的無常性諸法的無我性即能斷愛離欲現覺涅槃的空寂如雜阿含經卷三八四經說無常則苦苦則非我非我者彼一切非我不異我不相在此即破三種我如實知是名正觀如是觀察於諸世間都無所取無所取故無所著無所著故自覺涅槃佛教的涅槃不建立於想像的信仰上建立於現實人生的變動上是思辨與直覺所確證的上面的緣起與聖道總貫一切佛法而此二者更統一於因緣的法則中所以說有因有緣集世間有因有緣世間集有因有緣滅世間有因有緣世間滅我論因說因雜阿含經卷二五三經即是釋尊正法的特質苦諦緣起而緣生世間因果集諦緣起法法因緣緣起而寂滅滅諦出世因果聖道法道諦十結論東方的宗教特別是佛教推進了東方後進民族的發揚王朝可以興衰東方人的強大一直在前進這時候西方在惡運中沒落了宗教的思想分化後起的六派哲學都在此時漸漸的分化宗教制度與社會秩序在東方崛興中動搖佛教的傳布衝過恆河上流到達印度河流域了外患又一天天嚴重起來西元前五一八年波斯王達理士侵入西北印度五河地方曾被異族統治拘羅地方也缺乏有力的王統接著西元前三二六年馬其頓王亞歷山大侵入印度一直到恆河上流婆羅門領導的政權遭受嚴重的打擊當時東方吠舍離人旃陀羅笈多起來收攬五河地方的人心驅逐亞歷山大王遺留的戍兵然後回兵東向創開統一印度的孔雀王朝定都在東方政教中心的波吒釐五十年後阿恕迦王即位摩竭陀中心的大帝國達到非常的隆盛佛教也進而為印度的國教弘通到印度以外印度歷史的光榮不能忽略印度的東方印度缺乏明確的歷史尤其是東方一般人專憑西方婆羅門文化的傳說不知東方人自有古代史的傳說這是應該考慮的佛教起於東方他的根本聖典在西元前三世紀的阿恕迦王時代已明確編定佛教的傳說與摩訶婆羅多羅摩衍那往世書等比起來有的還要早得多在東方人傳說的東方中如東方印度初民文化的自發性東方民族的西進釋迦族的起源於阿濕摩都是值得重視的恆河以北雪山以南這一帶民族的共同性也在佛教的根本聖典中明白的表顯出來這在印度民族文化與佛教文化的特色中是怎樣的值得研究本文不過根據古典對此重要論題作粗略的提出以引起學界的注意罷了
