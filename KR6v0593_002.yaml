body:
  text: 佛教之興起與東方印度一東方與西方印度文明的開拓者屬於西方移入的阿利安人印度的每一區域都曾滲雜了阿利安人的血統每一思想都曾受過阿利安傳統文化的熏陶所以說到印度文化即無異是廣義的阿利安文化西元前六世紀前後阿利安文化在他的擴展過程中曾遭遇到有力的反抗東方的非婆羅門主義如佛教耆那教等都脫離傳統的婆羅門教建立他獨自的文化體系此東方新宗教的勃興自有復雜的時地因緣而非阿利安人與不純粹的阿利安人承受西來的文化熏陶喚醒自覺自尊的精神要求宗教的種族的思想的平等與自由實為此一時代的文化特徵印度文化而影響中國最深切的即屬於此印度的東方本為一不確定的名詞依正法念處經卷六七以下的四分法印度東方即指東經八十度以東北回歸線以北的地方依一般的五分法東印度僅有今阿薩密孟加拉奧里薩地方本文依釋迦時代東方人的看法印度文明的重心在恆河流域恆河發源於雪山的南麓東南向流到鉢邏耶伽與閻浮那河合流此二河的上流即西方阿利安人創開的婆羅門教大成的地方從此一直向東流到瞻波以東又斜向東南流會合了從西藏來的布拉馬普得拉河構成世界上最大的三角洲流入孟加拉灣此二河合流即今孟加拉地方依佛教的傳說實為東方非阿利安文化的孕育地恆河中流的波羅奈即現在的貝捺勒斯可作為東西的交界處二婆羅門眼中的東方婆羅門乎勿去東方免與婆羅門之尊嚴有損拘羅地方的婆羅門曾在他們的典籍中有過這樣的告誡因為在西方婆羅門國即拘羅的婆羅門看來東方雖有阿利安人但已失去血統上的純粹即曾與東方的土著相混合如摩竭陀人毗提訶人毗舍離人都不能算是純正的阿利安人波羅奈以東的民族含有大量非阿利安的血統因此宗教社會語言等都顯出非婆羅門文明的傾向東方的民族無論是阿利安非阿利安都沒有能像西方阿利安人那樣的尊敬婆羅門如婆羅門進入東方必不能維持他無上的尊嚴最好還是不去不過東方情調的印度文明正在繼長增高婆羅門也不得不起而追求了婆羅門教的三大教綱即是吠陀天啓婆羅門至上祭祀萬能印度的東方人對於吠陀已缺乏堅強的信念婆羅門教以為吠陀是天神啓的由古代聖者傳述下來吠陀的語法即是神的語法即是阿利安人所用的語言宗教與語言的密切結合加強了宗教的信仰然因阿利安人的散居各處每與土著民族混合語言上到處有很大的差別當時東方已不能說純粹的梵語如不能說而代以摩竭陀及毗舍離一帶的方言近人考證的意見以為近於拍拉喀利語後來又分化為拍拉喀利語與巴利語等巴利語是佛教所用的語言拍拉喀利是耆那教所用的因到處方言的不同影響了婆羅門教吠陀天啓的權威約在釋迦時代的前後西方的婆羅門學者已注意到此開始語文的整理工作如式叉論的聲調學闡陀論的音律學毗伽羅論的文法學尼祿多論的吠陀難句釋從西元前五世紀的耶斯卡開始到前四世紀的波儞尼大成種下了後來婆羅門教復興的機運這即是根據吠陀以來的語法而加以整理完成的雅語當時因語言的不同搖動了吠陀的權威如佛教因到處流行雖不禁止西方信徒的使用雅語但對於各處的方言一樣的尊重聽隨國音讀誦但不得違失佛意五分律卷二六釋尊與摩竭陀一帶信徒所使用的語文在西方系如舍衛城阿臘脾的信衆看來我諸聖者不間聲韻逐句隨文猶如瀉棗置之異器根本說一切有部毗奈耶雜事卷四然而這並不是佛教的遺憾反之對於雅語成癖的人要加以呵斥像闡陀論音律的混入佛法還要加以嚴格的禁止五分律卷二六等語言為婆羅門教的武器之一但一到東方便不能受人的尊重關於社會的組織印度西方依婆羅門四姓的規定婆羅門至上為一最高的特殊階級他是從梵天口中生的宗教的權威支配一切決定一切但在東方四姓的階級雖也已存在宗教師婆羅門的地位卻已被降落由剎帝利的士族領導一切這就是政治與權力第一宗教與思想受政治的指導這一變遷是社會發展的必然階段同時也因為東方的民族復雜東方的阿利安人呼吸到東方的空氣不大願意接受婆羅門的支配非阿利安人也一族一村的在各自為政且已走向王朝統一的路向新宗教與新思想都在東方王朝的愛護下興起射出反婆羅門教的光芒就是早一期的奧義書所有梵我不二論輪回業感論的教義也不是婆羅門教傳統學者的産物而與東方的王朝有關如布利哈德奧義書六二說此義輪回直至今日婆羅門猶未知之故世界政治之權歸於剎帝利在這樣的社會組織下婆羅門階級惟有屈服為了保持尊嚴只有不到東方去的一策婆羅門教主要的儀式是祭祀在夜柔吠陀中已有祭祀萬能的傾向梵書的思想更極端祭祀主要是犧牲的血祭這本是漁獵時代的遺制但在東方一方面是農業的發達一方面愛護生物的思想特別濃厚所以傳統的血祭被看作不徹底看作無意義甚至看作不道德不殺生已成為奧義書的德目之一後來在東方興起的佛教耆那教阿耆毗迦外道都嚴格的禁止殺生這重視宗教的實質輕視儀式與慈悲思想的發達直接影響到婆羅門的宗教離去宗教負宗教專職的婆羅門也自然受到冷落東方摩竭陀一帶的文明有他的特色無怪乎正統的婆羅門把摩竭陀一帶看作異教的地方三瞻波中心的古印度恆河下流東南向流入大海在恆河西南岸有瞻波大城這是古代央伽國的首府釋尊時代的瞻波約在現在的附近然依西域記卷一佛世瞻波的億耳因緣等都被寫在伊爛拏鉢伐多國瞻波還在東面三百里的地方從此向東看河流氣候物産都適宜於文明的孕育東方最先出現的像樣民族傳說在瞻波這是早在西方阿利安文化未來以前獨自開展的印度從來就缺乏明確的歷史何況是古代何況是向來被西方阿利安人忽略的東方然依古代東方人的傳說還能了解東方的大概如長阿含經世記經卷二二說爾時先造瞻婆城次造伽尸婆羅奈城其次造王舍城以此因緣世間便有城郭郡邑王所治名又見大樓炭經卷六起世經卷一起世因本經卷一這是佛教所傳的社會發展故事以為此世界的城郭瞻婆城最早後造伽尸的波羅奈城到最近才造王舍城在說明世間初有夫婦的結合時插入這開始建築房屋的傳說這當然是印度東方民族所知道的世界是他們的傳說這一古代的傳說不但透示了印度東方文化的孕育地還說明了古代國族興起的前後從瞻婆而開展的故事西域記卷一的瞻波國中也有說到在昔劫初人物伊始野居穴處未知宮室後有天女降迹人中遊殑伽河即恆河濯流自媚感靈有娠生四子焉分贍部洲各擅區宇建都築邑封疆畫界此瞻波則一子之國都贍部洲諸城之始也天女的傳說是民族起源故事的假託以說明王族的尊貴這一傳說也說明瞻波是城郭的最初建築者雖然瞻波是四國的一國但他是城郭的初建者又將這一故事敘述於瞻波國中實可以看作瞻波文化開啓引起附近城邦的分立四國為同母的弟兄表示四國間血統的同源此一傳說直率的以瞻波為世界城郭的初建者與西方的文化無關傳說者的意境中東方國族實從瞻波一帶而開發自己的文化這是東方的傳說西域記的著作雖遲但這一傳說最遲在阿恕迦王時代西元前三世紀以前已經存在因為長阿含經卷五的典尊經已有此記載而且還更為翔實明白經中假託梵天王的傳說過去久遠時世有王名曰地主第一太子名曰慈悲慈悲太子的登位為王得六位大臣的助力不少因此分封六大臣總為七國分此閻浮提地使作七分王所治城村邑郡國皆悉部分的是大典尊焰鬘這一傳說與西域記大體相同現在要注意的是開始分王造城的傳說尤其是七國七城的偏於東方雖慈悲王的治地不知道是七國中的那一國然依宋施護異譯的佛說大堅固婆羅門緣起經所說中央境土多人聚處黎努王即慈悲的音譯居看來七國的中央無疑的是瞻波現在把七國七城總敘出來再分別考察他的所在地七國如經上說檀特伽陵城阿婆一作波布和城阿槃大天城鴦伽瞻婆城數一作藪彌薩羅城西陀路樓城婆羅伽尸城盡汝典尊造檀特伽陵城施護異譯作迦陵誐國㮈多布囉城伽陵即羯陵伽確為古代東方的大國約擁有今河流域延長到南北阿恕迦王灌頂九年西元前二六曾舉兵討伐此國西域記卷一說羯陵伽在烏荼國奧里薩地方西南二千多里玄奘所見當時的羯陵伽偏在河以東決非古代羯陵伽大國的全部正法念處經卷六八敘述南方諸國的次第迦陵伽與耽婆婆帝相接起世經等說到古代的王統參看下節也總是在怛摩梨多以後接著說迦陵伽的檀特富羅城耽婆婆帝西域記卷一作耽摩栗底即現在的在河與河的合口處可見古代的迦陵伽沒有西域記所說的那樣深入西南他的北部約兼有奧里薩一帶此國的衰落西域記卷一說羯𩜁伽國在昔之時氓俗殷盛有五通仙棲巖養素人或凌觸退失神通以惡呪術殘害國人少長無遺賢愚俱喪人煙斷絶多歷年所頗漸遷居猶未充實故今此國人戶尚少此仙人毀國的傳說正法念處經卷六八即作復有一國名檀荼迦其土縱廣二十由旬空曠無人昔仙人瞋故令國空也檀荼迦即檀特正法念處經雖把他看作另一國土但他曾為古代迦陵伽的首都所在地他的所以毀滅大抵是遭受地震或火山爆發的厄運然迦陵伽的沒落不僅是天災還有人禍阿恕迦王的征伐迦陵伽實造成慘絶人寰的痛事如摩崖訓十三說征服羯陵伽時係虜十五萬殺者十萬死者倍之羯陵伽往有無數人民殺傷死亡係虜存者百一千一而已此古國雖已沒落然在摩竭陀王朝統一以前曾有過一期的繁榮依傳說看來迦陵伽實為東方民族南遷的一支阿波布和城與阿槃大天城施護異譯作摩濕摩迦國褒怛那城晚帝那國摩呬沙摩城阿波在佛典中並不是生疏的十六大國中也有如長阿含經闍尼沙經卷五作阿濕波宋法賢異譯的佛說人仙經作阿說迦又中阿含經持齊經卷五五作阿攝貝宋代異譯的優陂夷墮舍迦經作阿波耶十大王族中也有如長阿含經世記經卷二二作阿葉摩晉法立等異譯的大樓炭經卷六作阿波四分律卷三一作阿濕卑在這些音譯中惟人仙經的阿說迦合於巴利語的其他原文即顯然不同應是或轉為音所以作摩阿槃即阿槃提十六國中也有尤為佛教界熟悉的地方阿濕波與阿槃提本為兩國十六國中也如此他雖是同源異流但確已分為兩國分頭發展到彼此不通了上座系的律師們把阿濕波與阿槃提看作一處於是古代阿濕波的地位被遺忘了這是不可不辨的雜阿含經卷九二五五經與卷二五四九經說到摩訶迦旃延遊化到阿槃提上座系的廣律有摩訶迦旃延教化億耳的故事地點即在阿槃提巴利大品的阿槃提漢譯的五分律卷二一作阿濕波阿雲頭四分律卷三九初作阿槃提下文又作阿濕婆阿槃提十誦律卷二五作阿濕摩迦阿槃提根本說一切有部毗奈耶皮革事上作阿濕婆蘭德迦上座系律典把阿濕波與阿槃提看作一地已明白可見所以律典所說的阿濕婆阿槃提等實在是指摩訶迦旃延所住的阿槃提與布和城所在地的阿濕波國無關善見律毗婆沙卷二說阿恕迦王時