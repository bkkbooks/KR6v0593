body:
  text: 欲與離欲一欲是什麼欲是什麼一般佛教界通俗的佛教缺乏明確的界說有說是欲望有解說為難填的欲壑不問欲是什麼總之是都把欲看作可咒詛的應厭離的當然離欲斷欲呵棄諸欲等是佛所一再開示的毫無疑問但如無簡別的解說為斷絶欲望這就難怪世間學者要把佛法的人生態度看作向後勦絶佛教徒自身也流於消極而奄奄無生氣了對於欲無論是為了自修為了佛教佛教界是應該認清而有一正確態度的佛法中本有善法欲為信修趣證的重要因素然善法欲一詞非常生疏而大家只是著重於染欲的厭離這也許受有中國文化的影響吧在中國古典中欲是偏重於穢染的如說欲不可縱懲忿窒欲不見可欲使心不亂等這點姑附記於此現在先從雜染的欲來說說到欲便應留意到離欲欲與離欲佛法中有廣狹二義一廣義如經上說能離欲界欲及離色界欲入真諦現觀能離一切欲這是通稱三界修所斷煩惱思惑為欲離欲即斷盡一切修惑而究竟解脫所以聖彌勒說離欲者謂於修道離欲究竟修道所斷一切行斷名離欲界二狹義是指欲界修惑而說如修得初禪必須離欲及惡不善法從欲的字義去考究相信欲的本義確是約欲界而說欲界無疑是染欲最強的尤其是男女欲所以稱為欲界佛經中凡與上界煩惱相對的欲界煩惱每以欲立名如三愛中對有愛而立欲愛七隨眠中對有貪而立欲貪三漏中有欲漏四瀑流中有欲瀑流可是這雖說是欲的本義也可說是欲的淺義在印度舊有的宗教思想中人間欲天上魔宮都是有男女欲的都是生死而無常的超過了這便到達常恆自在喜樂的梵界但依佛陀的如實知見認為離此人天魔欲界而到達的梵界還沒有出離生死並非究竟這種繫縛生死的梵天以上的惑力也就叫做欲所以立為三界欲要斷盡三界的修惑才是究竟的無欲界才是究竟的解脫在三界中欲是側重於欲界的但在煩惱中欲是側重於愛行的這是說佛說的生死根本不外乎無明與愛如約三界來說從來的小乘大乘都一致的分為二類見道所斷的見行的認識錯誤修道所斷的愛行的情意倒亂如就欲界人類發展得明顯來說餘界餘趣或由於定力所伏或由於知識蒙昧都不顯了那便是見與欲了佛說以欲為本所以民民共諍王王共諍以見為本所以宗教師也彼此相諍欲是愛行的有時與貪愛並無多大差別如說貪異名者亦名為欲彼愛亦名希求亦名欣欲不過從其特性而說欲是於彼彼境界隨趣希樂有著向外實也通於向內希求的特性而愛是更重於希求自體的存在貪是於受用喜樂堅著現出染著而戀戀不捨的情形總之約染欲來說欲與貪及愛大致是相同的不過欲特重於欲界的物欲向外希樂二事欲的分析從欲界人類的欲來說一般都分為五欲即眼耳鼻舌身識由於觸對妙色色彩形態動作聲香味觸五種可意的境界所引起喜樂希求耽著不捨的欲還有男女淫欲是觸欲所攝也通於色聲香欲這是欲界所特有的但欲天的淫欲極輕旁生等也不因此引起過重的憂苦而人類的男女欲顯然的成為社會一大問題有著無邊歡笑而實在是包含著無數眼淚愛欲的味最深過患也最重所以出離的道最為佛法所重視五欲及淫欲為欲界的特徵實也就是人類最主要的欲事如隨事分類經論所說極多最扼要的是三種諸受欲者圓滿差別三種是一資産圓滿二自體圓滿三廣大殊勝有情供養圓滿人類有了自體身心的存在即對於自體有圓滿欲有自體不能沒有物資的生活所以有資産的圓滿欲生就不能沒有父母有家庭有社會自然會引發廣大的眷屬圓滿欲這是以自體為本而對於自身社會物資所起的愛欲這三種受欲圓滿也是互相關涉的如飲食欲屬於物資欲然樂受欲者為受諸欲食於所食諸欲即為了倡蕩淫欲為了憍逸少壯無病長壽為了飾好端嚴姿色的美好其中除了淫欲都與自體有關自體圓滿就是保持青春體力勇健形色端嚴壽命延長以及未來生命的永續與自體相對的有情與資産即境界欲略有攝受與資用二門攝受是攝屬為自己的是占有欲資用是成為身心所受用的是享受欲支配欲攝受的可以成為資用的但如荒郊的野花你並不攝受它並沒有把它看作自己的私有物卻可以受用它的美色與芳香又如存在銀行的存款是屬於你的可是在這生中你不一定能使用它積穀千倉的食物也如此經論中有七攝受事六種所攝受事十種身資具四資具六種別欲十種貪事等種種分類總括的列如下表色聲約法假說五陰世間香味觸法父母夫妻兒女僕使親友兄弟師生僚屬牛馬土地山水田園攝受房舍庫藏金銀珠寶穀物眷屬邸肆作業經商從政力農福業社會福利弘通佛教飲食車乘衣服有情世間資産嚴飾具約受假說歌舞戲樂博奕器世間資用華鬘塗末雜物傢具玩具光明宅舍床榻憩息男女受行淫欲承事侍衛滋長運動按摩清淨澡浴潔淨自體色力健壽生命永續三欲與離欲上來所說是偏於欲界的尤其是偏於物欲的還不曾總攝一切現在來論究這些物欲飲食男女房舍田園這些真的是欲嗎如這些是欲那麼離欲的就不應該見色聞聲不應該穿衣吃飯了如果不是的那經論中為什麼要稱之為欲這些佛確是稱之為欲的尤其是男女的淫欲然諸欲自性略有二種一者事欲二者煩惱欲上面所說的是事欲是依此而起欲的是欲所耽著希求的是欲具而假名為欲不是真欲真正的欲是欲貪欲愛欲藏阿賴耶欲護欲著喜樂耽著貪染相應欲所以說世諸妙境非真欲真欲謂人分別貪又說欲我知汝本意以思想生我不思想汝則汝而不有煩惱欲才是真正的欲體離煩惱欲才是究竟的離欲對於染欲可以這樣說人天乘是節欲的小乘是離欲的大乘是化欲的其實小乘以離煩惱欲為本而相當重視外界的事欲大乘是特重於離煩惱欲的以智慧而做到究竟離欲在原則上大小乘並無差別說到佛法對欲的態度應先說到印度當時的情況一分是在家的樂行人是縱欲的一分是外道出家的苦行人是禁欲的苦行者不但絶男女欲而且對飲食有的日食一麻一麥服水吸氣衣服有的索性裸體住處有的臥在荊棘上都以最刻苦的生活來磨鍊自己釋尊出世時苦行正風行於恆河兩岸受到民衆的尊敬佛的根本立場是宣告遠離苦行與樂行的二邊而遵行中道的態度這就是確認事欲的不可縱也無法脫離而惟有以智化情而離煩惱欲在對於外物的態度上出家的比丘生活適應當時的出家制少欲知足多少引用苦行的一分長處但決與苦行外道不同除了男女淫欲佛說是障道法絶無通融而外遠離資具欲但衣食住處都不過分的菲薄遠離眷屬欲也不妨大衆和合而住佛與一般比丘就是這樣的不過出家弟子中有自以為獨覺種性的遵行刻苦的頭陀生活更有自以為是佛的提婆達多末了叛教宣稱五法是道採取絶端的苦行生涯聲聞佛教雖不以苦行為道有的以四聖種為道而立四十一道品但不為一般所公認著重於出離煩惱欲但對於事欲確是相當重視的出家的特色便是遠離男女眷屬資財的事欲過著少欲知足的恬淡生活就是在家佛弟子對憍奢的欲行也不會贊同的艷麗的色相美妙的音樂醉人的芳香等五欲誘惑力極強就是豐富的利養生活資具崇高的名聞也每使人蕩情失志沈沒於欲海之中關於這些欲事不能不贊同一分古德的見解因為這些五欲男女飲食名譽等雖不是真欲但對於人類的根識感官經驗卻有一種客觀的相對的清淨性美能引發相對的不永久不徹底喜樂使一般人不自主的為它而迷醉對於這些根本的對策當然是遠離煩惱欲定動慧拔不受它的誘惑然在沒有離煩惱欲以前對於這些事欲不能不提高警覺嚴加防範以減輕抑低煩惱欲的衝動佛法的戒學便是著重於此的例如匪患根治的方法當然是思想感化生活安定但在生活艱困思想混亂時期鎮壓圍堵等都不能說是無用的否則泛濫橫決弄到國破家亡又從那裡去作思想感化安定生活的工作所以佛法對於五欲利養名聞等所取少欲知足這其實是沒有標準的依人的欲愛而定的態度目的在此並非為了苦行而苦行或者認為非受苦不可種種事欲中對於衣食住等資財出家是完全放棄了出家後的理想生活是隨緣乞化一身以外無長物長物是規定以外的多餘物資但屬於佛教公有的公開於大衆前的淨施物出家人也容許保有出家時遠離了父母眷屬但在出家僧團中同參道友親教近住還是和合得如一大家庭對於眷屬資財的出家生活在家衆是做不到的而在家衆也能同樣的離煩惱欲不過男女和合欲事出家是絶對不許的雖然淫欲並非生死根本色界以上地獄以內都沒有淫欲事而照樣的還在生死海中但由於欲界諸欲中淫欲力是最強的縛人最深的經中喻如繩索從破皮穿肉而一直到斷髓非法的邪淫固然是糾紛苦痛的根源就是夫婦正淫也是纏綿牽繫欲染深徹骨髓為了家庭為了經濟每不能不牽就事實而使自己的信念德行學業受到慘重的毀滅淫欲是障道法不問你反對也好懷疑批評也好佛是這樣絶對的宣說四無畏之一那麼在家佛弟子怎麼也一樣的可以遠離煩惱欲呢要知道繫縛生死的根源是愛不單是淫欲而出離煩惱解脫的主力是智慧在家佛弟子一期的精勤修持暫離淫欲可能達到見道悟入的地位見道只是斷除見行的煩惱徹了法性不再會犯重戒如非法行淫等而淫欲是愛行煩惱見道的也還不能斷所以初二果的在家聖者淫欲還是可以現行的以此徹悟法性的智慧數數修習以智化情斷盡了欲界修惑證不還果才不會再以染污心行淫不過生理關係到究竟離一切欲的阿羅漢還可能有不淨呢聲聞佛教與大乘一樣的著重於出離煩惱欲而不是專在事欲上節制斷絶所以有比丘為了淫欲太強自己將淫具割去了佛嚴厲的呵責他應該斷的煩惱不斷不應該斷的倒斷了我曾逢到自割淫具的出家人受到許多人尊敬其實是要不得黃門與不男不女的雖不能舉行欲事而由於性生理的變態性欲卻特別強離欲是沒有可能的佛制黃門等不許出家原因就在此又如離眷屬的獨住有初學比丘想到靜處去專修佛勸他不要去他還是去了可是不久他又回來原來內心的煩惱動得厲害環境的安靜並無用處這都可以看出離欲決不是專在事欲上著力又如釋尊在世與比丘過著同樣的生活他住樹下也住高樓大廈吃馬麥也吃百味丸穿糞掃衣也穿價值巨萬的金縷衣獨處也與千百比丘俱在一處然而人人讚佛少欲知足因為佛是究竟離欲的一切隨緣而住都是離欲的生活所以離欲並非離去資具或眷屬雖然這些曾被稱為事欲事實也是不能完全離去的以佛教通用的術語說問題在心能轉物不為物轉從前外道以目不見色耳不聞聲為離欲重定的以事欲為欲的佛要批評他離了煩惱欲境相還是照樣的境相具有惑人的力量而再不能擾動澄靜的慧心不會再因之而起欲愛了這就是離欲從上面的敘述中可以看出佛法的重心在乎以智化情而離煩惱欲對於事欲資具眷屬與男女欲處理得並不相同這當然是聲聞佛教相當的重視事欲而淫欲的染著力又最強的緣故
