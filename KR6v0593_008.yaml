body:
  text: 漢譯聖典在世界佛教中的地位世界佛教教友會主旨在聯繫世界每一角落的佛教從精神的聯繫到達和諧合作從發揚佛陀的最高文化去實現覺世救人的事業所以首先應該承認世界的任何佛教都是佛教的一流不能片面地武斷的自是非他不能輕率的誹撥大乘為非法也不能傲慢的輕視聲聞佛教為焦芽敗種惟有在互相信諒的友誼下客觀的善意的去研求修學才能從相互了解做到彼此溝通才能抉取佛教的精髓淘汰塵垢粃糠而發展為適應時代的攝導現代的覺世救人的佛教佛法是一味同源的也是多方適應的在適應不同民族不同環境不同時代中發展為似乎非常不同的形態然如從發展的傾向發展的規律從演變中的內在聯結外界適應去研求即會覺得世界不同形態的佛教是可以溝通可以合作的如通泛的說各有它的特點缺點應站在平等的立場尊重真理而捨短從長這才能日進於高明而更近於佛陀的真實契合如來的本懷從印度佛教去印證世界佛教全體時佛教的從一味而分流是這樣的一約教典說佛法先有法與毗奈耶的集出流通到西元前後關於法阿含的參究者或著重聲聞行著重於緣起法相有的分別撰集為阿毗達磨或著重佛德與菩薩行著重於緣起法性空的體證即有空相應的摩訶衍經集出流通西元三世紀龍樹依性空大乘經抉擇阿含與阿毗達磨而撰中觀諸論同時前後大乘經即傾向於真常的唯心的有勝鬘經涅槃經等經其後又有楞伽經等經出現在真常唯心大乘的發達過程中一切有系的經師瑜伽師承受性空的唯心的大乘經而撰述瑜伽唯識等論典成為一大系約從西元五世紀起從真常唯心的大乘中更流出祕密瑜伽的續部從這發展流化的過程去了解一切教典間的承先啓後不同傾向是可以明白的分別出來二從教乘說起初佛法就是佛法更沒有分別到西元前後分化為聲聞乘與菩薩乘在菩薩乘的經典中即有小乘與大乘的分判二三世紀起菩薩乘又有真常唯心的教典出現這一類經中即有有空中三教或小大一三乘的分別對於菩薩乘這次後流通的重於佛果所以又特稱為佛乘五世紀起妙有的佛乘中又分流出陀羅尼乘這對於一切佛法即判為三藏波羅蜜藏含得顯教大乘的一切陀羅尼藏或四諦行波羅蜜多行具貪行這種教判的分化表示佛法分流與發展的全貌太虛大師的三期說即與此相合初五百年小行大隱時期巴利語系屬此中五百年大主小從時期漢語文系重於此後五百年密主顯從時期藏文語系屬此中國的漢文佛教日本佛教也從此流出在印度三期佛教中重於中期即以菩薩乘為本前攝聲聞乘而後通如來乘在這世界佛教發展的時代應值得特別的重視因為惟有從漢文聖典的探研中才能完整的理解佛教的內容今從教典來說一阿含四阿含是全部具有的中阿含經與雜阿含經屬於說一切有系長阿含經屬分別說系增一阿含經屬於大衆系雖沒有巴利語系那樣的保有完整的一家專籍但不屬一家自有他的長處藏文系全缺二毗奈耶藏文系但是有部新律巴利語系但是赤銅鍱律而漢文聖典中有大衆系的摩訶僧祇律化地部的五分律分別說系的法藏部的四分津飲光部的戒本銅鍱部的善見律論說一切有系的舊的十誦律新的根本說一切有部毗奈耶犢子系的正量部的二十二明了論這樣的兼收並蓄最適宜於作比較的研究三阿毗達磨這本是上座系三大派分別說說一切有犢子所共信的藏文系但有六足的施設足論一分與晚起的俱舍論巴利語系有七論漢文聖典雖特詳於有部而實通有諸家的阿毗曇屬於有部的有六足論發智論與大毗婆沙論阿毗曇心論及釋大成於對抗俱舍論的順正理論及顯宗論屬於分別說系的有舍利弗阿毗曇論這是可以貫通南傳北傳阿毗曇論的唯一要典有解脫道論即巴利語系清淨道論的異本屬於犢子系的有三彌底部論三法度論晚起西元三四世紀起的論典出入於有部經部而有取捨從長的綜合性的有著名佛教界的俱舍論有影響中國佛教極深的成實論依此分別看來初期的三藏雖不曾受到中國佛教主流的尊重但文典的豐富實為研求聲聞的學派分流以及從聲聞而流衍為菩薩藏的有力文證如忽略了這些漢文聖典我可以斷言是不可能完成協調世界佛教溝通世界佛教的責任的四性空大乘經與五真常大乘經漢文系的聖典極為完備與藏文系相近般若經華嚴經大集經涅槃經四大部或加寶積經為五大部都是部帙龐大的在這裡可以指出漢文聖典的特色一漢文的種種異譯一概保持它的不同面目不像藏文系的不斷修正使順於後起的所以從漢文聖典研求起來可以明了大部教典的次第增編過程可以了解西方原本的先後大有不同這不但不致於偏執一文而次第的演變也可以從此了解二漢文的大乘經在兩晉以前傳譯的與西域佛教罽賓山區為中心擴展到西方的吐火羅西南的梵衍那那揭羅東南的健陀羅東北的竭叉子合于闐特別有關這在中國佛教界造成了深厚的佛教核心思想北印學者菩提留支譯的十地經論楞伽經都有非常的特色六中觀與藏文系的中觀是相當不同的漢文所傳為初期的特別是龍樹撰述的論典如般若經釋的大智度論十地經釋的十住毗婆沙論都不但是深理的中觀而且是廣明菩薩大行的後期的中觀即瑜伽系興起以後的龍樹後學的論典漢文僅有清辨的般若燈論沒有藏文系那樣的學派衆多堅慧的入大乘論無著的順中論表示了從中觀而向瑜伽的行進七瑜伽唯識漢文非常完備有十地經論攝大乘論成唯識論三大家藏文系以安慧派為主近於漢文的攝論家而漢文正統的唯識家是以護法為主的成唯識論代表了陳那護法戒賢這一學系的大成為漢文聖典的瓌寶與唯識相隨行的因明比起藏文系陳那法稱的作品傳譯得不完備這表示了中華民族性的不大重視邏輯不大重視言論的諍辨這限定了過去中國佛教的論師派不能占有主流的地位八祕密瑜伽事部日本稱為雜密行部的大日經瑜伽部的金剛頂經漢文都有譯傳惟有無上瑜伽部受了時代的限制即無上瑜伽盛行時中國陷於衰亂的狀態中受了性習的限制所以淫欲為道的法門不能為中國的知識分子所信受祕密瑜伽充滿於藏文系的聖典中從以上的敘述中可知漢文系的聖典雖以中期的大乘為主而教典的傳譯是不限於中期的晚期的佛教已有了頭緒初期的佛教有著豐富的傳譯所以從漢文聖典去理解向前攝取巴利語系的聲聞三藏向後參考藏文系的晚期中觀無上瑜伽那麼印度佛教一千六七百年的發展全貌也即是流傳於今日世界的三大文系佛教可能獲得一完整的綜貫的發達而又適應的真確認識太虛大師說依流傳在中國者攝持錫蘭傳者及擇取西藏傳者為一批評而綜合而陶鑄之新體系庶幾為著述印度佛教史之目標歟這不但是印度佛教史研究的目標應該是協調世界佛教溝通世界佛教取捨從長而發展為適應現代攝導現代的世界佛教的目標
