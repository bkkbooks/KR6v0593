body:
  text: 略說罽賓區的瑜伽師一瑜伽師與罽賓瑜伽師即一般所說的禪師古代的佛弟子不像晚期的佛教徒專以禮拜唱念為修行他們除學經論持律而外主要是對人廣行教化對自精勤禪思禪思含得止與觀為從身心的修持中實現特殊體驗所必要的凡修持而得止觀相應心境或理智相契應的即名為瑜伽瑜伽即相應的意思瑜伽雖為佛弟子所必修的然由於根性好樂著重的不同古代即有經師律師論師瑜伽師的分科教授即有專修瑜伽的瑜伽師但是經師們並非不修禪觀瑜伽師並非不學經論這不過各有專重而已上座系中凡是仰推阿難的重於達磨的契經的一流錫蘭的分別說系是推重優波離的重律的都重於禪觀分別功德論上說阿難弟子多重禪阿育王傳卷五說商那和修優婆毱多都是大禪師尤其是優波毱多我聲聞中教授坐禪最為第一又說摩偷羅罽賓都適宜修禪尤其是罽賓佛記罽賓國坐禪無諸妨難床敷臥具最為第一涼冷少病罽賓決非迦溼彌羅也可攝於罽賓中主要為健陀羅以北的雪山區即今印度西北邊省北部及阿富汗東北山地有名的伽藍如大林暗林離越寺都是罽賓的僧衆住處賢聖所居阿育王傳卷二這一帶適宜修行瑜伽龍樹大智度論卷六七曾加以解說北方地有雪山雪山冷故藥草能殺諸毒所食米穀三毒不能大發三毒不能大發故衆生柔軟信等五根皆得勢力如是等因緣北方多行般若般若禪觀的一流從南方來到北方而獲得了非常的隆盛這由於罽賓的清涼安靜生活不太難適宜於禪思的緣故二阿毗達磨師太虛大師曾說過天台與賢首從禪出教是重經的三論與唯識是重論的重傳承的然從學派的發展去看大小顯密一切佛法都是根源於禪觀的修證淺深偏圓邪正可以有差別佛如此佛弟子也如此等到從禪出教成為大流承學者大抵是重於傳承如天台學者推重智者與荊溪等重於論典如天台家的法華玄義等的每為文句名相教相所封蔽迷戀於名句糟粕而不能善巧方便地進趣於禪觀的修證如現今的天台學者誰能修圓頓止觀呢罽賓一切有系的瑜伽者即可以充分的說明此意起初上座系的商那和修優婆毱多末闡提等於阿育王前後從摩偷羅而移化於罽賓區這本是阿難以下的重經重禪的一系依於師承傳習修持禪觀組成二甘露門後為三度門又成為五停心別相念處總相念處暖頂忍世第一法的進修次第從禪出教演為阿毗達磨一大流這被稱為論師派然論典的根本摩呾理迦本為修行品目的解說阿毗達磨譯為現對法本為無漏慧對於真理法四諦或一滅諦的直觀現以阿毗達磨本典發智論來說大部分為有關於戒定慧的辨析不過論典興起以後不免偏重於名相的分別罷了迦旃延尼子與世友即為這一系重論的瑜伽者三經部譬喻師在阿毗達磨師發達的過程中一切有系中重經與重禪的還是活躍的盛行於罽賓山區有推重契經內修禪觀外作教化的又從禪出教於西元初成重經的譬喻師一流這一系是重經的如法救與覺天是持修多羅者涼譯阿毗曇毗婆沙論卷一所以西元二三世紀間獨立成部時名經部譬喻師這一系是重於通俗教化的如衆護馬鳴鳩摩羅陀僧伽斯那都有通俗的文藝作品多以偈頌說法法救的編集有部的法句也是同一學風這一系的禪者第一要推僧伽羅叉衆護傳說是迦旃延尼子弟子與世友持經譬喻師本是有部系的不反對阿毗達磨不過能保持以經簡論的態度不同情過分的名相推求同時他的名著修行道地經梵語榆迦遮復彌即是瑜伽行地從西元一六頃的安世高初譯二八四頃的竺法護再譯四四頃的鳩摩羅什的部分集出傳入中國的初期禪觀即是譬喻系的瑜伽鳩摩羅什集出的禪經特重於馬鳴與鳩摩羅陀其中五門禪法是婆須蜜世友僧伽羅叉漚波崛即優婆毱多僧伽斯那勒脅比丘馬鳴羅陀禪要之中抄集之所出也僧睿禪經序除優婆毱多是阿毗達磨系所共宗而外其餘的都是譬喻系的瑜伽者但等到從禪出教如室利邏多的著作經部毗婆沙而後經部是大盛了與有部對立了也就成為學理的研究不再有譬喻瑜伽者的自行化他的活力四大乘中觀師譬喻的瑜伽者著重於普及教化定慧修證在傳說中這一系的大師如婆須密世友衆護馬鳴僧伽斯那都被稱為菩薩馬鳴的師長脅比丘曾確指十二分教中的方廣即是般若經大毗婆沙論卷一二六這是一切有系中與大乘精神相呼應的一流大乘本興起於印度東南大乘經中所說的般若三昧實與瑜伽的內容相近北方大乘初興即與罽賓區通過葱嶺而到達于闐斫句迦的禪者相關內祕菩薩行外現是聲聞可說是絶好的說明二三世紀的龍樹來雪山修學而弘化於南憍薩羅中觀論等名著也是從勝義禪出教的提婆的作品即稱為瑜伽行地四百論龍樹與一切有系有關與罽賓區的瑜伽者流行於北方的般若中觀者有著深切的關係但龍樹一切皆空的中觀直從大乘經與見空得道見滅諦成聖的大衆分別說系相關來與阿毗達磨系的見四諦得道見有成聖源流各別所以後世的中觀宗僧護清辨諸大師也還是復興於南方五瑜伽師阿毗達磨為論師派譬喻為經師派當譬喻瑜伽師從禪出教而完成經部的宗義時專修禪觀的瑜伽師禪師派還是持行於罽賓山區其中比較保守的一派西元四世紀中盛行於罽賓由覺賢於四八年頃傳來中國這與羅什所傳的譬喻系禪法不同依慧遠慧觀的經序說覺賢所受學的有頓漸二禪漸禪是罽賓舊有的遠宗僧伽羅叉到不若密多羅又作富若密羅而大成經富若密羅佛陀斯那而傳與覺賢頓禪由曇摩多羅從天竺南印或中印傳來罽賓經婆陀羅而傳與佛陀斯那曇摩羅又從佛陀斯那受漸禪彼此成相互承學的關係然覺賢所傳於中國的二道二甘露門四義實為罽賓舊有的漸禪多用婆沙論義與婆沙論所說的修定者相合覺賢所傳的禪經梵語庾伽遮羅浮迷也即是瑜伽行地這雖是保守於聲聞佛教的立場而修法與祕密瑜伽者多有類似處如此一法門名具足清淨法場即圓滿清淨法曼陀羅的舊譯所修的二甘露道四分都分為方便道與勝道而修也與祕密瑜伽者分為生起次第與圓滿次第相合經中所有術語修相多有與祕密瑜伽相同的慧遠說達摩多羅與佛大先搜集經要勸發大乘罽賓的瑜伽者在急劇地大乘化與祕密化之中六大乘瑜伽師另一派於西元三四世紀間從經部譬喻的瑜伽師中分化出來一類經為量者成業論折衷於阿毗達磨與譬喻經學接受大乘空義及真常不空的唯心大乘發展為回小歸大的大乘瑜伽師無著為重要的傳弘者等到從禪出教集出瑜伽師地論等後學者也就化成法相唯識學偏於義理的精究了推溯大乘瑜伽的淵源可得二人即離婆多與彌勒大乘瑜伽論本為瑜伽師從瑜伽觀行中心擴大組織而成瑜伽師地論的禪觀總相為遍滿所緣淨行所緣善巧所緣淨惑所緣這是頡隸伐多傳出的瑜伽綱目如瑜伽師地論卷二六說佛告長老頡隸伐多諸有比丘勤修觀行是瑜伽師能於所緣安住其心或樂淨行或樂善巧或樂令心解脫諸漏於相稱緣安住其心於相似緣安住其心於緣無倒安住其心能於其中不捨靜慮瑜伽師地論與解深密經分別瑜伽品都不出乎這一瑜伽綱目曾聞是傳說如此並非展轉傳來的阿含經所有頡隸伐多或譯離婆多離越離曰等是著名的禪師增一阿含經初讚說四衆弟子各各第一時說坐禪入定心不錯亂所謂離曰比丘是樹下坐禪意不移轉所謂狐疑離曰分別功德論中說有兩位離曰一名禪離曰一名疑離曰禪離曰即離婆多舍衛國六年樹下坐禪不覺樹的生與枯受波斯匿王請六年不知主人的名字這是怎樣的專精禪思增一阿含經須陀品說離越在祇洹寺六年不動坐禪第一中阿含經牛角娑羅林經佛讚他常樂坐禪然而這樣的大禪師古典的雜阿含經沒有說到這似乎即是七百結集中的上座離婆多疑離越見於律典十誦律說他見石蜜和麨而不吃石蜜卷二六見晒鉢有津膩出來而疑犯宿食卷三七見羹中有生豆而不敢再吃卷三八關於飲食方面非常的拘謹多疑有部的雜事卷五也說疑頡離跋底不敢吃豆羹五分律也有不吃石蜜事說他到極冷的陀婆國不敢穿屣因而凍壞了腳趾卷二一大毗婆沙論卷一八一也說臥具喜足如頡戾筏多這是生活刻苦持戒謹嚴拘守多疑的大德依分別功德論說禪離越與疑離越都有樹下坐禪六年不動的傳說也許本是一人經律兩記而傳說為二人從古代的傳記中看離婆多與罽賓有著特別因緣罽賓有離越寺大智度論卷九大莊嚴經論卷一五是有名的賢聖住處有人為離越作小居處舊雜譬喻經上傳說罽賓國有離越阿羅漢雜寶藏經卷二疑離越也曾到過大風雪的陀婆國離婆多在北方的罽賓為一極有名的傳說人物瑜伽觀行即由離婆多所傳應與此人有關如解說為離越寺所傳的瑜伽行也許更為恰當然而這還是遠源的聲聞瑜伽彌勒被稱為瑜伽師地論論主無著從兜率天的當來補處彌勒菩薩處得到大乘的瑜伽為從來一致的傳說解深密經的分別瑜伽品也是佛為慈氏彌勒說的這到底是否歷史的事實這可以從三方面說一中阿含經釋尊授彌勒菩薩記為佛教界衆所周知的釋迦會上菩薩然或者以為這實是七百結集中的大德佛滅五百年而大行的大乘當然會與彌勒有關大毗婆沙論卷一五一即有這樣的傳說佛一時與慈氏菩薩論世俗諦舍利子等諸大聲聞莫能解了北印度對於彌勒的信仰極深參看後說傳說末闡提或訶利難陀於陀歷建彌勒像大乘瑜伽者推尊為從彌勒而來可作為佛教傳說中的事實二從瑜伽師禪師的傳授說罽賓確還有彌勒菩薩彌勒為姓姓彌勒的大乘行者都可以稱為彌勒菩薩的大智度論卷八八說罽賓國彌帝力利菩薩手網縵在大智度論傳譯以先道安即從罽賓的學者得來傳說如婆須蜜集序說彌妬路彌妬路刀利及僧迦羅剎適彼兜率天宮斯二三君子皆次補處人也序說的彌妬路即共信的兜率天的彌勒彌妬路刀利無疑的即是大智度論的彌帝力利考薩婆多部師資記目録出三藏記集卷一二在舊記五十三人中二十三師為彌帝利尸利齊公寺所傳中地位相當的有沙帝貝尸利沙為彌字草書的誤寫貝為麗字的殘脫所以這位彌帝麗尸利禪師即大智度論的彌帝力利道安序的彌妬路刀利力與刀都是尸的誤寫這位罽賓大禪師菩薩應名彌帝尸利即慈吉祥羅什在長安時有婆羅門傳說鳩摩羅陀自以為彌帝戾已後罕有其比中觀論疏卷一彌帝戾也即是這位菩薩瑜伽師依薩婆多部師資記為馬鳴以後龍樹以前的禪師這位可略稱為彌帝戾菩薩的瑜伽師傳說如此普遍又為經部譬喻師日漸大成期的大德可能與大乘瑜伽的彌勒有關三上升兜率問彌勒在無著的心境中應該是禪觀修驗的事實在西元四五世紀上升兜率見彌勒在罽賓是極為普遍的如梁高僧傳說佛陀跋陀羅暫至兜率致敬彌勒卷二又羅漢比丘為智嚴入定往兜率宮咨彌勒卷三法顯所得的傳說陀歷國昔有羅漢以神足力將一巧匠上兜率天觀彌勒菩薩佛滅三百餘年法顯傳漢譯惟曰雜難經說世友難羅漢經羅漢上升兜率問彌勒這可見無著的上升見彌勒並不太離奇至於說無著請彌勒下阿瑜陀國為無著說十七地論這在晚期的祕密瑜伽行中悉地成就本尊現身說法也是衆所公認的修驗的事實從無著世親學系的傳說中對於彌勒的教授瑜伽師地論是一致無疑的這三者可能並不矛盾兜率天有彌勒菩薩的敬仰罽賓有大瑜伽師彌勒尸利的教授在傳說中合化加深了彌勒瑜伽行的仰信屬於北方佛教的大乘聖典關於緣起與瑜伽的都傳佛為彌勒說這應該是有歷史內容的般若經到北方後分也有彌勒論法生長於罽賓的無著專修彌勒瑜伽大乘唯識無境的空觀得到面見彌勒咨決深義的證驗瑜伽師地論即在這一連串的彌勒中得來七祕密瑜伽師祕密瑜伽可說是咒師派的瑜伽行這不但是北印的然罽賓區的烏仗那禁呪為藝業西域記卷三多氏佛教史二二二說僧護羅睺羅跋陀羅的再傳弟子約與世親同時以前祕密法都還是祕密流傳烏仗那人每有修得持明的咒師與烏仗那的關係是應該重視的在祕密瑜伽的隆盛中罽賓瑜伽師也是極重要的如善無畏是烏仗那人傳說為即是龍智羅睺羅跋陀羅的再傳的達磨毱多玄奘即與他相見於健陀羅東面的磔迦健陀羅應為烏仗那出大日經供養法勃律相傳為密典傳來的故鄉無上瑜伽的時輪金剛所傳的香跋拉國實即是健陀羅北方的商彌王國無上瑜伽的雙身法據隋闍那崛多所譯的大威德陀羅尼經北方已有流行但還被評為此是因緣滅正法教與大族王罽賓滅法有關罽賓瑜伽師的密咒化為瑜伽師末後的一著罽賓的瑜伽師次第發展是論師經師禪師的次第代興是由小而大由顯而密從淨持律儀心物平等向唯心的神祕的欲樂為道而邁進
