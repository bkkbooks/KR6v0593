body:
  text: 密教之興與佛教之滅印度之佛教第十七章一祕密思想之濫觴佛元八世紀以降祕密教日見風行以身語意三密相應行求得世出世之成就果也密咒遠源於吠陀之咒術信咒語有神祕之能力藉表徵物與咒力以利用神鬼精魅俾達其目的表徵物及密咒乃至身體之動作常若有神力於其間者咒法之作用分息災咒詛開運或加幻術為四類此與祕密教之息災調伏增益大致相同原印度文明以梨俱吠陀為本次組織補充之成為沙磨吠陀夜柔吠陀二吠陀是三者雖崇事神權而末流成祭祀萬能意象尚稱高潔總名之曰三明別有阿闥婆吠陀以咒術為中心乃鬼魅幽靈之崇拜用以適應低級趣味者釋尊出世斥婆羅門三明而猶略事含容於咒法幻術則拒之惟恐不及雜阿含經云幻術皆是虛誑法令人墮地獄巴利藏之小品三明釋塔尼波陀經並嚴禁之其後阿含毘奈耶間有雜入然見於現存經律者以治病為主佛滅二百年分別說系之法藏部推尊目連盛說鬼神始傳有咒藏之說大乘佛教與祕密無必然之關係然大乘佛教之興起則確予祕密思想以活躍之機大乘仰聖者功德之崇高昔之世出世善並由自力以致之者今則佛力無量菩薩願大他力加持之思想乃勃興菩薩遍入六道龍鬼夜叉中自應有菩薩存在而佛弟子之編集遺聞融攝世俗既以魔王及外道師宗多菩薩之示跡又以天龍夜叉之護法而謂傳自夜叉或龍宮魔王外道天龍夜叉與菩薩同化之傾向日益顯著如梵童子之與文殊因陀羅之與普賢摩醯首羅天成佛之與大自在天其顯例也其中尤以夜叉為甚夜叉本為達羅維荼民族之神群佛世傳有金剛力士護佛密迹經即謂其為大菩薩以護持千佛之佛法而示現夜叉者說十地經之金剛藏亦夜叉之一大智度論謂夜叉語音隱密雜亂不易知此與密咒之密有關夜叉手執金剛杵金剛乃常住不壞之寶物因與真常論特相契合自中印法難安達羅王朝之文化大啟大乘由此而勃興夜叉即於此菩薩化後之傳密法者謂龍樹開南天竺鐵塔見金剛薩埵而後傳出密典多以祕密主或金剛手為當機者其間之關係固顯然可見也大乘佛教之演化為密教雖千頭萬緒而菩薩與外道龍鬼夜叉之合化為一特要之因素也般若經華嚴經之字門陀羅尼亦予祕密法以有力之根據大眾部苦言能助開音聲佛事之始至字門陀羅尼則藉字母之含義聞聲思義因之悟入一切法之實相如阿字是無義不義聞唱阿字即悟入一切法本不生性此深受婆羅門聲常住論之影響也其初猶以此聞聲顧義為悟入實相之方便繼則以文字為真常之顯現以之表示佛德及真常之法性矣以此昔之密咒用以為息災調伏增益後則以密咒為成佛之妙方便阿字本不生固為其重要理論之一龍鬼神祕之思想雖逐大乘道而漸盛然初期大乘經中助佛揚化及受化者多為人身菩薩猶以入世利生深智悟真為本此期之經典密咒之成分漸多然多用以護持佛法未視為成佛之道且此項密咒亦多後代增附之如般若經本無咒雖說是大神呪是大明呪是無上呪是無等等呪是一切呪王實以喻讚般若之特尊後人集出相應品要成般若心經則加以即說咒曰云云法華經本無咒而囑累品以後之附編者有陀羅尼品仁王經理趣經本無咒唐譯則有凡此皆足以見初期大乘之猶未太濫也密教亦稱瑜伽教與瑜伽者之關切特深詳解脫之道唯八正道即三增上學以正見正思之慧學為眼目以正語正業正命之戒學為足必心懷明潔行止無瑕而後以勇猛精進心因正念以入正定定學止觀相應乃得斷惑證真斷證有賴於禪定而佛法不以禪定始亦不以禪定為尚取其攝心明淨而已否則離戒慧以入禪未有不落魔外蹊徑也佛世言禪定推二甘露門此皆印度常行之禪法而佛資以為攝心之門初以不淨觀厭心切者多自殺乃教以安般念即以調息為方便而繫心入定風脈等瑜伽即此安般之餘而戀世心切者末流乃與方士家言合轍靜居入禪其戒行不淨慧眼不明動機不正或不善用心者常有種種身心病生有種種可喜可怖境界現前正本清源莫如戒慧或者不務本而逐末懸聖賢像善神像燒香散華以求護衛者有之論宿曜吉凶時日祥忌山水利害以求解免者有之藉咒力表徵物請護法神以驅鬼魅者有之禪病日深神祕之風日熾昔佛之世弟子以不見佛為苦夜行獨居而有怖畏者佛嘗教以念佛念天念佛陀之智慧慈容或念行善者必昇天我既行善復何所畏以此強其意志慰其脆弱之心禪者怖畏多念佛乃為其要行發為念佛三昧不僅念佛之悲智而多念佛之相好住處之莊嚴淨土求於此三昧中佛為現身說法所念者不僅佛陀諸菩薩亦為觀想之境殆佛與天混融之勢成觀想夜叉等為本尊而求成就之密法乃出瑜伽師初出虛妄唯識論又伴真常唯心論而大出密法南北瑜伽者合流三密瑜伽之教乃盛行矣二祕密教之傳布祕密法雖逐大乘而起然獨立而成所謂呾特羅乘則遠在其後密乘學者欲託古以自厚乃謂昔已有之且大弘於龍樹於佛教名德如提婆無著輩莫不引以為密乘大師傳說之紛雜亦已極矣西藏傳密乘有事部行部瑜伽部無上瑜伽部四部我國舊傳之密乘而流入日本者有胎藏金剛二大部此二與行部瑜伽部相當無上瑜伽部後出始弘於波羅王朝趙宋曾略出數部間有被禁不行者事部則與日本所謂二大部外之所謂雜密者大同自理論言之胎藏界明本具之真常心性金剛界則詳於真常本淨性之修顯並與真常唯心論之大義合雜密則罕言理性其修無相瑜伽亦即妄以明空不與天色身觀相合真常之色彩不深言組織雜密常聚佛菩薩鬼神於一堂未若胎藏界等組織嚴密秩然有序其行法中結壇場重供設誦咒結印詳於事相而略觀想其觀想本尊則召請一外來之本尊而觀之修畢則送之還未直觀自身即佛也大都如此於祕密教之發展中事部乃其未臻圓熟之初型其流出實先於真常唯心論之盛行佛元七世紀之末晉永嘉中帛尸梨密多羅即以善持咒術稱來華譯出孔雀明王經灌頂神咒經矣初期之雜密與北印之瑜伽師有關西域記謂北印烏仗那人特閑禁呪秣底補羅亦以深閑呪術著稱西藏傳僧護以前祕密法不無流行烏仗那人多有得持明位者初期來華傳譯密典與精閑咒術者多北印及西域之龜茲人龜茲之帛尸梨密多羅善持咒術無論已佛圖澄姓帛再到罽賓亦善誦呪役使鬼神餘如北印菩提流支之兼工咒術烏場即烏仗那之那連提耶舍健陀羅之闍那崛多且於隋世廣出咒典沿雪山而住之瑜伽師內有所見於定境外有所取於民俗之咒術以之自護以之教他事部乃漸行密乘之流布常途多託始於龍樹其初指大日經而言請一論龍樹師資之傳承什公來華惟傳龍樹提婆青目等之傳承不明付法藏因緣傳謂提婆弟子羅睺羅真諦傳羅睺羅以常樂我淨釋八不性空者之轉入真常可考見者自此人始西藏傳羅睺羅弟子有龍友龍友弟子僧護龍友之與龍樹傳說頗為紊亂龍友之師為羅睺羅跋陀羅俗乃傳龍樹之師亦為羅睺羅其訛傳蓋可想見又傳說與提婆同時有本名如來賢而稱為龍叫即楞伽經中之龍猛者弘傳唯識中道龍友龍叫與龍樹之傳說相雜而有龍樹傳密之說以各種記載觀之龍友弟子僧護時行部始顯然流行於世有龍智者傳為龍樹弟子或言玄奘於北印磔迦國所見之長壽婆羅門即龍智其人略後勝天弟子毘流波月稱弟子護足亦從龍智學唐開元來華之三大士並自稱受學於龍智密學之盛與此老關係之深可以見矣龍智年壽極長傳出龍樹殆即龍友或龍叫弟子歟事部乃咒法發展之雛形其融攝真常之深理以三密為行法組成事理圓具之密典疑即龍叫龍智其人行部之流行較早以菩提心為因大悲為根本方便而至究竟三句義為大本明十緣生句頗類於般若經之說然菩提心指自心本具真常性德方便則多明隨機適化之行可謂真常化之般若也瑜伽部之金剛頂經明五智成身蓋後於唯心論之盛行行部瑜伽部之流行已漸自北印而移入南中後期之性空者佛護清辯弘法於南印並轉入密乘西域記謂清辯入那羅延窟實即學密之謂中印之月稱智藏下至靜命蓮華戒亦無不學密無著學系之遊化南中者如陳那護法法稱輩西藏並傳其與密有緣唐代來華之傳譯密典者亦以南印尤以中印度為多蓋時祕密之思潮立本於真常唯心圓融祕密他力頓成融性空與唯識之學而無所不可空有之交諍僅供祕密者之莊嚴而已初無所偏於二家其力崇中觀則以龍智而下性空者多入密有以致之行部與瑜伽部之成立在融攝世俗邊可謂佛梵之綜合此於胎藏界金剛界之曼陀羅可知惟其中有可注目者即以在家菩薩天人形之大日如來為中心以金剛手等護翼之釋迦及阿羅漢等則退列於外圍蓋以密者之見印度之群神自其本地言之並佛菩薩之示現為大日如來之內眷屬大眷屬應化身之釋迦及其眷屬轉望塵而莫及以在家菩薩為中心本大乘佛教必至之勢顯教之文殊淨名以及諸大菩薩無不有越出家聲聞眾而上之之概惟祕密者以在家佛教之立場不能發為入世濟眾之行而融合世俗之神教猶敢輕究竟之解脫道唱釋迦不得成就請教於天上之大日如來而後能證入之說不能無感於尊卑之倒置耳舊傳羅睺羅跋陀羅即婆羅門學者娑訶羅而龍智亦一長壽婆羅門此時之佛教常以佛化之婆羅門學者為其先導其精神固已非僧非俗亦佛亦梵矣雖然行部與瑜伽部猶以人形之大日如來為中心也次以密乘行者於胎金之圓融大法界中特契於金剛明王以大貪樂為攝引大忿怒為折伏大貪大瞋而大慢觀自身即本尊而修之其中心之崇拜為羅剎夜叉求其如大日如來之人形亦不易得矣於此吾人於古人之心境似應有所諒解也印度為神之世界一切在神祕氛圍中初以佛教之行而少衰中印法難後又漸復其繁榮佛教以大乘入世之融攝多少傾向於他力迨笈多王朝興婆羅門學者以梵我論為本予人格神以論理之根據增強溼婆毘紐梵天之信仰下至一切世俗迷信無不兼收並蓄蔚成時代潮流以反吠陀而興之佛教對此能無切身之感乎聲聞之解脫行不足以應群機亦不足以暢佛懷入世之菩薩行雖理論已極於性空緣起而菩薩僧之不立政教形勢之限制亦難以成入眾利濟之行大乘唯有趨於隨機適應專精禪思發通以濟眾之途自性空以入形而上之妙有自力以入他力緣起以入唯心無神而入有神固有意無意而開始轉變者馴致形成梵佛之綜合一反根本佛教之精神然創始轉化者似未嘗不知之解深密經明說為五事不具之鈍根說依他自相有楞伽經明真常唯心而謂言心起眾相開悟諸凡夫若說真實者彼心無真實大日經明祕密法而謂劣慧所不堪兼存有相說古人非不知之特欲以此為方便攝世俗以向佛耳其如始簡終鉅真常唯心神祕之說與生死心積習相應乃一發而不可收拾也前三部之流行笈多朝以來三百餘年事也若無上瑜伽則後弘於波羅王朝自伐彈那王朝傾覆中印大亂佛教之勢轉衰有波羅王朝興佛教乃賴以偏安五百年而成一異樣之繁榮東方有瞿波羅王起而統一藩伽羅國西取摩竭陀等地創波羅王朝王朝相承凡十八世夜叉波羅王為大臣羅婆斯那所篡王朝遂亡此十八世五百年間崇信佛法歷世不替其尤竭誠護持者凡七世稱波羅七代七代中第四世達摩波羅王時國力最盛曾擴展至曲女城於佛教之護持亦最力王於那爛陀寺附近建歐丹多富梨寺又於北近建毘玖摩羅尸羅即有名之超岩寺道場百八規模宏大視那爛陀之八院三百房而過之遂奪那爛陀之席而超岩成最高之學府矣於此波羅王朝一類無上瑜伽初非人間所有者始由密乘學者次第傳出初有毘流波者出那爛陀座主勝天之門後從龍智學而得悉地自後曇毘醯流迦婆日羅犍陀等相繼得道又有婆婆波婆羅波俱俱囉羅闍喜金剛等出並弘瑜伽及無上瑜伽五部如集密歡喜金剛明點幻化母閻摩德迦等均先後流布及喜金剛弟子檀毘醯盧迦又傳來佛頂輪救度母輪等無上瑜伽已大體備矣佛元十二世紀後期達磨波羅王在位建超岩寺密乘之勢益盛王於現觀莊嚴派之獅子賢弟子智足特加欽崇而密乘與隨瑜伽行之中觀師相涉乃益深智足遍弘前三部及五種內道呾特羅於集密之解釋尤工然與護足之舊傳有異集密因有所謂龍猛傳及智足傳之兩大流也繼智足而為超岩寺主者有然燈賢等十一人通稱調伏法呾特羅阿闍梨蓋皆維持智足之統專弘勝樂閻摩明點歡喜金剛集密等無上瑜伽者超岩外之密乘學者亦不少如寂友之通前三部覺密覺寂之通前三部而特精瑜伽部皆其著者第七世摩醯波羅王時毘覩波始傳來時輪金剛其徒時輪足弘之密乘之學發展至至矣盡矣十一世茶那迦王之時名德濟濟超岩極一時之盛有六賢門出六賢門者東則寶作寂南則智生慧西則自在語稱北則那露波次以覺賢中則寶金剛及智吉祥友六賢皆博曉五明專弘密乘於無上瑜伽之勝樂尤所致意其後座主之佼佼者有阿提峽師資那露波師資等以十七世羅摩波羅王朝之無畏現護為斯學之殿軍王朝多故教界落寞餘勢已奄奄欲息矣綜觀祕密教發展之勢即鬼神崇拜而達於究竟事部本為次第錯雜之傳出後人嘗董理而統攝之分佛部上蓮華部中金剛部下之三部佛部以釋迦為部尊文殊為部主蓮華部以阿彌陀為部尊觀世音為部主金剛部以不動為部尊金剛手為部主雖意在融攝鬼神而尊卑之勢猶存此三部就其所重而言之則佛部為解脫相之佛蓮華部為慈悲相之菩薩金剛部為忿怒相之鬼神世人之所崇事唯此三類而已此亦即以釋迦文殊之大乘深智融西北方彌陀觀音之慈悲柔和東南方不動金剛手之方便雄猛也行部承之綜合為三部然佛部之釋迦轉化為在家菩薩天人相之大日如來祕密教為之一變化出家佛為在家佛以為重人可以之為重天尤當其曼陀羅中臺作八葉蓮華形以象心中為大日如來四方為四佛瑜伽部即五方五佛說而開為五部如來寶蓮華業金剛其曼陀羅依月輪心中五智成五佛一一出三輪身即以大日中不動東寶生南彌陀西不空北五佛為自性輪身普賢文殊虛空藏觀自在金剛業五菩薩為正法輪身不動金剛降三世軍荼利六足即閻摩德迦大夜叉金剛五大明王為教令輪身行部以三而啟五瑜伽部明五以含三以如來部為最勝而如來為在家菩薩形僧俗之形雖倒人鬼之敘未失也嗣以學者特重金剛之調伏乃流出集密勝樂閻摩等無上瑜伽然諸部獨立頗有無統之感或謂五部統以金剛持之第六部即以金剛持為最勝亦即離去天人相之菩薩而以鬼神夜叉之忿怒身為所崇祕密教又一變或謂波羅王朝時國難教難相逼俱來故特重金剛之雄猛法以制之教法當機義或近之雖然國難教難五大金剛其能救之乎事部解脫之佛陀主攝外行部悲和之菩薩主融外鬼神崇拜之密教瑜伽部無上瑜伽部貪瞋之鬼神主同外三祕密教之特色密教多特色承固有之傾向而流於極端者有之融攝外道者有之若以一言而罄無不盡者則以世間心為解脫是已信師長達於極端即自身妻女亦奉獻而不疑師命之殺不敢不殺命之淫不敢不淫此婆羅門所固有讀央掘魔羅經可知後期佛教所取用者也佛斥外道之事火而教以事根本火供養父母居家火供養家屬等密乘學者又轉而事火護摩求子求財求壽求官一切無不於火中求之而酥蜜衣服珍物悉舉以供火之一炬將以求其大欲也佛世以依教奉行為最勝之供養佛後亦供以燈明香華等而已密教以崇拜者為鬼神相其供品乃有酒肉有所謂五甘露者則尿屎骨髓男精女血也更有五肉者則狗肉牛馬象及人肉也以此等為供品而求本尊之呵護亦可異矣且置此等瑣屑事試一言其要義一心餘力絀之天慢密教以修天色身為唯一要行念佛三昧之遺意也自佛天合化佛菩薩既示現天神身龍鬼夜叉亦多天而實佛菩薩之示現觀此天等之相好莊嚴此自世俗假觀來觀身實相觀佛亦然觀己身天即佛之示現身之實性此自勝義空觀來此二觀初或相離而終復合一以身語意三密修之即手結印契口誦真言意觀本尊之三昧耶或種子或本尊之相好求佛天加持而有所成就若直觀佛相觀成而佛為現身說法顯教大乘亦偶有之然祕密者意不在此雖或前起本尊而要在信自己為本尊觀己身為本尊本尊入我中我入本尊中相融相即而得成就天慢者即以佛菩薩自居此由他力念佛之渴望救護自力念佛之我佛平等極卑極慢之綜合而以三密行出之一切法真常本淨不應妄自菲薄應有堅強之天慢自身即佛而未嘗不自感其無能乃唯求本尊之三密加持質言之信得自身即佛而求諸佛三密加持力以實現之此與初期大乘經論信有成佛之可能而但可於智深悲切之大行中得之精神之相去遠矣祕密者修天慢而即身成佛如乞兒以富有自居衣食不給乃卑辭厚顏以求富翁之賜予俾與富人共樂耳何慢之有二厭苦求樂之妙樂出家聲聞弟子視五欲如怨毒以淫欲為障道法固非在家弟子所必行然以性交為成佛之妙方便則唯密乘有之先以欲鉤牽後令入佛智大乘攝化之方便方便云者且以此引攝之非究竟亦非漫無標準也或者謬解以樂得樂乃一反佛教之謹嚴樸質欲於充滿欲樂中成就究竟佛果之常樂欲界欲樂中淫樂最重或者乃以此為方便且視為無上之方便惟是淫欲為道密宗之舊傳我國而流入日本者猶未嘗顯說故每斥無上瑜伽之雙身法為左道密教然特弘無上瑜伽之西藏喇嘛則矜矜以妙法獨備於我已平心論之此即欲為方便之極端固於前三部見其緒矣所崇事者天身之佛天有明妃天后佛亦仿之而有佛母明妃此即與方便悲行為父般若智慧為母之大乘義相雜金剛以表雄猛折伏蓮華以表慈和攝引亦一轉而為生殖器之別名密教所崇事之本尊無不有明妃事部則彼此相顧而心悅行部則握手瑜伽部則相擁抱無上瑜伽則交合此固順欲界欲事之次第而成立者前三部雖有相視相抱事而行者每以表悲智和合等解之然無上瑜伽則付之實行衡以密者之說則三昧耶為表象法為觀想業為實行固表象獨是而觀想實行之非耶以祕密教之發展觀之固不達此不止吾人以祕密教為佛之梵化神化則可尊信前三部而不信無上瑜伽則不可何有智者譽病入膏肓為健康而歸死亡之責於臨終一念也無上瑜伽者以欲樂為妙道既以金剛蓮華美生殖器又以女子為明妃女陰為婆伽曼陀羅以性交為入定以男精女血為赤白二菩提心以精且出而久持不出所生之樂觸為大樂外眩佛教之名內實與御女術同凡學密者必先經灌頂其中有密灌頂慧灌頂即授受此法者也其法為弟子者先得一清淨之明妃引至壇場弟子以布遮目以裸體明妃供養於師長師偕明妃至幕後實行和合之大定弟子在外靜聽之畢上師偕明妃至幕前以男精女血甘露即所謂菩提心者置弟子舌端據謂弟子此時觸舌舌樂及喉喉樂能引生大樂云以嘗師長授與之祕密甘露名密灌頂嘗甘露味已去弟子之遮目布為師者以明妃賜與弟子指明妃之婆伽而訓弟子曰此汝成佛之道場成佛應於此中求之並剴切誨以一切令其與明妃智慧入定引生大樂此即慧灌頂歡喜金剛云智慧滿十六以手相抱持鈴杵正和合阿闍黎灌頂即此也經此灌頂已弟子乃得修無上瑜伽其明妃可多至九人云西藏宗喀巴似有感於此道難行故於無上瑜伽之雙身法自灌頂以至修行多以智印即以觀想行之然餘風猶未盡也解脫是所求欲樂不欲棄厭苦求樂而不知樂之即苦乃達於淫欲為道或云印度有遍行外道於性交為神祕之崇拜佛教之有此欲用以攝此外道也三色厲內荏之忿怒應折伏者則折伏之菩薩之行也密乘行者特於無上瑜伽其崇事之本尊無不多首多手多角腳踹口咬烈焰熾然兵戈在握雖善畫鬼者亦難設想其可畏也然以予視之大丈夫一怒而安天下猶非面目猙獰之謂而況菩薩之雄猛乎龍樹菩薩引偈云若彩畫像及泥像聞經中天及讚天如是四種諸天等各各手執諸兵仗若力不如畏怖他若心不善恐怖他是天一切常怖畏是故智人不屬天力不如則失雄威心不善則失慈悲其不堪崇事固明甚也密乘者以學出龍樹自居而以猙獰之天形為所崇不亦可以已乎總之祕密者以天化之佛菩薩為崇事之本以欲樂為攝引以猙獰為折伏大瞋大貪大慢之總和而世人有信之者則以艱奧之理論為其代辯以師承之熱信而麻醉之順眾生之欲而引攝之耳察其思想所自來動機之所出價值之所在痼疾其可愈乎四印度佛教之衰亡佛元八世紀以來佛教外以婆羅門教之復興於具有反吠陀傳統之佛教予以甚大之逼迫內以唯心真常圓融他力神祕欲樂頓證思想之泛濫日與梵神同化幸得波羅王朝之覆育乃得一長期之偏安然此末期之佛教論理務瑣屑玄談供少數者之玩索實行則迷信淫穢鄙劣不堪可謂無益於身心無益於國族律以佛教本義幾乎無不為反佛教者聞當時王舍城外之尸林中密者於中修起屍法可以害人者即為數不少佛教已奄奄一息而又有強暴之敵人來佛元十四世紀初阿富汗王摩訶末率軍侵略印度佔高附而都之回教漸滲入印度內地相傳侵入者凡十七次每侵入必舉異教之寺院而悉火之佛教所受之損害可想見也於是恆河閻浮河兩岸西至摩臘婆各地之佛徒改信回教者日眾其佛教僅存之化區惟摩竭陀迤東耳迨波羅王朝覆亡回教之侵入益深漸達東印金剛上師星散不久王室改宗歐丹多富棃寺及超岩寺先後被毀即僅存之那爛陀寺亦僅餘七十餘人佛教滅跡於印度大陸時為佛元十六世紀佛教興於東方漸達於全印次又日漸萎縮而終衰亡於東方吾人為印度佛教惜然於後期之佛教未嘗不感其有可亡之道也
