body:
  text: 中國佛教與印度佛教之關係佛教從印度傳來在中國文化史上有著輝煌的業績創開了隋唐的佛學時代啟發了宋明的理學時代一直到現在佛書部帙的龐大寺院佛像的普遍對於社會心理及文化因素還是有著重要的地位中國佛教的值得尊重值得提倡發揚應該是每一中國人所有的責任中國佛教就是二千年來流行於中國的佛教其中有兩大類一是印度傳來中國的佛教一是經過中國佛教徒的研求修習發展為獨到體系的佛教如台賢禪淨我們應該發揚中國特有的佛教但佛教到底是從印度傳來的所以也應研究印度傳來中國的佛教惟有從這兩方面去研習闡揚對於中國佛教的特長才能有正確的認識對於現代的中國佛教才能有所補益因為許多固有的法寶被我們遺忘了對於國際佛教思想界的協調才能得到恰當的方針本文略說有關印度傳入中國的佛教想從印度佛教的完整體系中理解傳入中國佛教的地位對於在中國發揚完成的佛教淵源給以簡要的敘說一印度的三期佛教總說佛法的真義當然是超越時空的但自釋迦佛證覺說法以來起初是流布於印度後來又傳入中國佛法既活動於現實的時空中義理教典宗派制度等便為時空所局限中國所承受於印度的佛教自然也有時代與區域的關係印度佛教從佛陀初轉法輪起到回教侵入東方而衰滅西元一二年頃止約經歷了一千六百多年末後的二百年波羅王朝晚期以後印度佛教已瀕臨衰亡邊緣在此以前雖或興或衰大體上都有獨到的發揚這一千五百年的印度佛教史太虛大師分之為三個時期每期大數五百年第一個五百年約當西元以前為小行大隱時期佛滅不久佛教界開始結集聖典到阿育王時四阿含經與廣律大體凝定為佛教界所公認四阿含法義的闡揚佛弟子有了不同的論義分為舍利弗的阿毘曇系上座部所本迦旃延的蜫勒系大眾部所本由於阿育王的信佛及推動國際布教運動使佛教向印度的東南與西北發展促成佛教部派的急劇分化阿育王時代大眾部與上座部說一切有系以外還有源出上座而多少接近大眾部的分別說部當時盛行於中印度中國古代傳說優波毱多與阿育王同時以後有五部盛行而五部中的化地法藏飲光三部都屬於分別說系錫蘭傳說阿育王子摩哂陀傳佛法入師子國今錫蘭是屬於分別說的赤銅鍱部此期的聖典與學派以聲聞道的阿羅漢果為終極被稱為小乘教西元前一八年頃熏迦王朝採取排佛的措施中印的政教漸衰東南印與西北印的佛教日趨於發展西元前大乘佛教還在潛流與待緣興起的階段所以稱之為小行大隱第二個五百年一五世紀為大主小從時期大乘以菩薩道為主以成佛為標極到西元初大乘顯著的流行起來大乘經中每說佛滅四百年後佛滅後五百年大乘經才弘佈人間這可以說是信史西元前二七年中印度的王朝覆亡而南方的安達羅王朝北方的貴霜王朝代之而大盛大乘就是與此同時而勃興的佛教西元三二年旃陀羅笈多建笈多王朝於中印度與此同時大乘也有了新的發展試分經與論來說當貴霜與安達羅王朝時代初期傳出的大乘經如般若經十地經維摩經法華經等大多為源出於東南而集成於西北以一切法空為究竟了義的笈多王朝為有名的梵文學復興印度教復興的時代與此氣運相呼應的大乘教又傳出大般涅槃經大法鼓經勝鬘經楞伽經等這是以一切法空為不了義以如來藏佛性真實不空唯心為究竟的教典從論典來說安達羅王朝的龍樹弘法於西元二世紀宗性空大乘作般若經與華嚴十地經的釋論中論最為著名成為中觀大乘空宗的始祖無著與世親三四四四生於笈多王朝的盛世在大乘不空唯心的基石上攝取一切有系有部及經部的精英而闡揚唯識宗有宗著了很多的精嚴的論典大乘經與論同樣的有先空後有的發達程序依佛教的實情來說大乘雖然勃興傳統的小乘佛教還保有廣大化區與眾多信徒只能說大小並行然從印度佛教的思潮來說此第二個五百年實以大乘佛教為主流所以稱之為大主小從第三個五百年為密主顯從時期大乘與小乘顯教雖依舊流行而時代的佛教屬於祕密教西元五世紀末笈多王朝分化而衰落了北印因嚈噠的侵襲佛教受到空前的損害中印興起的伐彈那王朝六七世紀間護法有名但國力有限國祚也不長中印與南印的佛教由於印度教的隆盛日漸衰落下來西元六六年瞿波羅王在恆河下流創建波羅王朝雖局促於東方卻維持了佛教一期的隆盛這便是密教領導的時代密典的傳出起初是事部雜密行部胎藏界瑜伽部金剛界其後又有無上瑜伽部傳說為龍樹的弟子龍智長壽婆羅門難陀都是此期密乘的重要大師達磨波羅王七六六八二九建超岩寺規模弘大為祕密教的重鎮到磨醯波羅王時八四八八九九毘覩波傳出了時輪金剛密教才算完備了此後只是維持餘勢而已從印度三期佛教來看中國佛教就明白中國佛教不同於錫蘭又傳入緬泰不同於西藏又傳入蒙滿有著時代的關係一中國佛教的最初傳入早在漢明帝以前但有弘化的事跡可考佔有中國佛教的一頁者要算漢桓帝時代一四七一六七的安世高與支婁迦讖為最早此時印度正是大小並行大乘為主的時期所以中國沒有錫蘭那樣有過專弘小乘時期而造成小乘佛教深固的根柢中國是一開始便是大乘為主小乘為從的局面雖也偶有偏宗小乘的如僧伽提婆四世紀末說無生方等之經皆是魔書雖大量譯傳阿含經廣律阿毘曇論而大乘始終為中國佛教的重心中國佛教主要為印度的中期佛教從支婁迦讖的傳譯經竺法護三世紀後半而到鳩摩羅什的四一來華都著重於大乘經論的傳弘所傳譯的大乘經可說都是龍樹大智度論所引用過的性空大乘經論典還只是龍樹及弟子提婆的作品略後中國所譯傳的有一顯著的不同如曇無讖四一六頃的大般涅槃大雲經佛陀跋陀羅四二頃的如來藏經求那跋陀羅四四頃的楞伽經深密經勝鬘經大法鼓經等經菩提流支五一頃等的楞伽經十地經論真諦五六頃的攝大乘論釋等波羅頗迦羅六三的大乘莊嚴經論玄奘六五前後的大量論典這都重在龍樹所不曾引用過的真常大乘經與無著世親系的唯識論這一先性空經論而後真常唯心經論的次序印度與中國完全一致二印度後期佛教的主流密教屬於事部的東晉以來多少雜亂的傳出唐開元四年七一六善無畏來傳大日經行部開元九年七二一金剛智來傳金剛頂經瑜伽部號稱兩部大法其實還只是前期的密典不久唐代衰亂佛教的傳譯也就停頓了直到趙宋開國九六國運復興五六十年中又有梵僧東來但大抵來自佛教久衰的北印不是密乘重鎮的東方所以雖傳譯密典也有屬於無上瑜伽部的但不能影響中國佛教宋代的譯經不過編入大藏經而已無上瑜伽不曾弘通於中國除元代晚唐的衰亂為一主要原因這與西藏恰好不同佛教的最初傳入西藏已是西元七世紀中印度早是密乘勃興的時代了西藏所傳的為印度後期密主顯從的佛教中國是中期佛教大主小從含得初期與後期的一分二罽賓中心的佛教區釋迦佛時佛教本只流行於恆河兩岸律典稱此為中國阿育王時代佛教向南北擴展南方到達磨醯沙漫陀羅婆那婆私又越過大海傳入錫蘭成為分別說系赤銅鍱部的化區北方到達罽賓又擴展到西北及東北錫蘭罽賓及以北地區回教侵入為止不屬於印度而文化是印度佛教化的在當時南北都還是初期佛教到五百年頃西元前後印度全境從南到北到處有大乘興起罽賓及以北地區為北方的大乘重鎮南方是東印的烏荼南印的安達羅南憍薩羅都是大乘區錫蘭孤立海中所以雖有大乘傳入而多少保持舊有的傳統北方是大陸相連所以罽賓東北都成為大乘盛行的地方大乘佛教是南北呼吸相通的從發達的情況來說在安達羅與貴霜王朝時大乘是由東南而西北的笈多王朝時南北同向中印會合後期佛教是由西北而流向東南佛教傳入中國的通道主要為陸路越過葱嶺從西北而來由海道而從南方來的到南朝才有重要的地位由於交通的著重陸路所以西北印度罽賓區的佛教與中國佛教的關係最密切尤其是漢魏兩晉時期說到罽賓區漢晉以來一向指犍陀羅烏仗那一帶先是賒迦後是貴霜王朝的政治中心隋唐才以迦溼彌羅及迦畢試為罽賓從此向東是迦溼彌羅支那僕底闍爛陀羅等向西是那揭羅曷迦畢試梵衍那縛喝吐火羅政治中心又從縛喝影響到安息西康居北向北深入山區是烏仗那商彌到達葱嶺的羯盤陀今新疆的蒲犁從羯盤陀向東北是沙勒龜茲焉耆向東是斫句迦于闐這一區域文化的重心是犍陀羅一帶而從佛教來說是以大雪山雪山葱嶺為中心而向東南西三方擴展的葱嶺以東北道的沙勒龜茲等是小乘區而南道的莎車于闐為大乘的教區葱嶺以西吐火羅康居都是小乘教安息也以小乘為主山南烏仗那迦畢試呾叉始羅是大乘重鎮迦溼彌羅卻是小乘在這區域裡犍陀羅是大小並盛的佛教中心佛教傳入中國大家知道初期是安息康居大月氏大月氏在漢代是佔領阿姆河上流統治著大夏的國家但在西元二世紀前後大月氏是貴霜王朝的別名也就是罽賓中心大乘佛教區的王朝所以傳入中國的月氏佛教除早期外實從犍陀羅等來不應該看作吐火羅或縛喝的罽賓區從印度河上流山地到新疆西南山地是著名的禪觀勝地從此發揚出來的佛教有小乘也有大乘初期這裡是屬於阿難系統的重經派由於研經習禪而分化出來的首先是阿毘達磨論師以迦旃延尼子前二世紀的發智論為宗發智論作於支那僕底成為說一切有部以一切有為宗的極端派是大毘婆沙論一系此論集成於迦溼彌羅二世紀中破俱舍論的順正理論論主眾賢四五世紀間也屬於此系溫和些的被大毘婆沙論稱為犍陀羅師或西方師的如品類足論作者西方摩羅的世友前一世紀甘露味毘曇的作者妙音二世紀阿毘曇心論的作者法勝三世紀都是吐火羅人雜心論的作者法救四世紀是犍陀羅人而生於犍陀羅的世親四五世紀間作俱舍論也屬於此系其次發展完成的是經部師譬喻師到鳩摩羅陀而大成二三世紀間鳩摩羅陀是呾叉始羅人後來弘化到葱嶺羯盤陀經部師或譬喻師本為說一切有部的別系如持經者大德法救覺天經部異師世友尊婆須蜜菩薩所集論的作者僧伽羅叉脇馬鳴等都是他們是禪師又是努力弘化的布教師引用種種譬喻本生故事比況來說明經義依西域記釋迦的本生談都指定在犍陀羅呾叉始羅那揭羅曷烏仗那僧訶補羅這就是貴霜王朝的政教中心犍陀羅藝術的發皇地譬喻大師的教化區譬喻大師的作品富有文藝性凡是譬喻大師中國佛教一律稱之為菩薩他們與大乘取協調的態度兼容大乘而決不拒斥的鳩摩羅陀以後經部師向南方弘化世親同時的室利邏多在中印度阿瑜陀作經部毘婆沙經部理論的嚴密化不再像譬喻大師弘法的活力了罽賓中心區的大乘佛教是非常活躍的但沒有弘通大乘的事跡可考除從我國譯經史上推得大乘經論的流通情況外有兩點可為明證一據古代遊歷者的報告北印的烏仗那迦畢試那揭羅曷呾叉始羅新疆的于闐斫句迦都是大乘佛教盛行的地帶中國與印度間隔著千山萬嶺而對於入山專修及遊化的僧眾是能克服來往障礙的以大雪山為中心而延展到南北都是習禪的勝地羯盤陀烏鎩斫句迦山地都有比丘入定久住的記載也是大乘佛教傳通的道場傳說龍樹入雪山從老比丘得大乘經斫句迦山區有大量的大乘經陀歷的山岩中藏有大乘經等都可看出此一山區與大乘佛教的關係二般若經說到後五百年般若經大行於北方大悲經說到弘法於北印的大師華嚴經說到菩薩住處也重在北方還說到于闐的牛角山寺大集經晚譯部分說到從北印經雪山而到達西域今新疆一帶的地理誌這些都可以看出大乘經流傳在這一區域的情形三罽賓中心區的佛教佛教的傳入中國始於漢哀帝時西元前二年景憲從大月氏使者受佛經明帝時六四頃從月氏請來四十二章經這都與月氏有關但那是吐火羅時代的月氏不外乎小乘法門據玄奘所見吐火羅一帶都是小乘教號稱小王舍城的縛喝有豐富的聖跡也沒有大乘的形跡小乘論師妙音法勝來中國譯小乘經的曇摩難提都是吐火羅人可以想見吐火羅是小乘佛教為主的從此向西向北而到安息與康居佛教的情形與吐火羅相近如康居的康巨康孟祥康僧會是漢化的康居人安息的安世高與曇無諦所有的譯典都以小乘為主可見罽賓區的小乘教傳到西方的吐火羅再向安息康居再從吐火羅康居安息越過葱嶺到達西域的沙勒與龜茲據近代的發現龜茲一帶使用吐火羅語早期的小乘教是由此路線而傳入的到東晉的苻秦時代三八頃罽賓的僧侶東來如僧伽跋澄僧伽提婆卑摩羅叉弗若多羅除吐火羅的曇摩難提以外都是犍陀羅一帶的小乘學者他們對小乘三藏開始作大部的翻譯如中阿含經長阿含經增一阿含經十誦律與四分律八犍度論阿毘曇心論雜心論鞞婆沙論等中國佛教史上所見的毘曇學者就是以這些論為主的但中國初期所傳的小乘並非局限於自稱有部正統的大毘婆沙論系反而以西方師譬喻師為多如安世高譯出的修行道地經僧伽羅叉造阿毘曇五法行經世友品類足論的初分心論雜心論曹魏失譯的甘露味阿毘曇都屬於西方系其他如尊婆須蜜菩薩所集論阿育王傳出曜經都是譬喻師宗三法度論屬犢子部也是譬喻者的作品所以從西北印而傳入中國的小乘教可說從來不與大乘相衝突西域記說大乘極盛的烏仗那有五部律四分律譯者佛陀耶舍是罽賓人律序說是曇無德部體大乘三藏小不礙大的罽賓佛教成為中國古代小乘教的特色並深刻影響了中國的大乘佛教罽賓區禪法的傳來是很早的安世高與竺法護譯傳了初期大瑜伽師僧伽羅叉的修行道地經鳩摩羅什來又譯傳婆須蜜僧伽羅叉漚波崛僧伽斯那勒脇比丘馬鳴鳩摩羅陀禪要中國初期禪法是罽賓區譬喻師的禪法譬喻師是不障礙大乘的羅什也就附出法華彌陀法身等禪觀流傳在中國北方此外專修禪法的罽賓禪匠在西元四世紀勃興第三代的佛大先又譯佛陀斯那卒於四一頃是最傑出的禪師佛陀跋陀羅與沮渠京聲學得而傳來中國佛大先的禪法有新從天竺達摩多羅傳來的頓禪罽賓一向傳習的是漸禪但佛陀跋陀羅傳出的禪經只是二甘露門的漸禪所以也是大小協調的如佛陀跋陀羅譯有觀佛三昧海經沮渠京聲譯有觀彌勒經觀世音經接著罽賓禪師又四二四來了曇摩密多譯傳觀虛空藏菩薩經觀普賢行法經觀無量壽經畺良耶舍四二四來譯有觀無量壽佛經觀藥王藥上二菩薩經這可以看出那時的罽賓禪者已轉重於大乘禪觀近於密宗的修天色身了因當時中國的北方衰亂這後起的罽賓禪法流傳在江南初期傳入大乘佛教的大師主要為月氏的支婁迦讖及支道根支疆梁接等原籍月氏生長燉煌曾遊歷西域的竺法護弟子有聶道真竺佛念等原籍印度生長龜茲曾遊學罽賓的鳩摩羅什他們的譯籍可以看作大月氏貴霜王朝時代的大乘佛教主要的佛典如華嚴經的十住品十地品與入法界品寶積經的寶嚴經與阿閦佛經阿彌陀佛經的淨土經大集經的般舟三昧經等法華經維摩經首楞嚴三昧經等最重要而引人重視的是般若經的大品與小品初期大乘經的譯傳雪山東北的斫句迦與于闐是值得重視的朱士行二七前後到于闐求得大品般若後由于闐沙門無羅叉譯出支法領西遊四一頃在于闐求得華嚴經後由佛陀跋陀羅譯為六十卷就是唐代新譯的八十華嚴梵本也還是從于闐得來的支法領所得的不止華嚴經一部羅什曾譯出一部分曇無讖譯的大般涅槃經本來與法顯在中印度所得的相同十卷以後是從于闐得來而補譯的于闐與中國的大乘經教關係是何等重要與于闐毘連的斫句迦玄奘傳說王宮有般若經華嚴經大集經等十部或傳十二部都是部帙龐大的大乘經鳩摩羅什的大乘空學從莎車王子學來莎車就是斫句迦的一部分于闐與斫句迦大乘教的隆盛比北印度並不遜色反而六世紀後罽賓區的佛教衰落于闐與斫句迦還保持大乘盛行的光榮從地理上看大乘是從犍陀羅烏仗那通過大雪山及葱嶺而東來的法顯等西去玄奘回國也都是這一路線中國初期漢魏晉的大乘教受到這一地區的深切影響這一期的大乘譯師鳩摩羅什是最傑出的他的譯典如大品小品金剛般若經法華經維摩經阿彌陀經中論等一直到現在仍受到讀者的愛好為一切後起的異譯所不及羅什所傳的大乘論如龍樹的大智度論十住毘婆沙論竺法護及弟子們已經抽譯過都是部帙龐大為印度佛教久已失傳了的龍樹的性空大乘學早期流傳北印經斫句迦而傳入中國比起印度晚期的中觀學有點不同印度晚期的中觀理論更嚴密化但不見龍樹的大論自不免有違失原意的地方弘傳羅什學的一向說是道生其實道生是首先離去羅什的人因北方政局衰亂僧肇早死學眾都散去所以羅什的譯典雖傳遍了而龍樹的大乘空義卻一時隱沒潛行了要等到梁代的高麗僧朗到江南來揭起關河古義弘揚三論中論百論十二門論後來發展為三論宗陳代的慧思又到南方來倡導龍樹所傳的法門後來成為天臺宗三論與天臺宗都根據羅什的譯典但經過了中國學者的研求修習發展為有獨到體系的綜合學派大概的說三論宗重於論傳到南方較早更近於羅什所傳的天臺宗南傳遲了些受到北方真常唯心大乘的熏染較深至於攝山三論衡嶽慧思天臺智者都是教觀並重不失龍樹大乘的風格龜茲為嶺東小乘佛教的典型但也多少有大乘流通特別是早期的祕密教龜茲國王姓白龜茲的僧徒到我國來也都稱白或帛如善誦呪役使鬼神的佛圖澄本姓帛善持呪術譯出大灌頂神咒經的尸梨蜜多羅也姓帛三二頃龜茲有大乘而重密咒與于闐不同四錫蘭的佛教羅什時代以後佛教的傳入中國主要為笈多王朝伐彈那王朝時代的佛教真常的唯心的大乘學無論是華僧的西去求法或梵僧的來華傳法都不再偏於北印的罽賓區而是全印度的海道的往來也頻繁起來先說從海道來華有關錫蘭的佛教錫蘭的佛教是阿育王時代傳去的為大寺派的赤銅鍱部不久又有佛教傳入住無畏山寺成為無畏山寺派兼學大乘與大寺派的爭執很熱烈說到從海道而來中國的佛教當然是很早的有人以為安世高從海道來這不過推想而已維祇難二二四來武昌譯出法句經有二十六品五百偈與錫蘭所傳的法句相近我以為這是錫蘭傳來最早的佛典維祇難的同行者竺律炎補充為三十九品七百五十偈從無常品到梵志品部分近於北方有部的法句錫蘭方面的佛教一開始就不能在中國流通真是不可思議法顯三三九去西方求經歸途經過師子國住在無畏山寺得到彌沙塞律這是化地部的五分律與銅鍱部的善見律相近後由佛陀什譯出大概是宋代吧師子國的僧伽跋彌譯出彌沙塞律抄但在中國五分律從來沒有弘通過罽賓學者曇摩耶舍四頃到達廣州這當然是從海道來的他譯出的舍利弗阿毘曇論可斷為分別說系近於化地部的本典他的弟子法度宣說專學小乘禁讀方等唯禮釋迦無十方佛分明為錫蘭小乘佛教面目這在中國當然是行不通的元嘉元年四二四求那跋摩經師子國而到廣州尼眾想請他授戒他要等外國尼來滿足十數後師子國的比丘尼來建業的尼眾再受戒錫蘭的戒律是被中國應用了但不久就被禁止再受永明中四八三四九三摩訶乘在廣州譯出五百本生經他毘利譯義為上座律這無疑是錫蘭的永明六年四八八僧伽跋陀羅從海道來在廣州譯善見律毘婆沙為銅鍱部的律釋有名的眾聖點記就是從此傳出的梁僧伽婆羅在西元五一五年譯出解脫道論這是銅鍱部的要典覺音清淨道論所依據的錫蘭的佛教不能說沒有傳入中國但比起罽賓來缺少精深的義學微密的禪思終於為中國佛教所遺忘了五晚期傳來的小乘經論一切有部為主的罽賓區銅鍱部為主的師子國所有小乘教學而有關中國的已約略說到其他的小乘教學傳譯較遲的應再為敘述小乘的四阿含經各部派是大致相同的還有不屬於阿含部的如魏瞿曇般若流支五三九譯的正法念處經這是一切有與犢子系共傳的但本譯屬於犢子系的正量部還有隋闍那崛多等五八七譯的佛本行集經為法藏部的佛本行集上二書部帙都很大關於論典一切有部的發智論六足大毘婆沙論唐玄奘六四九六六三幾乎完全譯出只缺一部施設足論後由宋施護譯出一部分玄奘對於阿毘達磨的重視可以推見出來失譯的三彌底部論真諦五五九譯出的立世阿毘曇論都是正量部的論典此外譯來中國而有重要意義的有三部論一成實論是鳩摩羅什的譯品論主名訶黎跋摩為中天竺人傳說是薩婆多部鳩摩羅陀的弟子其實就是經部的鳩摩羅陀他不滿有部到中印度的華氏城與容認大乘的大眾部學者共住所以成實論的內容不但以經部義來評破有部又轉而歸向於大眾部所信解的空義法空是三乘所共的不限於大乘的成實論的空義與大乘的究竟空義還有小小的距離成實論在齊梁時真是盛極一時有稱之為成實宗的後經三論與天台學者論證為小乘以後就漸漸衰落了二陳真諦五六三初譯唐玄奘六五一六五四再譯的俱舍論是世親所造的是繼承有部西方師雜阿毘曇心論而更完成的論典表面是有部論而骨子裡卻傾向經部所以廣引經部所說以顯出有部立義的不徹底自從俱舍論譯出以後舊有的毘曇宗就轉名為俱舍宗了其實俱舍論沒有成為獨立的學派只是唯識學者附習的法門而已三婆藪跋摩造的四諦論也是陳真諦譯的論中引用俱舍論及破俱舍論的順正理論所以應為五世紀末的作品四諦論也是出入於有部經部更引用大眾部學與正量部成實論俱舍論四諦論三部論都是經部盛行以後不滿一切有部的作品但都不是純粹的經部而是出入各部自成體系的論典成實論與俱舍論在中國佛教史上有過重大的影響附帶說到律典弗若多羅等譯的十誦律屬於舊有部齊梁時曾盛行江淮一帶為中國律學初期的大宗佛陀跋陀羅與法顯譯的摩訶僧祇律屬大眾部佛陀什譯的五分律屬化地部都沒有什麼流通佛陀耶舍譯的四分律屬法藏部起初也不大流行到北魏尤其是慧光的門下濟濟才大大的弘盛起來到唐代中國的律學已為四分律所統一道宣說四分