用安慧學而作中論釋的德慧西域記稱為南印菩薩所以重因明毘曇唯識學的陳那與安慧二系可說都是東印與南印沿海一帶的大師以那爛陀寺為中心道場的玄奘所傳的雖說專宗護法其實是糅合這二系大成於東方的唯識學代表西方系的如堅慧曾在伐羅毘摩臘婆西北造論勝軍是蘇剌陀人伐羅毘西北玄奘就跟他學大乘莊嚴經論真諦為優陀延人伐羅毘東譯過攝大乘論的達摩笈多是摩臘婆人從阿瑜陀向西南為正量部的化區正量部立不可說我與如來藏說類似所以這一帶傳出的唯識學都接近於真常大乘不過真諦是重論的代表初期而流入北印的菩提流支系所譯而一向看作世親論的共有八部都是經的注釋在彌勒學系中這是重經的北方派八大乘禪真常的唯心的經論傳來時大乘禪觀也同時傳入其中菩提達摩一系在中國有非常的發展演化為禪宗依唐初傳說達摩為南天竺或說是波斯人劉宋時約四四頃從南天竺經海道來中國江南其後才渡江到北魏這一傳說大體是可信的因為此宗一名南天竺一乘宗而達摩在北魏傳禪用宋譯的楞伽經來印心不用菩提留支的魏譯楞伽經宋譯更富於真常的特色如立真識說藏識海常住都與魏譯不同禪宗初稱如來禪也出於宋譯楞伽經魏譯是名為觀察如來禪的達摩所傳的禪法當時曇林敘錄為二入四行一理入是以凝住壁觀不落凡聖有無的方便悟入含生同一真性二行入就是四行是見於實際的事行在悟入以後起心接物時能正念現前不為怨憎會愛別離求不得的眾苦所惑亂更要與真性相應而修布施等六度大行這樣的做到動靜一如自他俱利含生同一真性客塵障故為本具如來藏的教授所以達摩的禪觀代表南印度直體真常的如來藏禪他的凝住壁觀後世有九年面壁的傳說南方的禪者都在壁上作曼陀羅此名不限於密宗而後諦心觀察所以達摩的壁觀也可看出南印度禪師的風格中國古代的禪宗為了禪宗的傳承譜系說達摩繼承了罽賓的禪系因為罽賓的禪系中國略有傳承的次第可求於是或者說達摩就是傳天竺頓教到罽賓的達摩多羅但達摩多羅與佛大先同時而佛大先早在五世紀初就死了或者說達摩繼承師子尊者以後為二十八祖不知罽賓滅法的彌羅崛殺害師子尊者的為西元五世紀末人那時達摩來華已半個世紀了怎會是師子尊者的後裔呢得達摩禪法的是慧可或名僧可與達摩同時先後從陸道而來北土的禪師有佛陀與勒那摩提佛陀於孝文帝時就來了後又隨帝遷都來洛陽門下有道房與慧光著名的僧稠禪師是道房的弟子中天竺的勒那摩提深明禪法就是十地經論與寶性論的譯者弟子有僧實據說慧光本從佛陀受禪後來才從勒那摩提受十地經論等有的說慧光與道房都是勒那的弟子作為地論宗與律宗大師的慧光最值得注意他是受禪法而又不離文教並重視戒律的傳承法性能生一切法的大師不屬於菩提留支系統慧光與佛陀及勒那摩提的關係極深與同時由南方傳來的達摩禪法可能相近不但達摩門下的六祖說自性能生萬法從慧光所傳而發展成的華嚴宗也說性起後人且有教禪一致的傾向甚至在傳說上也大都近似如佛陀稱少林祖師達摩也傳在少林寺面壁佛陀度二弟子達摩也有二沙彌勒那與菩提留支的意見不合達摩也傳說為留支所害勒那弟子慧光達摩弟子慧可本名神光總之達摩與勒那都是南方真常大乘的禪者與傳承學出北方瑜伽的菩提留支是有距離的當然達摩弟子慧可重於不落名相的禪的悟證而勒那弟子慧光重於不離名相的教的建立也有不同的所在九後期的中觀學印度的中觀大乘龍樹提婆以後是相當衰落了在真常大乘勃興中傳為龍樹弟子的如來賢又名龍叫弘揚唯心中道被稱為提婆弟子的羅睺羅開始以常樂我淨來解說中論的八不這都可見傾向於真常唯心了要到世親以後僧護的弟子南印度坦婆羅的佛護與摩羅耶王族清辯出來中觀學方又中興起來化區在南印與中印度的瑜伽唯識對立引起了中觀與唯識空與有的諍論佛護的再傳弟子月稱約在護法與戒賢時代六世紀不滿清辯的引用世俗的因明自立比量所以自稱應成而分為兩派月稱一派在西藏有最崇高的地位等到波羅王朝成立佛教的重心東移那爛陀的教學權威開始衰退中觀大乘在南印度也同時衰落了清辯的中觀派卻在東方盛行起來如智藏靜命及弟子蓮華戒獅子賢等都是東方的中觀大師與密乘相結合的自羅什以後龍樹論在中國也還有譯出的如陳真諦譯的寶行王正論藏傳名寶鬘論魏毘目智仙五四一譯的迴諍論唐達摩笈多六三頃譯的菩提資糧論等這些都由無著世親系的譯師附帶譯出可見當時印度中觀學的衰落趙宋施護譯的六十如理論大乘二十頌論也都是龍樹重要的論典說到印度後期的中觀學清辯的般若燈論唐明友六三六三二譯大乘掌珍論唐玄奘六四九譯施護譯的廣釋菩提心論是蓮華戒造的此外佛護月稱清辯靜命師子賢等論典都不曾譯出卻傳入了西藏這由於晚期的中觀盛行都在東方那時唐室中衰僧侶的往來由漸少而中斷了僅有的來中國弘化的那提六五五六六三又為玄奘門下所嫉忌而無法傳譯據當時的道宣說那提是中天竺人曾去南印師子國是龍樹系的學者他所解無相空義與玄奘碩反稱讚他為大師隱後斯人第一可是他帶來的梵本被玄奘門下帶走了那提乃三次被毒再次充南洋群島的遠役真是法門的損失十祕密教祕密教的傳弘初與罽賓區的瑜伽師有關佛陀跋陀羅所傳的小乘禪觀集成於四世紀就稱為圓滿清淨法曼陀羅分二種次第來修習其後發達廣布到全印要在密咒盛行的區域密法才容易流傳印度雖通行咒術而烏仗那是禁呪為藝業的特區西藏傳說僧護以前四世紀前烏仗那的人民就有修密行而得成就的但還在潛行時期到僧護時事部與行部始顯著的流行依帛尸黎密帝羅三二頃來華譯出大灌頂神咒經而說事部的流行至少為三世紀中魏譯五一三頃入楞伽經總品宋譯缺就有佛及化身三十六說與金剛頂經的三十七成身相合那麼瑜伽部的傳出非五世紀不可行部的大日經重於本具的自性清淨心如來藏心瑜伽部的金剛頂經重於修顯多用唯識義這都是成立在真常唯心基礎上的如約四法界說事部是事法界行部是理法界瑜伽部是理事無礙法界還有事事無礙法界當然就是無上瑜伽部了元代從西藏傳入的演揲兒法無上瑜伽就以為是事事無礙的以男女和合為特徵或用智印或用業印的無上瑜伽法實在悠久得很譯真常大我經的曇無讖四一四四三魏書說他善男女交接之術隋闍那崛多五九五譯的大威德陀羅尼經就說到於一夜中已得是法的法門但據經說罽賓佛教的遭受大破壞五世紀後半世紀就是為了這個所以經上痛心說此是因緣滅正法教玄奘六二九六四五義淨六七一六九五西遊知道有密法還沒有發覺到無上瑜伽開元三大士七一六來還沒有傳授無上瑜伽所以無上瑜伽在印度的公開盛行被認為最高的佛法不會早於七世紀的後五十年來中國傳譯密典的陳隋間開始多起來如烏萇的那連提耶舍犍陀羅的闍那崛多到盛唐密風越來越盛對於佛頂尊勝不空羂索千臂千眼如意輪傳譯的次數特別多譯師中南印度的菩提流志六九四來義淨六九五回傳譯較多北方的嵐波迦溼蜜罽賓唐代指迦畢試覩貨羅及于闐來的也多少傳譯當時的北方佛法已衰落了中印度的阿地瞿多六五二在長安建立了陀羅尼普集會壇譯出陀羅尼經對於密法的組織傳授才算有了規模這是中印度傳來的西元七一六年善無畏來傳行部胎藏界的大日經他從中印度那爛陀寺的達摩毱多得法傳說達摩毱多就是玄奘在北印度磔迦國所見的長壽婆羅門也就是龍智被稱為中天竺釋種的善無畏實為曾作北印度烏萇國王的塞迦族他的大日經供養次第法據弟子不可思議疏說是在犍陀羅金粟王迦尼色迦王所造塔邊從文殊在空中所現的而傳出來依此人法的地點去考察說大日法門為曾住北印的龍智所傳出實無不可中印度的金剛智七一九來從南天竺的龍智學傳出金剛頂經金剛界金剛智弟子不空回印度去求法七三二年在師子國見到普賢阿闍黎或說名寶覺阿闍黎請開十八會法而法高等的表奏說不空和上又西遊天竺師子等國詣龍智阿闍黎揚搉十八會法那麼普賢就是龍智曾經南行到錫蘭了傳入中國的密宗稱為兩部大法胎藏與金剛就是行部與瑜伽部都與龍智有關從傳說中見到密法由北而南的史實遲一些來華的般若七八六來曾在南天竺從達摩耶舍受密法然密部的無上瑜伽在提婆波羅父子時代傳說龍智大為弘通中印度東方的密乘要到宋初才有所譯出但沒有弘通所以中國及傳入日本的密宗主要為前三部而無上瑜伽只能求之於西藏了
