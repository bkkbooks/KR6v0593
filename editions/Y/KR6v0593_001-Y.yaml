body:
  text: 以佛法研究佛法來寶島一年對於佛教的近代作品讀了不少而最使我同情的引起非常感想的是這樣的一句我們應以佛法來研究佛法這是絕對的正確佛法佛法我們經常的在說著寫著假如離開佛法的立場本著與生俱來的俗知俗見引用一些世學的知見拿來衡量佛法研究佛法這還成什麼話還能不東倒西歪非驢非馬嗎以佛法來研究佛法這是必要的萬分的必要然而什麼叫以佛法來研究佛法論題容易提出而內容卻還等待說明趁這還山度歲末的餘暇不妨將我所理解的提出來貢獻大家作為新年的供養但這是我所理解到的佛法一滴不敢說絕對正確不過貢獻以佛法來研究佛法的同人作參考我也是自以為以佛法來研究佛法的我以為所研究的佛法不但是空有理事心性應該是佛教所有的一切教理行果教是一切經律論也可包含得佛教的藝術品六塵都是教體這都有表詮佛法的功能理是一切義理究竟深義行是個人的修行方法大眾的和合軌律果是聲聞緣覺與佛陀的聖果這一切佛法要以什麼去研究才算以佛法研究佛法我以為所研究的佛法是佛教的一切內容作為能研究的方法的佛法是佛法的根本法則普遍法則也可說最高法則佛所說的法性法住法界就是有本然性安定性普遍性的正法這是遍一切處遍一切時遍一切法的正法大而器界小而微塵內而身心一切的一切都契合於正法不出於正法所以說無有一法出法性外一切法皆如也這是一切的根本法普遍法如依據它應用它來研究一切佛法這才是以佛法來研究佛法研究的方法研究的成果才不會是變了質的違反佛法的佛法怎樣是法性法住法界的正法從相對而進入絕對界說法是空性真如也稱為一實相印從絕對一法性而展開於差別界說那就是緣起法的三法印諸行無常性諸法無我性涅槃寂靜無生性因為無有常性所以豎觀一切無非是念念不住相似相續的生滅過程因為無有我性所以橫觀一切無非是展轉相關相依相住的集散現象因為無有生性所以直觀一切無非是法法無性不生不滅的寂然法性龍樹論說三法印即是一法印如違反一法印三法印也就不成其為法印了不錯真理是不會異樣的這是佛所開示的一切法的究竟法也是展開於時空中的一般法研究佛法應該把握這樣的法則隨順這樣的法則來研究我以為這才算是以佛法來研究佛法才能正確地體認不違反佛法的佛法然而我們果曾應用這佛法去研究佛法了嗎一諸行無常法則佛法在不斷的演變中這是必須首先承認的經上說若佛出世若不出世法性法住這是依諸法的恆常普遍性說一旦巧妙的用言語說出構成名言章句的教典發為思惟分別的理論那就成為世諦流布照著諸行無常的法則而不斷變化至於事相的制度表顯佛法的法物等更在不斷演化中且以佛教的制度為例釋尊最初在鹿苑度五比丘出家人數少根性利所以只簡單的提示了師友間的生活標準到出家的信眾一多不論從人事的和樂上看修學的策導上看環境的適應上看都非有團體間共守的規約不可十二年後制戒組織也就一天天的嚴密起來僧團的規律因種種關係制了又開開了又制佛滅後弟子間因思想與環境的不同分化為大有出入的僧制有從嚴謹而走上瑣碎的如上座部有從自由而走上隨宜的如大眾部佛教到中國來雖沒有全依律制起初也還是依律而共住的後來先是律寺中別立禪院發展到創設禪院的叢林逐漸的產生祖師的清規這清規還是因時因地而不同到現在又漸有不同於過去戒律中心禪那中心而出現義學中心的僧團總之佛法的思想制度流行在世間就不能不受著無常演變法則所支配若把它看成一成不變的東西或以為佛世可以變異後人唯有老實的遵守說什麼放之四海而皆準推之百世而可行或以為祖師才能酌量取捨我們只有照著做這就是違反了佛法諸行無常法則的佛法無常是生滅的生是緣起的生起不是因中有果而生無果而生我們得應用諸行無常的無性緣生去研究理解佛法中某一宗派某一思想某一行法某一制度某一事件的產生且以無著的唯識學為例如果說像無著所說的唯識學在佛世已圓滿而具體的成立無著不過從慈氏那邊聽來原樣不動的把它傳出而已這等於說本來成就了的東西從新出現這是自生不是諸行無常的因緣生若說佛世根本沒有無著假託彌勒而獨創的或從某一學派直接產生的這也不正確這是它生如果說唯識學雖是本有的但由種種學派的引發種種環境的需要而出現的這還是共生而不是緣生若說自然而有沒有因緣可說那更是無因生的邪見了那到底是怎樣產生成立的呢是緣生緣成是幻化無性的發展過程先須理解無著的唯識學是發展中的成立階段到此時充分而確定地成立了唯識學的特質唯識學的精義本沒有不變的自體性在不斷的演化中成立成立了也還是不斷的演化佛世有唯識的傾向有可以解說為唯識的章句演化到無著學的階段是從種種問題種種思想經無限錯綜演化而來這其中自然有主要的因緣成立唯識思想的條件在印度佛教界的某一角落裡發展到快要成熟除了時代思潮或順或逆的激發特別是受了無著的師承熏修與個人的嚴密思想的融合發揮才有無著唯識學的出現成立了經世親陳那護法諸大師的傳弘還是在不斷的演化中然而始終不曾離棄唯識學的特質主要的意義始終還是唯識學如含有大量墨色素的流水水雖不息的流變而在不失墨色的特徵以前永遠還是墨水一樣再說到諸行無常的滅在空行緣起的見地中滅不是沒有斷滅是因緣和合中的一種現象它與生是同樣的存在忽略了滅是緣起法之一才說滅不待因所以研究佛學對於學派思想與制度的衰滅廢棄都應一一研究它的因緣同時滅是緣起所以它必然要影響未來成為後後的思想制度生滅的因緣的確滅去的已經滅去歷史不會重演但歷史的事實在緣起的演化中對未來始終起著密切的影響現代的佛法研究者每以歷史眼光去考證研究如沒有把握正確的無常論往往會作出極愚拙的結論有人從考證求真的見地出發同情佛世的佛教因而鼓吹錫暹式的佛教而批評其它的這種思想不但忽略了因時因地演變的必然性並漠視了後代佛教發掘佛學真義的一切努力與成果愈古愈真愈善的見地把清代的漢學者送到孔子托古改制的最後一步我想拙劣的原始佛教者也必然要作出釋尊是印度文明發展中的成就者的謬論有些人受了進化說的眩惑主張由小乘而大乘而空宗而唯識而密宗事部行部一直到無上瑜伽愈後愈進步愈圓滿這與上一類見解恰恰相反但是同樣的錯誤從諸行無常生滅的見地去看前一生滅系與後一生滅系前因後果的鉤鎖演變不是命定的進化與退化不論是佛法全體或其中某一思想某一制度某一行法都在或上升或下降或維持現象中推移在每一階段中還都有新的確立舊的廢棄從個別觀察到整體是異樣複雜的愈古愈真者忽略了真義的在後期中的更為發揚光大愈後愈圓滿者又漠視了畸形發展與病態的演進我們要依據佛法的諸行無常法則從佛法演化的見地中去發現佛法真義的健全發展與正常的適應三世如幻沒有前後隔別的剎那生滅前因後果的相續是緣起的不即不離的相續因此因滅果生不是從甲的斷滅而生起截然不同的乙甲乙間有著不可離的關係所以研究佛法要從無限錯雜的演變中把握它相續的一貫共同性這或者是密教的共義大乘的共義出世法三乘的共義世出世法五乘的共義這或者是一時一地的共義一宗一系的共義這必須在新新非故的無常中去把握它所謂共通一貫的理論或制度近於變易中的不易但它決非有一真常自體的存在而是流變中的相對安定性是唯識學所說的似一似常這樣的研究佛法才能成為一貫的有條不紊的二諸法無我法則諸法無我是緣起三法印的中心是完成學佛目的的樞紐深入無我而體證的實義姑且不談現在從兩方面說明怎樣把它應用到研究中研究佛法應有無我的精神無我是離卻自我神我的倒見不從自我出發去攝取一切在佛法研究中就是不固執自我的成見不存一成見去研究若主觀的成見太強就難得正見經論的本義依佛法的見地認識是能知所知間互相緣成的覺用本沒有離卻主觀的純客觀的認識並且還是特別受著過去熏習的限制但如能不有意的預存成見那在構成認識時能更逼近經論的本義經論本是依著人類共許的假名而安立的一般宗派的學者固執他所宗的行解為標準在研究講說時不問經的內容如何只將自己所學的那一套湊上去等於不問對方的頭大頭小就拿自己頭上的帽子去套如果有了這種成見去治佛法結果是可以想像的這一步工夫不容易做到但我們總得注意去學漸漸的減輕自己的私見減少成見的方法這裡不妨一談嘉祥大師說將此等戲論掃盡自見經論本意這實在是難得的名言在研究一經一論時切莫自作聰明預存見解也莫偏信古說大翻注釋最好在這一經一論的本身上去尋求解說前後互相發明若不能獲得明確的定義與見解再從與此經此論思想很接近的經論中去參考如研究般若經可以參考思益經持世經無行經無盡意經等經中論大智度論等論如一時不能理解這儘可由它不懂應該多聞闕疑把它筆記下來再慢慢的求參考勿穿鑿附會自以為然只要知道沒有懂那將來見聞稍廣一定會恍然明白於無意中得之這樣的研究確乎要多用點思惟但所得的成果決不是那些背注解抄注解翻文言為白話注解的學者所可及的無我我們說得多也聽得慣了在治學辦事中也該多少拿出一點來再從法無我的見地研究世間沒有獨立存在的東西都與其它的一切有關在展轉的相攝相拒中成為現實的一切所以一切法無我唯是相依相成的眾緣和合的存在一切法如此佛法當然不能例外如中國的天臺宗是以龍樹論意為中心的在這個基礎上它融攝了北地的地論師與禪宗南方的成論大乘與三論大乘同時又批判它若離了這些禪宗地論師成論師三論師的思想就是悟到三智一心中得也不會有五時八教四悉六即一念三千的妙論北地的地論師又在自己的根本思想上取捨天臺的思想成立賢首宗天臺到荊溪以後漸漸引用華嚴經大乘起信論的教義這才演成了山外派這展轉相關不但是異時的內部的也與同時的其他的學術有著密切的關聯這是無我諸法的自它緣成還有諸法的存在是眾緣和合的是眾緣和合所以在那現起似乎整個的一體中內在的具有多方面的性質與作用像釋尊的本教不論從它的真實或方便適應上看這融然一體的佛法是無限深廣的因此種種差別必須從似一的和合中去理解而一味的佛法又非從似異的種種中去認識不可這是無我諸法的總別無礙也就因此在佛法的演變中真實與方便都有偏重發展的傾向從眾緣和合的一體中演為不同的思想體系構成不同的理論中心佛法是分化了它本是一體多面的發揮富有種種共同性因之在演變中又會因某種共同點而漸漸的合流合而又離離而又合佛法是一天天的深刻複雜這裡面也多有畸形的偏頗的發展成為病態的佛教這是無我諸法的錯綜離合它雖離合無端但依然很明顯的表現出幾個不同的思想體系幾個不同的理論中心它不是單純的從甲發展到乙也不是本有甲乙兩者不相關的平行發展它是錯綜離合的所以或想像佛法派別思想本來就有種種或以為單純一線的演進而成如從小乘而大乘從空宗而有宗等都是不解無我諸法的錯綜離合的真相顛倒說法三涅槃寂靜法則涅槃是學佛者的歸趣所在有的經中從諸行無常去成立它所以說以生滅故寂滅為樂有的從諸法無我去成立它所以說無自性故不生不滅本來寂靜自性涅槃也有從無常到無我從無我而顯示這寂滅性的總之這是緣起法的寂滅性是有情緣起流轉中的眾緣和合體離卻顛倒戲論而體現到的真實自在的聖境像波浪掀騰而轉為風平浪靜的一池春水像從炎熱的驕陽而移住露溼桂香的月明之夜佛法研究是為了它它就是一一法離染的實相它從沒有離卻我們我們卻不能理會它凡是佛法的研究者不但要把文字所顯的實義體會到學者的自心還要了解文字語言的無常無我直從文字中去體現寂滅古來多少大德讀一經聞一偈就廓然悟入這寂滅的聖境像舍利弗的聽說緣起偈慧能的聽應無所住而生其心等都能直下悟入文字性空即解脫相能具足深入這個見解多聞正思到工夫成熟時也不難直入個中文字研究不一定是淺學這在研究者的怎樣研究用心罷了涅槃有真實解脫的意思佛法研究者在還沒有直接接觸到它的時候也就該把它作為最後的歸結勇猛前進所以學佛者具備真理的探求解脫的實現的信念研究佛法既不是學點談話資料又不是為自己的名譽利養作工具是要想從修學中去把握真理如釋尊的為真理而犧牲一切玄奘的去印度求法不憚一切的危難趙州的八十歲行腳無不是為了真理的探求研究佛法者若有了這一念心一切都有辦法佛法的探求真實在解脫自他的一切苦痛這需要兌現如把真理放在書本上口頭上不能淨化自己的身心治學辦事待人接物還是從前一樣這顯然沒有把涅槃一事放在心中並沒有體驗真理實現解脫的企圖佛法研究是不應如此的依緣起三法印去研究佛法也就是依一實相印法空性去研究我以為這才是以佛法來研究佛法這才能把握合於佛法的佛法
